<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
:root{--navy:#0A1E46;--red:#D71920;--bg:#F8FAFC;--card:#fff;--line:#E2E8F0;--txt:#0F172A;--mut:#64748B;--ok:#16A34A;--tbh:72px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
.hidden{display:none!important}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.ico{width:18px;height:18px;vertical-align:middle}
/* Material 3 controls */
.field{position:relative;margin-bottom:16px}
.field input{width:100%;height:52px;border:1px solid #94A3B8;border-radius:12px;padding:18px 14px 6px 44px;font:inherit;background:#fff;outline:none;transition:.15s}
.field input:focus{border:2px solid var(--navy);padding:17px 13px 5px 43px}
.field label{position:absolute;left:44px;top:16px;color:var(--mut);pointer-events:none;transition:.15s}
.field input:focus+label,.field input:not(:placeholder-shown)+label{top:5px;font-size:11px;color:var(--navy);font-weight:600}
.field>i,.field>svg{position:absolute;left:14px;top:16px;color:var(--mut);width:20px;height:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 22px;border:0;border-radius:22px;font:600 14px Inter;cursor:pointer;transition:.15s}
.btn-primary{background:var(--red);color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}.btn-primary:hover{background:#B9141A;box-shadow:0 3px 8px rgba(215,25,32,.35)}
.btn-tonal{background:#E0E7F5;color:var(--navy)}.btn-tonal:hover{background:#CDD8EE}
.btn-ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);height:36px;padding:0 14px;font-size:13px}.btn-ghost:hover{background:rgba(255,255,255,.12)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);cursor:pointer}.chk input{accent-color:var(--navy);width:18px;height:18px}
/* Login */
#loginGate{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0A1E46 0%,#13306E 60%,#0A1E46 100%);padding:20px}
.login-box{width:100%;max-width:420px;padding:32px}
.login-head{text-align:center;margin-bottom:24px}
.login-head h1{color:var(--navy);font-size:28px;font-weight:800;letter-spacing:2px}
.login-head p{color:var(--mut);font-size:11px;letter-spacing:1px;margin-top:4px;text-transform:uppercase}
.emblem{min-width:136px;max-width:240px;height:68px;padding:0!important;border-radius:14px;background:#fff!important;display:inline-flex;align-items:center;justify-content:center;margin:0 auto 12px;color:#fff;border:2px solid var(--red)}
.err{color:var(--red);font-size:13px;min-height:18px;margin-bottom:8px}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.stack{display:flex;flex-direction:column;gap:10px}
/* Shell */
.topbar{background:var(--navy);color:#fff;display:flex;align-items:center;gap:20px;padding:0 24px;height:72px;position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:center;gap:14px}
#emblemSlot{min-width:88px;max-width:140px;height:48px;padding:0!important;border-radius:10px;border:2px dashed rgba(255,255,255,.45);display:inline-flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;flex:none;background:#fff!important}
#emblemSlot img{width:100%!important;height:100%!important;max-width:100%!important;max-height:100%!important;object-fit:fill!important;display:block}
#loginEmblem img{width:100%!important;height:100%!important;max-width:100%!important;max-height:100%!important;object-fit:fill!important;display:block}
.brand h1{font-size:28px;font-weight:800;text-transform:uppercase;letter-spacing:2px;line-height:1}
.brand small{display:block;font-size:10px;letter-spacing:1.2px;opacity:.75;margin-top:4px}
.search{flex:1;max-width:360px;margin-left:auto;position:relative}
.search input{width:100%;height:40px;border-radius:20px;border:0;padding:0 16px 0 40px;background:rgba(255,255,255,.12);color:#fff;font:inherit;outline:none}
.search input::placeholder{color:rgba(255,255,255,.6)}.search input:focus{background:rgba(255,255,255,.2)}
.search svg,.search i{position:absolute;left:13px;top:11px;width:18px;height:18px;color:rgba(255,255,255,.7)}
.clock{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;line-height:1.2}.clock small{display:block;font-size:10px;opacity:.7;font-weight:400}
.net{padding:5px 12px;border-radius:14px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
.net.on{background:rgba(22,163,74,.2);color:#4ADE80}.net.off{background:rgba(215,25,32,.25);color:#FCA5A5}
.net:before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.userbadge{display:flex;align-items:center;gap:10px;font-size:13px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--red);display:grid;place-items:center;font-weight:700}
.tabs{background:#fff;border-bottom:1px solid var(--line);display:flex;gap:4px;padding:0 24px;overflow-x:auto;position:sticky;top:var(--tbh,72px);z-index:40}
.tabs button{display:flex;align-items:center;gap:8px;padding:16px 18px;border:0;background:none;font:600 14px Inter;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--navy);background:#F1F5F9}.tabs button.active{color:var(--navy);border-bottom-color:var(--red)}
main{max-width:1400px;margin:0 auto;padding:24px}
.hero{background:linear-gradient(120deg,#0A1E46 0%,#14346F 100%);border-radius:16px;color:#fff;display:grid;grid-template-columns:1.1fr 1fr;min-height:220px;overflow:hidden;margin-bottom:24px;position:relative}
.hero-txt{padding:32px;z-index:2;display:flex;flex-direction:column;justify-content:center;gap:10px}
.hero-txt h2{font-size:30px;font-weight:800}.hero-txt p{opacity:.8;max-width:460px;line-height:1.5}
.hero-txt .tag{display:inline-block;background:var(--red);padding:4px 12px;border-radius:12px;font-size:11px;font-weight:700;letter-spacing:1px;width:max-content}
#heroSlideshow{position:relative;min-height:220px;overflow:hidden;clip-path:polygon(12% 0,100% 0,100% 100%,0 100%);
 background:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 2px,transparent 2px 28px),linear-gradient(135deg,#1B3F85,#0A1E46)}
#heroSlideshow .geo{position:absolute;inset:0;display:grid;place-items:center;opacity:.25}
#heroSlideshow .geo:before{content:"";width:180px;height:180px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 30px rgba(255,255,255,.08),0 0 0 60px rgba(215,25,32,.12)}
#heroSlideshow img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.5s ease}
#heroSlideshow img.show{opacity:1}
.hero-actions{position:absolute;bottom:12px;right:14px;z-index:3}
.tab-pane{display:none}.tab-pane.active{display:block}
/* Oracle-style tables & audit */
table.ora{width:100%;border-collapse:collapse;font-size:13px}
table.ora th{background:#EEF2F7;color:var(--navy);text-align:left;padding:9px 12px;border:1px solid var(--line);font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.5px}
table.ora td{padding:8px 12px;border:1px solid var(--line)}table.ora tr:nth-child(even) td{background:#F8FAFC}table.ora tr:hover td{background:#EAF0FA}
.audit{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#0F172A;color:#CBD5E1;border-radius:12px;padding:14px;max-height:260px;overflow:auto}
.audit .t{color:#64748B}.audit .u{color:#7DD3FC}.audit .a{color:#FCA5A5}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1E293B;color:#fff;padding:12px 22px;border-radius:12px;z-index:999;opacity:0;pointer-events:none;transition:.25s}
#toast.show{opacity:1}
@media(max-width:800px){
 .hero{grid-template-columns:1fr}#heroSlideshow{clip-path:none;min-height:140px}.brand h1{font-size:22px}
 /* clean multi-row mobile header with guaranteed visible logout button */
 .topbar{height:auto;min-height:60px;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 12px}
 .brand{flex:1 1 auto;min-width:0;gap:10px}
 .brand h1{font-size:20px;letter-spacing:1.5px}
 .brand small{display:block!important;font-size:8.5px;letter-spacing:.6px;line-height:1.25;white-space:normal;margin-top:3px}
 .userbadge{order:0;display:flex!important;align-items:center;gap:6px;flex-shrink:0;margin-left:auto}
 .userbadge span{display:none!important}
 #btnLogout{display:inline-flex!important;align-items:center;justify-content:center;flex-shrink:0;width:36px;height:36px;min-width:36px;padding:0;border-radius:10px;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.14);color:#fff!important;font-size:0;gap:0}
 #btnLogout .ico,#btnLogout svg{display:block!important;width:18px;height:18px;color:#fff!important;stroke:#fff!important;opacity:1!important;visibility:visible!important}
 .clock{display:block!important;order:1;flex:1 1 auto;text-align:left;font-size:13px}
 .clock small{font-size:9px}
 .net{order:2;flex-shrink:0;padding:4px 9px;font-size:11px}
 .search{order:3;flex:1 1 100%;max-width:none;margin:0}
 .tabs{padding:0 8px}
 .in,select.in,textarea.in,.field input{font-size:16px} /* stops iOS zoom-on-focus */
}
@media(max-width:380px){.brand h1{font-size:18px}.userbadge span{max-width:84px}}
</style>
<style id="dash-css">
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;position:relative;transition:.15s;display:flex;flex-direction:column;gap:6px}
.kpi:hover{box-shadow:0 6px 18px rgba(10,30,70,.12);transform:translateY(-2px)}
.kl{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}.kv{font-size:38px;font-weight:800;color:var(--navy);line-height:1}
.kpi small{color:var(--mut)}.kpi>.bdg{position:absolute;top:16px;right:16px}
.don{position:relative;width:84px;height:84px}.don b{position:absolute;inset:0;display:grid;place-items:center;font-size:18px;color:var(--navy)}
.dgrid{display:grid;grid-template-columns:1.6fr 1fr;gap:20px}.dcol{display:flex;flex-direction:column;gap:20px;min-width:0}
.card h3{font-size:15px;color:var(--navy);margin-bottom:14px;display:flex;align-items:center;gap:8px}

.qrow,.rm{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.qrow:last-child,.rm:last-child{border:0}
.qbt{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.qbt small,.qrow small,.rm small{color:var(--mut);font-size:11px}
.mini{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 11px;border-radius:14px;font:600 12px Inter;text-decoration:none;color:#fff;cursor:pointer}
.mini .ico{width:14px;height:14px}.mini.wa{background:#16A34A}.mini.em{background:var(--navy)}.mini.call{background:#475569}.mini.sentb{background:#DCFCE7;color:#166534;cursor:default}
.bdg{display:inline-block;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:700;background:#E2E8F0;color:#334155}
.bdg.r{background:#FEE2E2;color:#B91C1C}.bdg.a{background:#FEF3C7;color:#B45309}.bdg.g{background:#DCFCE7;color:#166534}
.rb{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12px}.rb>span{width:130px}.rb b{width:38px;text-align:right}
.bar{flex:1;height:8px;background:#E2E8F0;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%}
.live{font-size:12px;color:var(--mut);margin-bottom:8px;display:flex;align-items:center;gap:8px}.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pl 1.5s infinite}
@keyframes pl{50%{opacity:.3}}.audit div{padding:3px 0;border-bottom:1px solid #1E293B}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;text-align:center}.wb{height:70px;background:#EEF2F7;border-radius:6px;display:flex;align-items:flex-end;margin-bottom:4px}.wb i{display:block;width:100%;background:var(--navy);border-radius:6px}
.wk small{display:block;color:var(--mut);font-size:11px}.wt{display:flex;justify-content:space-around;margin-top:14px;font-size:12px;color:var(--mut)}.wt b{color:var(--navy);font-size:18px}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.dgrid{grid-template-columns:1fr}}
</style>
<style id="crew-css">
.tb{display:flex;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.grow{flex:1;min-width:0}
.ch{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{height:32px;padding:0 14px;border:1px solid #94A3B8;border-radius:8px;background:#fff;font:600 13px Inter;color:var(--txt);cursor:pointer}.chip:hover{background:#F1F5F9}.chip.on{background:#E0E7F5;border-color:var(--navy);color:var(--navy)}
.in{width:100%;height:44px;border:1px solid #94A3B8;border-radius:12px;padding:0 12px;font:inherit;background:#fff;outline:none}.in:focus{border:2px solid var(--navy);padding:0 11px}
textarea.in{height:80px;padding:10px 12px;resize:vertical}.lb{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--mut)}
th.s{cursor:pointer;user-select:none}tr.cr{cursor:pointer}.btn.sm{height:32px;padding:0 14px;font-size:12px}button.mini{border:0}
.mini.nv{background:var(--navy)}.mini.gy{background:#475569}.mini.rd{background:var(--red)}
.sw{width:40px;height:22px;border-radius:11px;border:0;background:#CBD5E1;position:relative;cursor:pointer}.sw:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}.sw.on{background:var(--ok)}.sw.on:after{left:21px}
.ic{width:34px;height:34px;border:0;border-radius:50%;background:transparent;cursor:pointer;color:var(--mut);display:inline-grid;place-items:center}.ic:hover{background:#EEF2F7}
.mo{position:fixed;inset:0;background:rgba(10,30,70,.55);display:grid;place-items:center;z-index:200;padding:16px;overflow:auto;-webkit-overflow-scrolling:touch}
.md{background:#fff;border-radius:16px;width:100%;max-width:880px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.3)}.md.sm{max-width:480px}.md.lg{max-width:920px}
.hd{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}.hd h3{color:var(--navy);font-size:17px}
.bd{padding:20px;overflow:auto;flex:1}.ft{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line)}
.mt{display:flex;border-bottom:1px solid var(--line);padding:0 12px;overflow-x:auto;flex-shrink:0;min-height:44px}.mt button{display:flex;gap:6px;align-items:center;padding:11px 14px;border:0;background:none;font:600 13px Inter;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;flex-shrink:0}.mt button.on{color:var(--navy);border-bottom-color:var(--red)}
@media(max-width:700px){.md:not(.sm){max-height:95vh;width:100%}.md:not(.sm) .hd{padding:10px 14px;gap:8px}.md:not(.sm) .hd h3{font-size:15px}.md:not(.sm) .hd .av{width:36px;height:36px;font-size:13px}.md:not(.sm) .bd{padding:14px}.md:not(.sm) .ft{padding:10px 14px}.mt{padding:0 6px}.mt button{padding:10px 10px;font-size:12px;gap:4px}}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.sh{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);font-weight:700;margin:18px 0 6px}
.av{width:44px;height:44px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;overflow:hidden;flex:none}.av img{width:100%;height:100%;object-fit:cover}.av.big{width:96px;height:96px;font-size:28px}
.rw{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.rw>b{width:150px;color:var(--navy);align-self:center}.rw .in{width:150px}
.fb{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.fn{font-size:12px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--navy)}
.pv{padding:12px;overflow:auto;text-align:center}.pv img{max-width:100%}.pv iframe{width:100%;height:70vh;border:0}
@media(max-width:700px){.g2{grid-template-columns:1fr}.rw>b{width:100%}}
</style>
<style id="pdf-css">
.stk{display:flex;flex-direction:column;gap:20px}.rp{color:var(--mut);font-size:12px;line-height:1.5;margin-bottom:14px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.th{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#F8FAFC}
.th img{width:100%;height:90px;object-fit:cover;display:block}.th .fb{justify-content:center;padding:4px}.ic:disabled{opacity:.3;cursor:default}
</style>

<style id="step2-css">

<body>

<!-- LOGIN GATE -->
<div id="loginGate">
 <div class="card login-box">
  <div class="login-head">
   <div class="emblem" id="loginEmblem" style="overflow:hidden"><i data-lucide="plane"></i></div>
   <h1>YPTRMS</h1><p>Yemenia Pilot Training &amp; Records Management</p>
  </div>
  <form id="loginForm" autocomplete="on">
   <div class="field"><i data-lucide="user"></i><input id="lgId" placeholder=" " autocomplete="username" required><label>Email or Staff ID</label></div>
   <div class="field"><i data-lucide="lock"></i><input id="lgPw" type="password" placeholder=" " autocomplete="current-password" required><label>Password</label></div>
   <div class="row"><label class="chk"><input type="checkbox" id="lgRemember"> Remember Me</label></div>
   <div class="err" id="lgErr"></div>

<script>
/* YPTRMS Step 1A-1 — trial default password for all 5 manager slots: Yemenia@2026 (change in Settings module) */
const KEY='YPTRMS_V1';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const sha=async t=>{
 if(window.crypto&&crypto.subtle&&window.isSecureContext){
  return[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,'0')).join('');
 }
 let h=2166136261;
 for(let i=0;i<t.length;i++)h=Math.imul(h^t.charCodeAt(i),16777619);
 return(h>>>0).toString(16).padStart(8,'0');
};
const STATE={session:null,audit:[],users:[
 {slot:1,id:'82900',name:'Mohammed Khaled Hageb',email:'mohammed.hageb@yemenia.com',role:'System Admin'},
 {slot:2,id:'1002',name:'Capt. Amr',email:'amr@yemenia.com',role:'Training Manager'},
 {slot:3,id:'C001',name:'Coordinator 1',email:'coord1@yemenia.com',role:'Coordinator'},
 {slot:4,id:'C002',name:'Coordinator 2',email:'coord2@yemenia.com',role:'Coordinator'},
 {slot:5,id:'C003',name:'Coordinator 3',email:'coord3@yemenia.com',role:'Coordinator'}]};
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}};
const save=o=>{try{localStorage.setItem(KEY,JSON.stringify({...load(),...o}))}catch(e){toast('Storage full or blocked')}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800)}
function logAudit(action){STATE.audit.unshift({ts:new Date().toISOString(),user:STATE.session?STATE.session.id:'-',action});STATE.audit=STATE.audit.slice(0,200);save({audit:STATE.audit})}
async function initUsers(){const h=await sha('Yemenia@2026');STATE.users.forEach(u=>u.hash=h)}
async function authenticate(idv,pw){
 const q=idv.trim().toLowerCase(),u=STATE.users.find(x=>x.id.toLowerCase()===q||x.email===q);
 return u&&u.hash===await sha(pw)?u:null}
function enter(u,remember){
 window.YPTRMS=window.YPTRMS||{STATE,load,save,toast,logAudit,$,$$};
 STATE.session=u;STATE.audit=load().audit||[];
 if(remember!==undefined)save({remember:remember?u.id:null});
 save({lastUser:u.id});logAudit('LOGIN');
 $('#loginGate').classList.add('hidden');$('#appShell').classList.remove('hidden');
 $('#uName').textContent=u.name;$('#uAvatar').textContent=u.name.replace('Capt. ','')[0];

 document.dispatchEvent(new CustomEvent('yptrms:login',{detail:u}));try{lucide.createIcons();}catch(e){}}
$('#loginForm').addEventListener('submit',async e=>{
 e.preventDefault();$('#lgErr').textContent='';
 const u=await authenticate($('#lgId').value,$('#lgPw').value);
 if(!u){$('#lgErr').textContent='Invalid credentials. Please try again.';return}
 enter(u,$('#lgRemember').checked)});
$('#btnBio').onclick=async()=>{
 const st=load(),m=(window.Store&&window.Store.get('managers')||[]).find(x=>x.staffId===(st.lastUser||st.remember));
 if(m&&m.bio==='No'){toast('Biometric sign-in is disabled for this account');return}
 const supported=window.PublicKeyCredential&&navigator.credentials&&window.isSecureContext;
 if(!supported){toast('Biometrics unavailable here — use password or Quick Enter');return}
 try{
  const rnd=crypto.getRandomValues(new Uint8Array(32));
  const lastId=st.lastUser||st.remember;
  const user=STATE.users.find(x=>x.id===lastId);
  if(!user){toast('Sign in once with password first to enable biometrics');return}
  if(st.credId){
   const raw=Uint8Array.from(atob(st.credId),c=>c.charCodeAt(0));
   await navigator.credentials.get({publicKey:{challenge:rnd,allowCredentials:[{id:raw,type:'public-key'}],userVerification:'required',timeout:60000}});
  }else{
   const c=await navigator.credentials.create({publicKey:{challenge:rnd,rp:{name:'YPTRMS'},user:{id:new TextEncoder().encode(user.id),name:user.email,displayName:user.name},
    pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});
   save({credId:btoa(String.fromCharCode(...new Uint8Array(c.rawId)))});toast('Biometric enrolled for '+user.name)}
  enter(user,undefined)
 }catch(err){toast('Biometric cancelled or unsupported — use password')}};
(function ensureLogoutIcon(){const b=$('#btnLogout');if(!b)return;if(!b.querySelector('svg')){const sp=b.querySelector('.lo-txt');if(sp)sp.textContent='Logout';const ic=b.querySelector('i');if(ic&&!ic.textContent)ic.textContent='⎋'}})();

let slideTimer=null,slideIdx=0;

 const box=$('#heroSlideshow'),imgs=load().heroImgs||[];
 box.querySelectorAll('img').forEach(i=>i.remove());clearInterval(slideTimer);
 imgs.forEach((src,i)=>{const im=new Image();im.src=src;im.alt='Aircraft';if(!i)im.className='show';box.appendChild(im)});
 const els=box.querySelectorAll('img');slideIdx=0;
 if(els.length>1)slideTimer=setInterval(()=>{els[slideIdx].classList.remove('show');slideIdx=(slideIdx+1)%els.length;els[slideIdx].classList.add('show')},5000)}
const readFile=f=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});
$('#heroFiles').onchange=async e=>{const arr=[];for(const f of [...e.target.files].slice(0,8)){try{arr.push(window.YStorage?await YStorage.compress(f,YStorage.B.hero):await readFile(f))}catch(x){toast(x.message)}}if(window.YStorage&&arr.length){const g=YStorage.fits(arr.reduce((n,x)=>n+x.length*2,0));if(!g.ok){toast(g.msg);e.target.value='';return}}if(!arr.length){e.target.value='';return}
 save({heroImgs:[...(load().heroImgs||[]),...arr].slice(-8)});renderSlides();toast(arr.length+' photo(s) added');e.target.value=''};
$('#emblemSlot').onclick=()=>$('#emblemFile').click();
$('#emblemFile').onchange=async e=>{const f=e.target.files[0];if(f){try{const d=window.YStorage?await YStorage.compress(f,YStorage.B.emblem):await readFile(f);if(window.YStorage){const g=YStorage.fits(d.length*2,((load().emblem||'').length)*2);if(!g.ok){toast(g.msg);e.target.value='';return}}save({emblem:d});renderEmblem()}catch(x){toast(x.message)}}e.target.value=''};

function renderEmblem(){const s=$('#emblemSlot'),le=$('#loginEmblem'),em=getLogoSrc();if(em){if(s){s.style.border='2px solid rgba(255,255,255,.65)';s.innerHTML='<img src="'+em+'" alt="Logo">'}if(le){le.style.background='#fff';le.style.borderColor='#CBD5E1';le.innerHTML='<img src="'+em+'" alt="Logo">'}}else{if(s){s.style.border='';s.style.background='';s.style.padding='';s.innerHTML='<i data-lucide="award"></i>'}if(le){le.style.background='#fff';le.style.borderColor='var(--red)';le.innerHTML='<i data-lucide="plane"></i>'}}try{lucide.createIcons()}catch(e){}}

window.lucide=window.lucide||{createIcons(){}};
window.YPTRMS={STATE,load,save,toast,logAudit,$,$$};
(async()=>{

 try{lucide.createIcons();}catch(e){}
})();

<script id="module-excel-import">
/* Assumptions: ambiguous dates are read day-first (dd/mm/yyyy); a 5-digit year (20203) is repaired by dropping the last digit, so verify the repaired list in the preview;

(()=>{

const iso=(y,m,d)=>{const t=new Date(Date.UTC(y,m-1,d));return t.getUTCFullYear()===y&&t.getUTCMonth()===m-1&&t.getUTCDate()===d?y+'-'+p2(m)+'-'+p2(d):null};
function pdate(v){

 if(!s||/^(n\/?a|null|undefined|-+|—)$/i.test(s))return{st:'empty'};

  if(!(n>=0&&n<=80000)||(typeof v!=='number'&&(n<30000||n>70000)))return{st:'bad'};

 else{s=s.replace(/[ T]\d{1,2}:\d{2}(:\d{2})?.*$/,'').replace(/[A-Za-z]{3,}/g,w=>{const i=MON.indexOf(w.slice(0,3).toLowerCase());return i<0?'?':i+1});

  else if(p.length===1&&/^(\d{8}|\d{6})$/.test(p[0])){const x=p[0];d=x.slice(0,2);m=x.slice(2,4);y=x.slice(4);fx=1}
  else return{st:'bad'};
  if(y.length===2)y='20'+y;else if(y.length>4){y=y.slice(0,4);fx=1}else if(y.length!==4)return{st:'bad'};

 if(+r.slice(0,4)>2100)return{st:'bad'};

/* ---------- phones, ranks, credential names ---------- */
function fmtPhone(v){let d=String(typeof v==='number'?Math.round(v):v).trim();if(/^\+967[\s-]?\d{9}$/.test(d.replace(/\s/g,'')))return d.replace(/[\s-]/g,'');d=d.replace(/\D/g,'');
 if(/^\d{9}$/.test(d))return'+967'+d;if(/^967\d{9}$/.test(d))return'+'+d;if(/^00967\d{9}$/.test(d))return'+'+d.slice(2);if(/^0\d{9}$/.test(d))return'+967'+d.slice(1);return null}

const CID=[[/^LIC/,'LIC'],[/^LEP/,'LEP'],[/MED/,'MED'],[/^LINE/,'LINE'],[/^(PC|OPC|PROF)/,'PC'],[/^SEP/,'SEP'],[/^CRM/,'CRM'],[/^(DG|DANGER)/,'DG'],[/^SMS/,'SMS'],[/^COF?T/,'COT'],[/ETOPS|RVSM/,'ETOPS'],[/^CMC/,'CMC'],[/^CBT/,'CBT']];
const CN=(id,fl)=>({LIC:fl?'Licence Validity':'Cabin Attestation',MED:fl?'Class 1 Medical':'Medical',PC:fl?'OPC / Recurrent':null,LINE:fl?'Line Check':null,SEP:fl?'SEP':'SEP / Recurrent',COT:'C of T',ETOPS:fl?'ETOPS / RVSM':null,LEP:'LEP',CRM:'CRM',DG:'DG',SMS:'SMS',CMC:'CMC',CBT:'CBT'}[id]||null);
/* ---------- header detection (dual Issue / Expiry blocks) ---------- */
function headerMap(rows){
 for(let h=0;h<Math.min(rows.length,25);h++){const hr=rows[h];if(hr.filter(c=>String(c).trim()).length<4||!hr.some(c=>nk(c).includes('NAME')))continue;
  const grp=[];[h-1,h-2].forEach(ri=>{if(ri<0)return;let cur='';rows[ri].forEach((c,i)=>{const t=up(c);if(/ISSU/.test(t))cur='issue';else if(/EXP/.test(t))cur='expiry';if(cur&&!grp[i])grp[i]=cur})});
  const fx={},cr=[],seen={};
  hr.forEach((c,i)=>{const t=up(c),n=nk(c);if(!n)return;let f=null;
   if(/STAFF(ID|NO|NUM)|^(EMP|EMPLOYEE|PERS)(ID|NO|NUM|NUMBER)?$|^ID$|^STAFF$/.test(n))f='staffId';else if(/NAME/.test(n))f='name';
   else if(/^(RANK|POSITION|POS|DESIGNATION)$/.test(n))f='rank';else if(/^(FLEET|AIRCRAFT|ACTYPE|TYPE)$/.test(n))f='fleet';else if(/^BASE/.test(n))f='base';
   else if(/CONTACT2|PHONE2|MOBILE2|TEL2/.test(n))f='phone2';else if(/CONTACT1|PHONE1|MOBILE1|TEL1|^(MOBILE|PHONE|CONTACT|TEL)$/.test(n))f='phone';
   else if(/MAIL/.test(n))f='email';else if(/^STATUS$/.test(n))f='status';
   if(f){if(!(f in fx))fx[f]=i;return}
   const id=(CID.find(([re])=>re.test(n))||[])[1];if(!id)return;
   let ty=/ISSU/.test(t)?'issue':/EXP/.test(t)?'expiry':grp[i];
   if(!ty){seen[id]=(seen[id]||0)+1;ty=seen[id]===1?'issue':'expiry'}

/* ---------- analysis (no data is changed here) ---------- */
function analyse(wb){
 const ex=S.get('crew'),out={rows:[],ph:0,fix:[],bad:[],warn:[],sheets:0,blank:0},seenK=new Set();
 const byId=new Map(ex.map(c=>[String(c.staffId).toLowerCase(),c])),byNm=new Map(ex.map(c=>[c.name.toLowerCase(),c]));
 wb.SheetNames.forEach(sn=>{const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''}),hm=headerMap(rows);
  if(!hm){out.warn.push('Sheet "'+sn+'": no header row with a NAME column found – skipped');return}
  out.sheets++;
  rows.slice(hm.h+1).forEach((r,k)=>{const ln=hm.h+k+2,g=f=>hm.fx[f]==null?'':String(r[hm.fx[f]]).trim();

   const base={ln,name:name||'(no name)',sid},skip=n=>out.rows.push({...base,a:'Skip',note:n});

   const key=(sid||name).toLowerCase();if(seenK.has(key))return skip('Duplicate row in file');seenK.add(key);
   const rk=RK(g('rank'))||(e1?e1.rank:'');if(!rk)return skip(g('rank')?'Unknown rank "'+g('rank')+'"':'Missing rank');
   const fl=FL(rk),P={},B=[],A=[],notes=[];
   const set=(k,v)=>{if(v===''||v==null)return;const o=e1?e1[k]:undefined;if(!e1||o!==v){P[k]=v;B.push(k+': '+(o||'—'));A.push(k+': '+v)}};
   set('name',name);set('staffId',e1?'':sid);set('rank',rk);if(P.rank)P.group=fl?'Flight':'Cabin';
   const fv=/330/.test(g('fleet'))?'A330':/320/.test(g('fleet'))?'A320':'';if(!e1&&!fv)notes.push('fleet defaulted to A320');set('fleet',fv||(e1?'':'A320'));
   const bs=/SAN/i.test(g('base'))?"Sana'a":/ADEN|ADN/i.test(g('base'))?'Aden':'';set('base',bs||(e1?'':'Aden'));
   ['phone','phone2'].forEach(f=>{const raw=hm.fx[f]==null?'':r[hm.fx[f]];if(String(raw).trim()==='')return;const p=fmtPhone(raw);p===null?notes.push(f+' "'+raw+'" not recognised'):set(f,p)});
   const em=g('email').toLowerCase();if(/^\S+@\S+\.\S+$/.test(em))set('email',em);else if(em)notes.push('invalid email');
   if(/^(IN.?ACTIVE|RETIRED)/i.test(g('status'))){set('status','Inactive');if(!e1||e1.status==='Active')set('reason','Imported from spreadsheet')}
   const cm=new Map();
   hm.cr.forEach(({i,id,ty})=>{const nm=CN(id,fl);if(!nm)return;const d=pdate(r[i]);
    if(d.st==='ph')out.ph++;else if(d.st==='bad')out.bad.push('Row '+ln+' '+nm+' '+ty+' "'+r[i]+'"');
    else if(d.v){if(d.st==='fix')out.fix.push('Row '+ln+' '+nm+' '+ty+': '+r[i]+' → '+d.v);const o=cm.get(nm)||{};o[ty]=d.v;cm.set(nm,o)}});

/* ---------- preview + apply ---------- */
function showPreview(res,fname){

function apply(res,fname){
 const A0=S.get('audit').slice(),before=S.get('crew').length,db=[],da=[],nn=[];let n=0,u=0;
 try{res.rows.forEach(r=>{
  if(r.a==='New'){S.add('crew',r.P);n++;nn.push(r.name+' ('+r.sid+')')}
  else if(r.a==='Update'){S.update('crew',r.id,r.P);u++;db.push(r.name+' ['+r.B.join('; ')+']');da.push(r.name+' ['+r.A.join('; ')+']')}})}
 catch(e){console.error(e);Y.toast('Import interrupted: '+e.message)}
 const A=S.get('audit');A.length=0;A.push(...A0);
 const sk=res.rows.filter(r=>r.a==='Skip').length+res.blank;
 if(u)S.log('crew','IMPORT DETAIL (updates)',cap(db.join(' | ')),cap(da.join(' | ')));
 if(n)S.log('crew','IMPORT DETAIL (new records)','—',cap(nn.join(' | ')));
 S.log('crew','IMPORT '+fname,'Crew records: '+before,'Crew records: '+S.get('crew').length+' (+'+n+' new, '+u+' updated, '+sk+' skipped; '+res.fix.length+' dates repaired, '+res.ph+' placeholders ignored)');
 ['crew','dashboard','reports'].forEach(t=>document.dispatchEvent(new CustomEvent('yptrms:tab',{detail:t})));
 Y.toast('Import complete: '+n+' new, '+u+' updated, '+sk+' skipped')}
async function onFile(e){const f=e.target.files[0];e.target.value='';if(!f)return;
 if(f.size>8e6)return Y.toast('File too large (max 8 MB)');
 try{Y.toast('Reading '+f.name+'…');await needXl();
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array',...(/\.csv$/i.test(f.name)?{raw:true}:{})}),res=analyse(wb);
  if(!res.sheets)return Y.toast(res.warn[0]||'No usable sheet found');
  showPreview(res,f.name)}catch(x){console.error(x);Y.toast('Import failed: '+x.message)}}

<script id="step1-settings">
(()=>{

if(tb&&window.ResizeObserver)new ResizeObserver(()=>document.documentElement.style.setProperty('--tbh',(tb.offsetHeight||72)+'px')).observe(tb);

/* ---- 1. Verified localStorage writes (YPTRMS_V1) + audit ---- */
const rd=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}};
const put=p=>{try{localStorage.setItem(KEY,JSON.stringify({...rd(),...p}));const b=rd();return Object.keys(p).every(k=>JSON.stringify(b[k]??null)===JSON.stringify(p[k]??null))}catch(e){return false}};

function usage(){let b=0;try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);b+=(k.length+(localStorage.getItem(k)||'').length)*2}}catch(e){}return{b,p:Math.min(100,b/5242880*100)}}
const mcol=p=>p>85?'#D71920':p>60?'#F59E0B':'#16A34A';
const parts=()=>{const o=rd();return Object.keys(o).map(k=>[k,(k.length+JSON.stringify(o[k]).length)*2]).sort((a,b)=>b[1]-a[1]).slice(0,5)};
const meterHtml=()=>{const u=usage(),Y=window.YStorage,rows=Y?Y.breakdown().slice(0,6):parts();return`<div class="bar" style="margin:10px 0"><i style="width:${u.p}%;background:${mcol(u.p)}"></i></div><b>${kb(u.b)} of ~5 MB (${u.p.toFixed(0)}%)</b> <small style="color:var(--mut)">· ${kb(Math.max(0,5242880-u.b))} free</small>${u.p>85?'<p class="rp" style="color:var(--red)">Nearly full — new uploads are blocked above 95%. Use Optimise below or delete hero photos / old scans.</p>':''}<p class="rp" style="margin-top:6px">${rows.map(([k,n])=>esc(k)+' '+kb(n)).join(' · ')}</p><p class="rp">Automatic image compression: hero photos ≤ 1280 px / 150 KB, emblem ≤ 600 px / 160 KB, form scans ≤ 1500 px / 380 KB, crew documents ≤ 1100 px / 220 KB. Uploads over 25 MB are refused.</p><div class="fb" style="margin-top:6px"><button class="btn btn-tonal sm" data-st="opt"><i data-lucide="minimize-2" class="ico"></i>Optimise stored media</button></div><p class="rp" id="stOptOut">${esc((window.YStorage&&YStorage.msg)||'')}</p>`};
window.YSettingsMeter=()=>{const m=document.querySelector('#stgMeter');if(m){const t=document.querySelector('#stOptOut')?.textContent||'';m.innerHTML=meterHtml();const o=document.querySelector('#stOptOut');if(o)o.textContent=t;try{lucide.createIcons()}catch(e){}}};
const meter=()=>{const m=$('#stgMeter');if(m){m.innerHTML=meterHtml();ico()}};
const shrink0=(f,mx,ty,q=.74)=>new Promise((ok,no)=>{if(!/^image\//.test(f.type))return no(new Error('Images only'));const u=URL.createObjectURL(f),im=new Image();
 im.onerror=()=>{URL.revokeObjectURL(u);no(new Error('Could not read this image'))};
 im.onload=()=>{URL.revokeObjectURL(u);const s=Math.min(1,mx/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*s);c.height=Math.round(im.naturalHeight*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL(ty,q))};im.src=u});

const after=k=>{if(k==='managers')syncUsers();refresh(k);meter()};
const check=(k,p,id)=>{const L=S().get(k);
 if(k==='managers'){if(L.some(m=>m.staffId===p.staffId&&m.id!==id))return'Staff ID already in use';if(p.email&&!/^\S+@\S+\.\S+$/.test(p.email))return'Invalid email address';
  if(id&&S().find(k,id).staffId==='82900'&&p.staffId!=='82900')return'The System Admin Staff ID is protected'}
 else if(L.some(r=>(r.name||'').toLowerCase()===p.name.toLowerCase()&&r.id!==id))return'This name already exists';
 if(k==='courses'&&p.code&&L.some(r=>(r.code||'').toLowerCase()===p.code.toLowerCase()&&r.id!==id))return'Course code already in use';
 if(k==='courses'){const R=YRank.normRoles(p.roles).split(',').filter(Boolean);if(!R.length)return'Select at least one applicable role';if(p.group==='Flight Crew'&&R.some(r=>!['CAPT','F/O'].includes(r)))return'Flight Crew courses can only target CAPT and F/O';if(p.group==='Cabin Crew'&&R.some(r=>!['F/A','PURS'].includes(r)))return'Cabin Crew courses can only target F/A and PURS';if(p.group==='Ground Staff'&&R.some(r=>!['F/D DISP','G/E ENG','OTHR'].includes(r)))return'Ground Staff courses can only target F/D DISP, G/E ENG and OTHR';p.roles=R.join(',')}return''};

function form(k,id){const c=CFG[k],o=id?S().find(k,id):{};
 dlg((id?'Edit ':'Add ')+c.s,c.f.map(([f,l,t,op])=>`<label class="lb">${l}${t==='roles'?rolesCtl(o[f]):t==='select'?`<select class="in" data-k="${f}" ${f==='group'?GRPCH:''}>${op.map(v=>`<option${v===(o[f]||op[0])?' selected':''}>${v}</option>`).join('')}</select>`:`<input class="in" data-k="${f}" type="${t||'text'}" value="${esc(o[f]??'')}">`}</label>`).join(''),'Save',m=>{

const sec={
 brand(){const em=rd().emblem,hi=heroes();return`<div class="card" id="stg-brand"><h3><i data-lucide="image" class="ico"></i>Branding — Winged Emblem &amp; Hero Aircraft Photos</h3>
 <div class="rw" style="border:0"><div class="av big">${em?`<img src="${em}" alt="Emblem" style="object-fit:contain">`:'YE'}</div><div class="fb"><button class="mini nv" data-sa="emb"><i data-lucide="upload" class="ico"></i>Upload Emblem</button>${em?'<button class="mini rd" data-sa="embx"><i data-lucide="trash-2" class="ico"></i>Remove</button>':''}</div><small style="color:var(--mut)">Shown in the top bar and on every PDF report.</small></div>
 <div class="sh">Hero slideshow (${hi.length}/8) — order = display order</div><div class="thumbs">${hi.map((s,i)=>`<div class="th"><img src="${s}" alt="Aircraft ${i+1}"><div class="fb"><button class="ic" data-sa="hup" data-i="${i}" ${i?'':'disabled'} title="Move earlier"><i data-lucide="arrow-left" class="ico"></i></button><button class="ic" data-sa="hdn" data-i="${i}" ${i<hi.length-1?'':'disabled'} title="Move later"><i data-lucide="arrow-right" class="ico"></i></button><button class="ic" data-sa="hdel" data-i="${i}" title="Delete"><i data-lucide="trash-2" class="ico"></i></button></div></div>`).join('')||'<small style="color:var(--mut)">No photos — the geometric fallback is shown.</small>'}</div>

 </div></div>`},

 <div><div class="lb">GitHub repository storage — remote backup, counted separately</div><div id="ghMeter">${window.YStorage?YStorage.ghHtml():''}</div></div></div></div>`},
 fss(){const v=(S().get('settings')||{}).fssLead??75;return`<div class="card" id="stg-fss"><h3><i data-lucide="monitor-play" class="ico"></i>FSS Request Lead Time</h3><div class="rw" style="border:0"><label class="lb">Default interval (days before the need date)<input type="number" inputmode="numeric" class="in" id="stgFss" min="1" max="365" value="${v}" style="width:190px"></label><button class="btn btn-primary sm" data-sa="fss">Save</button></div><p class="rp">FSS requests enter the dispatch queue once the need date is inside this interval. A provider can override it individually under Facilities &amp; FSS.</p></div>`},

<script id="step3-ocr">
(()=>{
if(window.YOcr)return;window.YOcr=1;
const $=s=>document.querySelector(s),T=m=>{try{toast(m)}catch(e){console.log(m)}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cfg=()=>{try{return JSON.parse(localStorage.getItem('YPTRMS_V1'))||{}}catch(e){return{}}};
const MODELS=['gemini-2.5-flash','gemini-2.0-flash','gemini-flash-latest'],P2=n=>String(n).padStart(2,'0');
const MON={JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12};
const ok=(y,m,d)=>y>=1900&&y<=2100&&m>=1&&m<=12&&d>=1&&d<=31?y+'-'+P2(m)+'-'+P2(d):null;
const yy=(v,dob)=>{v=+v;if(v>=100)return v;const c=new Date().getFullYear()%100;return dob?(v>c?1900+v:2000+v):2000+v};
const iso=v=>/^\d{4}-\d{2}-\d{2}$/.test(v||'')?v:null;

/* ---------- text parsing (used by the offline engine and as a safety net) ---------- */
function dates(t){const o=[],push=(i,s)=>{if(s)o.push({d:s,c:t.slice(Math.max(0,i-50),i).toLowerCase()})};
 t.replace(/\b(19|20)(\d{2})[-\/.](\d{1,2})[-\/.](\d{1,2})\b/g,(s,a,b,m,d,i)=>push(i,ok(+(a+b),+m,+d)));
 t.replace(/\b(\d{1,2})[-\/.\s](\d{1,2})[-\/.\s](\d{4}|\d{2})\b/g,(s,d,m,y,i)=>push(i,ok(yy(y),+m,+d)));
 t.replace(/\b(\d{1,2})\s*([A-Za-z]{3})[A-Za-z]*(?:\s*[\/.\-]\s*[A-Za-z]{3,})?[\s\/.\-]*(\d{4}|\d{2})\b/g,(s,d,mo,y,i)=>push(i,MON[mo.toUpperCase()]?ok(yy(y),MON[mo.toUpperCase()],+d):null));
 return o}
function pickDates(t){const L=dates(t).filter(x=>!/birth|dob|born/.test(x.c.slice(-30))),E=/expir|valid\s*(until|to|thru|till)|exp\b|until|validity/,I=/issue|issued|valid\s*from|effective|\biss\b|from/;
 const ex=L.filter(x=>E.test(x.c.slice(-35))).map(x=>x.d).sort(),is=L.filter(x=>!E.test(x.c.slice(-35))&&I.test(x.c.slice(-35))).map(x=>x.d).sort(),all=[...new Set(L.map(x=>x.d))].sort();
 const expiry=ex.length?ex[ex.length-1]:(all.length?all[all.length-1]:null),issue=is.length?is[0]:(all.length>1?all[0]:null);return{expiry,issue:issue&&issue!==expiry?issue:null}}
const dig=s=>s.replace(/O/g,'0').replace(/[IL]/g,'1').replace(/S/g,'5').replace(/B/g,'8').replace(/Z/g,'2');
function mrz(t){const L=t.toUpperCase().split(/\n/).map(s=>s.replace(/[^A-Z0-9<]/g,'')).filter(s=>s.length>=40),r={};
 for(const s of L){if(s.length>=43){const n=dig(s.slice(13,19)),e=dig(s.slice(21,27));
   if(/^\d{6}$/.test(n)&&/^\d{6}$/.test(e)&&/^[A-Z<]{3}$/.test(s.slice(10,13))){const ex=ok(2000+ +e.slice(0,2),+e.slice(2,4),+e.slice(4,6));
    if(ex){r.number=s.slice(0,9).replace(/</g,'');r.expiry=ex;r.dob=ok(yy(n.slice(0,2),1),+n.slice(2,4),+n.slice(4,6));r.nationality=s.slice(10,13)}}}
  const m=/^P[A-Z<]([A-Z<]{3})([A-Z<]+?)<<([A-Z<]+)/.exec(s);if(m&&!r.holder)r.holder=(m[3].replace(/</g,' ')+' '+m[2].replace(/</g,' ')).replace(/\s+/g,' ').trim()}
 return r}
function parse(t,key){const r=key==='@pass'||/^P[<A-Z]/m.test(t)?mrz(t):{},D=pickDates(t);if(!r.expiry&&D.expiry)r.expiry=D.expiry;if(D.issue&&key!=='@pass')r.issue=D.issue;
 if(key==='@pass'&&!r.number){const m=/\b([A-Z]{1,2}\d{6,8})\b/.exec(t.toUpperCase());if(m)r.number=m[1]}return r}

/* ---------- engine 1: Google AI Studio (Gemini Vision) ---------- */
const prompt=k=>`You read airline crew documents. ${k==='@pass'?'The image is a passport data page.':k==='@doc'?'The image is a training, licence or administrative document.':'The image is a crew licence, medical certificate or training certificate named "'+k+'".'} Return ONLY JSON with keys: holder_name, document_number, issue_date, expiry_date, date_of_birth, nationality, document_title, mrz (the machine-readable lines if present). Dates must be ISO YYYY-MM-DD. Use null for anything missing or not clearly legible; never guess.`;
function norm(o,key){const r={holder:o.holder_name||'',number:String(o.document_number||'').replace(/\s/g,''),issue:iso(o.issue_date),expiry:iso(o.expiry_date),dob:iso(o.date_of_birth),nationality:o.nationality||'',title:o.document_title||''};
 if(o.mrz){const m=mrz(String(o.mrz));if(m.expiry&&!r.expiry)r.expiry=m.expiry;if(m.number&&!r.number)r.number=m.number;if(m.holder&&!r.holder)r.holder=m.holder}
 if(key==='@pass')r.issue=null;return r}
async function gem(d,key){const parts=[{text:prompt(d.key)}];
 for(const c of d.pages){const s=Math.min(1,1400/Math.max(c.width,c.height)),o=document.createElement('canvas');o.width=c.width*s;o.height=c.height*s;o.getContext('2d').drawImage(c,0,0,o.width,o.height);parts.push({inline_data:{mime_type:'image/jpeg',data:o.toDataURL('image/jpeg',.82).split(',')[1]}})}
 let err=new Error('no model');
 for(const m of MODELS){const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),30000);
  try{const r=await (window.YNet?YNet.fetch:fetch)('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent',{method:'POST',signal:ac.signal,headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({contents:[{parts}],generationConfig:{temperature:0,responseMimeType:'application/json'}})});
   if(r.status===404){err=new Error('model '+m+' not found');continue}if(!r.ok)throw new Error('HTTP '+r.status);
   const j=await r.json(),txt=(((j.candidates||[])[0]||{}).content||{parts:[]}).parts.map(p=>p.text||'').join('');return norm(JSON.parse(txt.replace(/^\s*```json|```\s*$/g,'')),d.key)}
  catch(e){err=e;if(e.name==='AbortError')break}finally{clearTimeout(tm)}}
 throw err}

/* ---------- engine 2: Tesseract.js (offline once warmed) ---------- */
let tP=null;const loadT=()=>window.Tesseract?Promise.resolve():(tP=tP||new Promise((res,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';s.onload=res;s.onerror=()=>{tP=null;no(new Error('Tesseract unavailable'))};document.head.appendChild(s)}));
async function tess(d){await loadT();const w=await Tesseract.createWorker('eng');let txt='';
 try{for(const c of d.pages){txt+='\n'+(await w.recognize(c)).data.text;
   if(d.key==='@pass'){const m=document.createElement('canvas');m.width=c.width;m.height=Math.round(c.height*.28);m.getContext('2d').drawImage(c,0,c.height-m.height,c.width,m.height,0,0,m.width,m.height);
    await w.setParameters({tessedit_char_whitelist:'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789<',tessedit_pageseg_mode:'6'});txt+='\n'+(await w.recognize(m)).data.text;await w.setParameters({tessedit_char_whitelist:'',tessedit_pageseg_mode:'3'})}}}
 finally{await w.terminate()}
 return parse(txt,d.key)}
async function warm(){const n=navigator.connection;if(cfg().ocrWarm||!navigator.onLine||(n&&(n.saveData||n.type==='cellular')))return;
 try{await loadT();const w=await Tesseract.createWorker('eng');await w.terminate();window.YPTRMS.save({ocrWarm:true})}catch(e){}}

/* ---------- orchestration: Gemini online with key → silent Tesseract fallback ---------- */
async function extract(d){const k=cfg().gemini;
 if(navigator.onLine&&k){try{return{eng:'Gemini Vision',f:await gem(d,k)}}catch(e){console.info('[OCR] Gemini skipped:',e.message)}}
 try{return{eng:'Offline OCR (Tesseract)',f:await tess(d)}}catch(e){console.info('[OCR] Tesseract skipped:',e.message)}return null}
const ROWS=k=>k==='@pass'?[['number','Passport No.','text'],['expiry','Passport expiry','date']]:k==='@doc'?[['title','Document title','text'],['issue','Document date','date']]:[['issue','Issue date','date'],['expiry','Expiry date','date']];
const SEL=(k,f)=>k==='@pass'?{number:'#pb [data-f="passport.no"]',expiry:'#pb [data-f="passport.expiry"]'}[f]:k==='@doc'?{title:'[data-d="title"]',issue:'[data-d="date"]'}[f]:'#pb [data-c="'+k.replace(/"/g,'\\"')+'"][data-p="'+f+'"]';
function apply(k,vals){let n=0;
 for(const[f,v]of Object.entries(vals)){const el=$(SEL(k,f));if(!el||!v)continue;el.value=v;el.dispatchEvent(new Event('input',{bubbles:true}));n++}
 const last=ROWS(k).map(r=>r[0]).reverse().map(f=>$(SEL(k,f))).find(Boolean);if(last)last.dispatchEvent(new Event('change',{bubbles:true}));return n}
function review(d,res){const k=d.key,rows=ROWS(k).filter(r=>$(SEL(k,r[0])));
 if(!rows.length){T('Scan read ('+res.eng+') but no matching field is open to fill');return}
 const prof=($('#ph h3')||{}).textContent||'',tok=s=>String(s).toUpperCase().match(/[A-Z]{3,}/g)||[],mis=res.f.holder&&tok(prof).length&&!tok(res.f.holder).some(t=>tok(prof).includes(t));
 const m=document.createElement('div');m.className='mo';m.style.zIndex=450;
 m.innerHTML=`<div class="md sm" style="max-width:520px"><div class="hd"><h3>Confirm extracted fields</h3><span class="bdg g">${esc(res.eng)}</span></div><div class="bd g2">${rows.map(([f,l,t])=>`<label class="lb">${l}<input class="in" type="${t}" data-o="${f}" value="${esc(res.f[f]||'')}"></label>`).join('')}</div>
 <div class="bd" style="padding-top:0">${res.f.holder?`<small style="display:block;margin-bottom:6px;color:${mis?'#B91C1C':'var(--mut)'}">Name on document: <b>${esc(res.f.holder)}</b>${mis?' — does NOT match this profile. Verify before applying.':''}</small>`:''}<small style="color:var(--mut)">Automatic reading can contain errors. Check each value against the document.</small></div>
 <div class="ft"><button class="btn btn-tonal" data-x>Skip</button><button class="btn btn-primary" data-ok>Apply to form</button></div></div>`;
 m.onclick=e=>{if(e.target===m||e.target.closest('[data-x]'))m.remove()};

  try{window.Store.log('scan','OCR APPLIED',k||'document',Object.keys(v).filter(x=>v[x]).join(', ')+' · '+res.eng)}catch(e){}T(n+' field(s) applied — review, then Save the profile')};
 document.body.appendChild(m)}
function pill(t){let p=$('#ocrPill');if(!t){p&&p.remove();return}if(!p){p=document.createElement('div');p.id='ocrPill';document.body.appendChild(p)}p.textContent=t}
function store(d,res){try{const y=window.YPTRMS,l=y.load().ocrLog||[];l.unshift({ts:new Date().toISOString(),key:d.key||'document',engine:res.eng,fields:res.f});y.save({ocrLog:l.slice(0,30)});

document.addEventListener('yptrms:scan',async e=>{const d=e.detail;if(!d||!d.pages)return;pill('Reading document…');
 try{const res=await extract(d);pill();if(!res){T('Scan saved. Automatic reading is unavailable offline — enter the details manually.');return}store(d,res);review(d,res);warm()}

<script id="step3-dispatch">
(()=>{
if(window.YDispatch)return;
const $=s=>document.querySelector(s),T=m=>{try{toast(m)}catch(e){console.log(m)}},S=()=>window.Store,DT=()=>window.YDate;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P2=n=>String(n).padStart(2,'0'),U=()=>((window.YPTRMS||{}).STATE||{}).session||{name:'Flight Operations Training',id:'-'};
const ref=t=>{const n=new Date();return'YPTRMS/'+t+'/'+n.getFullYear()+P2(n.getMonth()+1)+P2(n.getDate())+'-'+P2(n.getHours())+P2(n.getMinutes())};

/* ---------- formal commercial-aviation templates; casual / religious greetings are stripped ---------- */
const GREET=/^\s*(hi|hey|hello|dear all|good\s+(morning|afternoon|evening|day)|(as-?)?sal+a+m\S*(\s+\S+){0,2}|peace be\S*(\s+\S+){0,3}|god bless\S*|ramadan kareem|eid mubarak)\b[\s,!.:-]*/i;
const formal=t=>String(t||'').split(/\r?\n/).map(l=>l.replace(GREET,'').replace(/\b(in\s?sha+\s?'?allah|insha'?allah|masha'?allah|alhamdulillah)\b[\s,!.]*/gi,'')).join('\n');
const sig=()=>{const u=U();return'Respectfully,\n'+u.name+' (Staff ID '+u.id+')\nFlight Operations Training Department\nYemenia Airways — Aden HQ'};
const wrap=(to,type,subject,paras)=>({subject:'Yemenia Flight Operations Training — '+subject,body:formal('Attention: '+to+'\nReference: '+ref(type)+'\nSubject: '+subject+'\n\n'+paras.join('\n\n')+'\n\n'+sig())});
function compose(a){const ds=a.dataset;
 const m=/^n:[^:]+:([^:]+):(crew|cc)$/.exec(ds.key||'');
 if(m){const c=S().find('crew',m[1]);if(c){const x=(c.creds||[]).filter(z=>z.expiry).map(z=>({...z,d:DT().daysTo(z.expiry)})).sort((p,q)=>p.d-q.d)[0];
  if(x){const ex=x.d<0,st=ex?'expired on '+x.expiry+' ('+(-x.d)+' day(s) ago)':'expires on '+x.expiry+' (in '+x.d+' day(s))';
   if(m[2]==='crew')return wrap(c.rank+' '+c.name,'CRN','Notice of qualification '+(ex?'expiry':'expiring soon')+' — '+x.name,['This is to notify you that your '+x.name+' '+st+'.','Please contact the Flight Operations Training Department, Aden HQ, to arrange revalidation at the earliest opportunity.']);
   return wrap('Crew Control','CCN','Crew qualification status — '+c.rank+' '+c.name,['Crew member: '+c.rank+' '+c.name+' (Staff ID '+c.staffId+', '+c.fleet+').','Qualification: '+x.name+' '+st+'.',ex?'Rostering: this crew member must not be rostered for duty until revalidation is completed and recorded.':'Rostering: please plan the roster around the revalidation window.'])}}}
 if(ds.col==='fssReqs'){const r=S().find('fssReqs',ds.id);if(r){const p=S().find('fss',r.providerId)||{},c=S().find('crew',r.crewId)||{};
  return wrap(p.poc||p.name||'FSS Scheduling','FSS','Full flight simulator request — '+r.desc,['The Flight Operations Training Department, Yemenia Airways, requests the following simulator training service: '+r.desc+'.','Trainee: '+(c.rank||'')+' '+(c.name||'—')+' (Staff ID '+(c.staffId||'—')+', '+(c.fleet||'—')+').','Required by: '+r.need+'.','Kindly confirm availability and the allocated session date and time.'])}}
 if(ds.col==='rosters'){const r=S().find('rosters',ds.id);if(r)return wrap('Training Participants','ROS','Training roster and attendance — '+r.title,['Course: '+r.title+'.','Date: '+r.date+'.   Venue: '+r.room+'.','Attendance is recorded by scanning the QR code displayed at the room entrance on arrival. Participants are requested to be present before the scheduled start time.'])}
 if(!ds.act&&!ds.key&&!ds.col){const dp=((a.closest('.rm')||{}).querySelector&&(a.closest('.rm').querySelector('b')||{}).textContent)||'Addressee';return wrap(dp,'GEN','Coordination request',['',''])}
 return null}

/* ---------- safe opening (no page navigation, so iOS never unloads the app) ---------- */
const addr=a=>{const m=/^mailto:([^?]*)/i.exec(a.getAttribute('href')||'');try{return m?decodeURIComponent(m[1]):''}catch(e){return m?m[1]:''}};
const phone=a=>{const m=/wa\.me\/(\d*)/.exec(a.getAttribute('href')||'');return m?m[1]:''};
const mailUrl=(to,s,b)=>'mailto:'+encodeURIComponent(to).replace(/%40/g,'@').replace(/%2C/g,',')+'?subject='+encodeURIComponent(s)+'&body='+encodeURIComponent(b.replace(/\r?\n/g,'\r\n'));
const waUrl=(p,t)=>'https://wa.me/'+p+'?text='+encodeURIComponent(t);
function go(url,blank){const a=document.createElement('a');a.href=url;a.rel='noopener';if(blank)a.target='_blank';a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),600)}
function copy(t){try{navigator.clipboard.writeText(t).then(()=>T('Message copied'),()=>T('Copy failed'))}catch(e){const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy');T('Message copied')}catch(z){T('Copy failed')}x.remove()}}

/* ---------- "Sent Today" confirmation sheet ---------- */
let pend=null;const hide=()=>{pend=null;const s=$('#dspSheet');if(s)s.classList.add('hidden')};
function mark(p){const ds=p.ds,t0=DT().today();
 if(ds.col){const r=S().find(ds.col,ds.id);if(r&&r.sentOn!==t0)S().update(ds.col,ds.id,{sentOn:t0})}else if(ds.key&&!S().sentToday(ds.key))S().mark(ds.key);
 S().log('dispatch','SENT',p.lbl+': Pending','Sent Today · '+p.ch);T('Marked "Sent Today"');
 document.dispatchEvent(new CustomEvent('yptrms:tab',{detail:'dashboard'}))}
function sheet(p){pend=p;let s=$('#dspSheet');
 if(!s){s=document.createElement('div');s.id='dspSheet';document.body.appendChild(s);
  s.addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b||!pend)return;const a=b.dataset.s;if(a==='ok'){mark(pend);hide()}else if(a==='copy')copy(pend.text);else if(a==='again')go(pend.url,pend.blank);else hide()})}
 s.innerHTML='<b>'+esc(p.lbl)+'</b><p class="rp" style="margin:6px 0 10px">'+esc(p.ch)+' opened. Once the message has actually been sent, confirm below so it is recorded as <b>Sent Today</b>. If it did not open, use Copy text or Open again.</p><div class="fb"><button class="btn btn-primary sm" data-s="ok">Mark Sent Today</button><button class="btn btn-tonal sm" data-s="copy">Copy text</button><button class="btn btn-tonal sm" data-s="again">Open again</button><button class="btn btn-tonal sm" data-s="x">Dismiss</button></div>';
 s.classList.remove('hidden')}

/* ---------- capture-phase handler: runs before (and replaces) the old 350 ms auto-mark ---------- */
document.addEventListener('click',e=>{const a=e.target.closest('#tab-dashboard a.mini.em,#tab-dashboard a.mini.wa');if(!a)return;
 let c;try{c=compose(a)}catch(x){console.error(x)}if(!c)return;
 e.preventDefault();e.stopImmediatePropagation();
 const em=a.classList.contains('em'),to=em?addr(a):phone(a),text=c.subject+'\n\n'+c.body,url=em?mailUrl(to,c.subject,c.body):waUrl(to,text),track=a.hasAttribute('data-act');
 if(!to)T(em?'No email address on file — enter the recipient in Mail':'No WhatsApp number on file — choose the contact in WhatsApp');
 if(url.length>3500){copy(text);T('Message too long for a link — copied to the clipboard')}else go(url,!em);
 try{S().log('dispatch',(em?'EMAIL':'WHATSAPP')+' OPENED',c.subject,to||'(no address)')}catch(x){}
 if(track)sheet({ds:{...a.dataset},lbl:c.subject,ch:em?'Email':'WhatsApp',text,url,blank:!em})},true);
window.YDispatch={compose,formal};
})();

<script id="module-planner">
/* YPTRMS Stage 2A — Training Planner. Data: Store 'sessions' {date,start,end,room,course,instructor,trainees(count, kept numeric for Dashboard),traineeIds[],title}.
   Legacy/seed sessions (count only, no names) keep working; assigning names makes `trainees` = names assigned. */
(()=>{
if(window.YPlanner)return;
const S=()=>window.Store,D=window.YDate,$=s=>document.querySelector(s),T=m=>window.YPTRMS.toast(m);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mins=t=>+t.slice(0,2)*60+ +t.slice(3),PAL=['#1B3F85','#7C3AED','#0E9F6E','#B45309','#0891B2','#475569'];
const dt=s=>new Date(s+'T12:00:00'),addD=(s,n)=>{const d=dt(s);d.setDate(d.getDate()+n);return D.iso(d)};
const wkStart=s=>addD(s,-dt(s).getDay());                      /* weeks run Sunday–Saturday */
const fD=(s,o)=>dt(s).toLocaleDateString('en-GB',o||{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
const ovl=(a,b)=>a.date===b.date&&mins(a.start)<mins(b.end)&&mins(b.start)<mins(a.end);
const same=(a,b)=>String(a||'').trim().toLowerCase()===String(b||'').trim().toLowerCase();
const title=s=>`${s.course} · ${s.date} ${s.start}–${s.end} · ${s.room}`;
const sess=()=>S().get('sessions'),rooms=()=>S().get('rooms').concat((S().get('venues')||[]).map(v=>({id:'v-'+v.id,name:v.name,capacity:v.capacity||0,override:'',note:v.note||'',external:true,type:v.type||''}))),roomOf=n=>rooms().find(r=>r.name===n);
const active=()=>S().get('crew').filter(c=>c.status==='Active');
const cname=id=>(S().find('crew',id)||{}).name||'(removed)';
const ids=s=>Array.isArray(s.traineeIds)?s.traineeIds:[];
const rcol=n=>PAL[Math.max(0,rooms().findIndex(r=>r.name===n))%PAL.length];
let view='week',ws=wkStart(D.today()),Q='',fRoom='',rng='upcoming',ready=0;
const root=()=>$('#tab-planner');

/* ---------- conflict engine (also used for flags on existing sessions) ---------- */
function check(d,selfId){const E=[],W=[],others=sess().filter(s=>s.id!==selfId),r=roomOf(d.room),n=d.traineeIds.length||+d.trainees||0;
 if(!d.course||!d.date||!d.start||!d.end||!d.room||!String(d.instructor||'').trim())return{E:['Fill in course, date, start, end, room and instructor.'],W};
 if(mins(d.end)<=mins(d.start))E.push('End time must be after the start time.');
 if(!r)E.push(`Room "${esc(d.room)}" no longer exists in Facilities — pick another room.`);
 else{if(r.override==='Maintenance')E.push(`<b>${esc(r.name)}</b> is under <b>Maintenance</b>${r.note?' ('+esc(r.note)+')':''} — choose another room or clear the override in Settings.`);
  if(!r.external&&n>r.capacity)W.push(`${n} trainees exceed ${esc(r.name)} capacity (${r.capacity}).`)}
 if(mins(d.end)>mins(d.start)){
  others.filter(o=>o.room===d.room&&!(r&&r.external)&&ovl(d,o)).forEach(o=>E.push(`<b>Room clash</b>: ${esc(d.room)} is booked ${o.start}–${o.end} for “${esc(o.course)}”.`));
  others.filter(o=>same(o.instructor,d.instructor)&&!/^provider instructor/i.test(d.instructor)&&ovl(d,o)).forEach(o=>E.push(`<b>Instructor clash</b>: ${esc(d.instructor)} teaches “${esc(o.course)}” ${o.start}–${o.end} (${esc(o.room)}).`));
  const hit={};others.filter(o=>ovl(d,o)).forEach(o=>ids(o).filter(i=>d.traineeIds.includes(i)).forEach(i=>(hit[i]=hit[i]||[]).push(o.course)));
  const hk=Object.keys(hit);if(hk.length)E.push(`<b>Trainee clash</b>: ${hk.slice(0,4).map(i=>esc(cname(i))+' ('+esc(hit[i][0])+')').join(', ')}${hk.length>4?' +'+(hk.length-4)+' more':''} already in an overlapping session.`)}
 if(d.date<D.today())W.push('This session is in the past.');
 simRules(d,r,n,E,W,selfId);
 return{E,W}}
/* ---- Step 3: simulator-session rules (only when session kind is explicitly 'Sim') ---- */
function simRules(d,r,n,E,W,selfId){if(d.kind!=='Sim')return;
 const st=S().get('settings')||{},seats=(r&&r.capacity>0)?r.capacity:(+st.simSeats||4),tr=d.traineeIds.map(i=>S().find('crew',i)).filter(Boolean);
 if(!tr.length&&!(+d.trainees>0))E.push('Simulator sessions need at least one trainee.');
 if(n>seats)E.push(`<b>Simulator seats</b>: ${n} trainees exceed the ${seats} seat(s) for ${esc(d.room)}.`);
 tr.filter(c=>c.group!=='Flight').forEach(c=>E.push(`${esc(c.name)} is cabin crew — simulator sessions are for flight crew.`));
 const fl=[...new Set(tr.map(c=>c.fleet))];if(fl.length>1)W.push('Trainees are on different fleets ('+fl.join(', ')+') — one simulator type per session.');
 const cf=/a320/i.test(d.course)?'A320':/a330/i.test(d.course)?'A330':'';if(cf&&tr.some(c=>c.fleet!==cf))W.push(`Course is ${cf} but some trainees are on another fleet.`);
 if(r&&!(r.external&&/simulator/i.test(r.type||'')))W.push(`${esc(d.room)} is not listed as a simulator centre.`);
 if(mins(d.end)>mins(d.start)&&mins(d.end)-mins(d.start)>240)W.push('Simulator block is longer than 4 hours.');
 const f=(S().get('fss')||[]).find(x=>x.name===d.room),lead=(f&&+f.leadDays)||+st.fssLead||75,dd=D.daysTo(d.date);
 if(d.status==='Requested'&&r&&r.external&&dd>=0&&dd<lead)W.push(`Inside the FSS lead time (${lead} days) — ${esc(d.room)} may not be able to confirm (${dd} day(s) away).`);
 if(mins(d.end)>mins(d.start))sess().filter(o=>o.id!==selfId&&o.kind==='Sim'&&o.room===d.room&&ovl(d,o)).forEach(o=>W.push(`Another simulator session at ${esc(d.room)} overlaps (${o.start}–${o.end}, “${esc(o.course)}”) — fine only if the provider has a second device.`))}
const flags=s=>{const c=check({...s,traineeIds:ids(s)},s.id).E,r=roomOf(s.room),f=[];
 if(r&&r.override==='Maintenance')f.push('Room in maintenance');if(c.some(x=>x.includes('Room clash')))f.push('Room clash');if(c.some(x=>x.includes('Instructor clash')))f.push('Instructor clash');return f};

/* ---------- main view ---------- */
function mount(force){const r=root();if(!r||!window.YPTRMS||!window.YPTRMS.STATE.session)return;if(force!==1&&window.YUIGuard&&YUIGuard.defer('pl',()=>mount(1)))return;
 if(!ready){r.innerHTML='<div class="card"><div id="plBar"></div><div id="plBody"></div></div>';ready=1;
  r.addEventListener('click',onClick);r.addEventListener('input',e=>{if(e.target.id==='plQ'){Q=e.target.value;body()}});r.addEventListener('change',e=>{if(e.target.id==='plRoom'){fRoom=e.target.value;body()}})}
 bar();body()}
function bar(){const rl=rooms(),we=addD(ws,6);
 $('#plBar').innerHTML=`<div class="pl-tb"><h3><i data-lucide="calendar-days" class="ico"></i>Training Planner</h3><div class="grow"></div>
  <button class="chip ${view==='week'?'on':''}" data-v="week">Week</button><button class="chip ${view==='list'?'on':''}" data-v="list">List</button>
  <button class="btn btn-primary" data-add="${view==='week'&&D.today()>=ws&&D.today()<=we?D.today():view==='week'?ws:D.today()}"><i data-lucide="plus" class="ico"></i>Add Session</button><button class="btn btn-tonal" data-sim="1"><i data-lucide="monitor-play" class="ico"></i>Book Simulator</button><button class="btn btn-tonal" data-prog="1"><i data-lucide="printer" class="ico"></i>Print Program</button></div>
 <div class="pl-tb">${view==='week'?`<div class="pl-nav"><button class="ic" data-wk="-1" title="Previous week"><i data-lucide="chevron-left" class="ico"></i></button><b>${fD(ws,{day:'2-digit',month:'short'})} – ${fD(we,{day:'2-digit',month:'short',year:'numeric'})}</b><button class="ic" data-wk="1" title="Next week"><i data-lucide="chevron-right" class="ico"></i></button><button class="chip" data-wk="0">Today</button></div>`
  :['upcoming','past','all'].map(k=>`<button class="chip ${rng===k?'on':''}" data-rng="${k}">${{upcoming:'Upcoming',past:'Past',all:'All'}[k]}</button>`).join('')}
  <div class="grow"></div><select class="in" id="plRoom"><option value="">All rooms &amp; venues</option>${rl.map(r=>`<option ${fRoom===r.name?'selected':''}>${esc(r.name)}</option>`).join('')}</select>
  <input class="in" id="plQ" placeholder="Search course, instructor, trainee…" value="${esc(Q)}"></div>`;lucide.createIcons()}
function visible(){const q=Q.trim().toLowerCase();return sess().filter(s=>(!fRoom||s.room===fRoom)&&(!q||[s.course,s.instructor,s.room,...ids(s).map(cname)].join(' ').toLowerCase().includes(q)))
 .sort((a,b)=>(a.date+a.start<b.date+b.start?-1:1))}
function evH(s){const f=flags(s),n=ids(s).length||s.trainees||0,r=roomOf(s.room);
 return`<div class="pl-ev ${f.length?'bad':''}" style="--c:${rcol(s.room)}" data-view="${s.id}"><b>${esc(s.start)}–${esc(s.end)} · ${esc(s.course)}</b><small>${esc(s.room)} · ${esc(s.instructor)}</small><small class="pl-trn" data-trn="${s.id}">${n} trainee${n===1?'':'s'}${r&&!r.external?' / cap '+r.capacity:''}${ids(s).length?'':' (names not assigned)'}</small>${s.kind==='Sim'?`<span class="bdg a">SIM${s.status==='Requested'?' · requested':''}</span> `:''}${f.map(x=>`<span class="bdg r">${x}</span> `).join('')}<span class="pl-ea"><button class="ic" data-del="${s.id}" title="Delete session"><i data-lucide="trash-2" class="ico"></i></button><button class="ic" data-edit="${s.id}" title="Edit session"><i data-lucide="pen" class="ico"></i></button></span></div>`}
function body(){const list=visible(),T0=D.today();let h='';
 if(view==='week'){const wk=[...Array(7)].map((_,i)=>addD(ws,i));
  h=`<div class="pl-wk">${wk.map(d=>{const l=list.filter(s=>s.date===d);return`<div class="pl-day ${d===T0?'today':''}"><div class="pl-dh"><span>${fD(d,{weekday:'short',day:'2-digit',month:'short'})}</span><button data-add="${d}" title="Add session on this day">+</button></div><div class="pl-ds">${l.map(evH).join('')||'<div class="pl-none">No sessions</div>'}</div></div>`}).join('')}</div>
  <div class="pl-leg">${rooms().map(r=>`<span><i style="background:${rcol(r.name)}"></i>${esc(r.name)}${r.override==='Maintenance'?' (maintenance)':''}</span>`).join('')}<span><i style="background:#D71920;opacity:.35"></i>Red card = clash / maintenance</span></div>`}
 else{const l=list.filter(s=>rng==='all'||(rng==='upcoming'?s.date>=T0:s.date<T0));if(rng==='past')l.reverse();
  h=`<div style="overflow:auto"><table class="ora pl-list"><tr><th>Date</th><th>Time</th><th>Course</th><th>Room</th><th>Instructor</th><th>Trainees</th><th>Status</th><th></th></tr>`+
  l.map(s=>{const f=flags(s),n=ids(s).length||s.trainees||0;return`<tr data-view="${s.id}"><td>${fD(s.date)}</td><td>${esc(s.start)}–${esc(s.end)}</td><td><b>${esc(s.course)}</b>${s.kind==='Sim'?` <span class="bdg a">SIM${s.status==='Requested'?' · requested':''}</span>`:''}</td><td>${esc(s.room)}</td><td>${esc(s.instructor)}</td>
   <td class="pl-trn" data-trn="${s.id}">${n}${ids(s).length?'':' <small>(count only)</small>'}</td><td>${f.length?f.map(x=>`<span class="bdg r">${x}</span>`).join(' '):'<span class="bdg g">OK</span>'}</td>
   <td class="pl-act"><button class="ic" data-del="${s.id}" title="Delete session"><i data-lucide="trash-2" class="ico"></i></button><button class="ic" data-edit="${s.id}" title="Edit session"><i data-lucide="pen" class="ico"></i></button></td></tr>`}).join('')+(l.length?'':'<tr><td colspan="8">No sessions in this view.</td></tr>')+'</table></div>'}
 $('#plBody').innerHTML=h;lucide.createIcons()}
function onClick(e){const t=e.target,g=a=>t.closest('['+a+']');let x;
 if(x=g('data-del')){e.stopPropagation();return del(x.dataset.del)}
 if(x=g('data-edit'))return form(x.dataset.edit);
 if(x=g('data-view'))return window.YPlanPrint?YPlanPrint.view(x.dataset.view,{planner:true}):form(x.dataset.view);
 if(g('data-sim'))return form(null,undefined,{kind:'Sim'});
 if(g('data-prog'))return window.YPlanPrint?YPlanPrint.program():T('Print module not loaded');
 if(x=g('data-add'))return form(null,x.dataset.add);
 if(x=g('data-v')){view=x.dataset.v;return mount(1)}
 if(x=g('data-rng')){rng=x.dataset.rng;return mount(1)}
 if(x=g('data-wk')){const n=+x.dataset.wk;ws=n===0?wkStart(D.today()):addD(ws,7*n);return mount(1)}}

/* ---------- add / edit form ---------- */
window.YPlannerOpen=pre=>form(null,pre&&pre.date,pre);window.YPlannerApi={check,rooms,roomOf,flags,edit:(id,ov)=>form(id,undefined,ov?{override:ov}:undefined),del};
function modal(h){const m=document.createElement('div');m.className='mo';m.innerHTML=`<div class="md">${h}</div>`;$('#modal-root').appendChild(m);
 m.addEventListener('click',e=>{if(e.target===m||e.target.closest('[data-x]'))m.remove()});lucide.createIcons();return m}
function roomOptsH(kind,cur){const R=rooms(),isSim=r=>r.external&&/simulator/i.test(r.type||''),opt=r=>`<option value="${esc(r.name)}"${r.name===cur?' selected':''}>${esc(r.name)}${r.external?(r.capacity?' (cap '+r.capacity+')':''):' (cap '+r.capacity+')'}${r.override==='Maintenance'?' — MAINTENANCE':''}</option>`,
 sv=R.filter(isSim),ov=R.filter(r=>r.external&&!isSim(r)),ad=R.filter(r=>!r.external),grp=(l,a)=>a.length?`<optgroup label="${l}">${a.map(opt).join('')}</optgroup>`:'';
 let h=kind==='Sim'?grp('Simulator centres (external)',sv)+grp('Other external venues',ov)+grp('Aden rooms',ad):grp('Aden training rooms',ad)+grp('External venues',sv.concat(ov));
 if(cur&&!roomOf(cur))h+=`<option selected>${esc(cur)}</option>`;return h}
function form(id,date,pre){const old=id?S().find('sessions',id):null;if(id&&!old)return;
 const act=active(),actIds=new Set(act.map(c=>c.id)),dropped=old?ids(old).filter(i=>!actIds.has(i)):[];
 const d=old?{...old,traineeIds:ids(old).filter(i=>actIds.has(i)),headcount:ids(old).length?'':old.trainees}:{date:date||D.today(),start:'09:00',end:'12:00',course:'',room:(rooms().find(r=>r.override!=='Maintenance')||{}).name||'',instructor:'',traineeIds:[],headcount:''};
 if(old&&pre&&pre.override)Object.assign(d,pre.override);
 if(!old&&pre){d.course=pre.course||d.course;d.date=pre.date||d.date;d.traineeIds=(pre.traineeIds||[]).filter(i=>actIds.has(i));['room','start','end','instructor'].forEach(k=>{if(pre[k])d[k]=pre[k]})}
 d.kind=old?(old.kind||(window.YHours?YHours.kindOf(old):'Class')):((pre&&pre.kind)||'Class');
 if(!old&&d.kind==='Sim'&&!(pre&&pre.room)){const v=rooms().find(r=>r.external&&/simulator/i.test(r.type||''));if(v)d.room=v.name}
 d.status=old?(old.status||'Confirmed'):(d.kind==='Sim'?((pre&&pre.status)||(roomOf(d.room)&&roomOf(d.room).external?'Requested':'Confirmed')):'Confirmed');
 const sel=new Set(d.traineeIds);let tq='',tf='';
 const courses=S().get('courses').map(c=>c.name),instr=[...new Set(sess().map(s=>s.instructor).filter(Boolean))];
 const m=modal(`<div class="hd"><i data-lucide="calendar-plus" class="ico"></i><h3 class="grow" id="fHT">${old?'Edit':d.kind==='Sim'?'Book Simulator':'Add'} ${d.kind==='Sim'?'Simulator ':''}Training Session</h3><button class="ic" data-x><i data-lucide="x" class="ico"></i></button></div>
 <div class="bd"><div class="pl-f">
  <label class="lb">Session type<select class="in" id="fK"><option value="Class"${d.kind==='Class'?' selected':''}>Classroom / ground</option><option value="Sim"${d.kind==='Sim'?' selected':''}>Simulator (FSS)</option></select></label>
  <label class="lb" id="fTw"${d.kind==='Sim'?'':' style="display:none"'}>Booking status<select class="in" id="fT"><option${d.status==='Requested'?' selected':''}>Requested</option><option${d.status==='Confirmed'?' selected':''}>Confirmed</option></select></label>
  <label class="lb span2">Course<input class="in" id="fC" list="plCourses" value="${esc(d.course)}" placeholder="Select or type a course"><datalist id="plCourses">${courses.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></label>
  <label class="lb">Date<input type="date" class="in" id="fD" value="${d.date}"></label>
  <label class="lb">Start<input type="time" class="in" id="fS" value="${d.start}"></label>
