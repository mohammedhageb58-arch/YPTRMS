const ccMail=()=>ccList().filter(x=>x.email).map(x=>x.email).join(',');
function ccRow(){const L=ccList();if(!L.length||!ready2())return'';
 return`<div class="cm-r"><div><b>CC</b><br><small>${L.map(x=>esc(x.label)+(x.bad?' (no contact found)':'')).join(' · ')}</small></div><div class="qbt">${L.filter(x=>x.phone).map((x,i)=>`<button class="mini wa" data-ccwa="${i}"><i data-lucide="message-circle" class="ico"></i>WA ${esc(x.label.split(' ')[0])}</button>`).join('')}<button class="mini gy" data-cccopy><i data-lucide="copy" class="ico"></i>Copy CC list</button></div></div>`}
function go(url,blank){const a=document.createElement('a');a.href=url;a.rel='noopener';if(blank)a.target='_blank';a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),600)}
function copy(t){try{navigator.clipboard.writeText(t).then(()=>T('Message copied'),()=>T('Copy failed'))}catch(e){const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy');T('Message copied')}catch(z){T('Copy failed')}x.remove()}}
const ready2=()=>st.subj.trim()&&(st.body.trim()||st.tpl==='cred');
/* ---------- layout ---------- */
function mount(){const r=root();if(!r||!window.YPTRMS||!window.YPTRMS.STATE.session)return;
 if(!ready){st=fresh();r.innerHTML=`<div class="cm-g"><div class="cm-c"><div class="card"><div id="cmForm"></div></div><div class="card"><h3><i data-lucide="users" class="ico"></i>Recipients</h3><div id="cmRec"></div></div><div class="card"><h3><i data-lucide="send" class="ico"></i>Send</h3><div id="cmSend"></div></div></div>
  <div class="cm-c"><div class="card"><h3><i data-lucide="history" class="ico"></i>Sent Log</h3><div id="cmLog"></div></div></div></div>`;ready=1;
  r.addEventListener('click',onClick);r.addEventListener('input',onInput);r.addEventListener('change',onChange)}
 form();rec();send();log()}
function form(){const list=sess().filter(s=>s.date>=D.addDays(-1)).sort((a,b)=>a.date+a.start<b.date+b.start?-1:1);
 $('#cmForm').innerHTML=`<h3><i data-lucide="mail" class="ico"></i>Compose Formal Message</h3>
 <div class="cm-seg">${[['session','Training session'],['cred','Qualification status'],['general','General notice']].map(([k,l])=>`<button class="chip ${st.tpl===k?'on':''}" data-tpl="${k}">${l}</button>`).join('')}<div class="grow"></div><button class="btn btn-tonal sm" data-new><i data-lucide="file-plus" class="ico"></i>New message</button></div>
 <div class="cm-f">${st.tpl==='session'?`<label class="lb sp">Session (from Training Planner)<select class="in" id="cmSid"><option value="">— select a session —</option>${list.map(s=>`<option value="${s.id}" ${s.id===st.sid?'selected':''}>${esc(slabel(s))}</option>`).join('')}</select></label>
  <label class="lb sp">Message type<select class="in" id="cmKind">${Object.keys(KINDS).map(k=>`<option ${k===st.kind?'selected':''}>${k}</option>`).join('')}</select></label>`:''}
  <label class="lb sp">Subject<input class="in" id="cmSubj" value="${esc(st.subj)}" placeholder="Subject"></label>
  <label class="lb sp">${st.tpl==='cred'?'Additional note (optional — each crew member\'s own qualification list is added automatically)':'Message'}<textarea class="in" id="cmBody" style="height:150px" placeholder="Message text">${esc(st.body)}</textarea></label>
  <label class="lb sp">CC (optional — names, emails or phone numbers, comma separated)<input class="in" id="cmCc" list="cmCcL" value="${esc(st.cc)}" placeholder="e.g. Flight Scheduling, ops@yemenia.com"><datalist id="cmCcL">${S().get('contacts').map(c=>`<option value="${esc(c.dept)}">`).join('')}${S().get('fss').map(f=>`<option value="${esc(f.name)}">`).join('')}</datalist></label></div>
 <p class="rp" style="font-size:12px;color:var(--mut);margin-top:8px">Email gets the formal header, reference number and signature; WhatsApp gets a short version (greeting, subject, body, one-line footer). Editing the text stops auto-fill until you choose a different type or session.</p>`;lucide.createIcons()}
function rec(){const q=cq.trim().toLowerCase(),cl=active().filter(c=>!q||(c.name+' '+c.staffId+' '+c.rank+' '+c.fleet).toLowerCase().includes(q)).sort((a,b)=>a.name<b.name?-1:1);
 $('#cmRec').innerHTML=`<div class="qh">Active crew <span class="bdg">${st.crew.size} selected</span></div><div class="cm-box"><div class="cm-bh"><input class="in" id="cmQ" placeholder="Search name or Staff ID" value="${esc(cq)}"><button class="btn btn-tonal sm" data-all>Select shown</button><button class="btn btn-tonal sm" data-none>Clear</button></div>
  <div class="cm-l">${cl.map(c=>`<label class="cm-i"><input type="checkbox" data-crew="${c.id}" ${st.crew.has(c.id)?'checked':''}><span><b>${esc(c.name)}</b> <small>${esc(c.rank)} · ${esc(c.fleet)} · ${esc(c.staffId)}</small></span>${c.phone||c.email?'':'<span class="bdg a" style="margin-left:auto">No contact</span>'}</label>`).join('')||'<div class="cm-i">No active crew match.</div>'}</div></div>
  <div class="qh">Crew Control / Flight Scheduling</div><div class="ch">${S().get('contacts').map(c=>`<button class="chip ${st.cont.has(c.id)?'on':''}" data-cont="${c.id}">${esc(c.dept)}</button>`).join('')||'<small>None set up in Facilities.</small>'}</div>
  <div class="qh">External FSS providers</div><div class="ch">${S().get('fss').map(f=>`<button class="chip ${st.fss.has(f.id)?'on':''}" data-fss="${f.id}">${esc(f.name)}</button>`).join('')||'<small>None set up in Facilities.</small>'}</div>`}
function send(){const R=recips(),ok=ready2(),bulk=R.filter(r=>r.email);let h='';
 if(!R.length)h='<small style="color:var(--mut)">Select at least one recipient.</small>';
 else if(!ok)h='<small style="color:var(--mut)">Add a subject and a message to enable sending.</small>';
 else{h=R.map(r=>{const bs=(ch,has,ic,l,cls)=>{const k=r.key+'|'+ch,s=st.sent[k];return s==='sent'?`<span class="mini sentb"><i data-lucide="check" class="ico"></i>${l} sent</span>`:s==='opened'?`<button class="mini nv" data-ok="${k}">Confirm ${l} sent</button>`:`<button class="mini ${cls} ${has?'':'dis'}" data-snd="${k}"><i data-lucide="${ic}" class="ico"></i>${l}</button>`};
   return`<div class="cm-r"><div><b>${esc(r.name)}</b><br><small>${esc(r.phone||'no WhatsApp number')} · ${esc(r.email||'no email')}</small></div><div class="qbt">${bs('wa',digits(r.phone),'message-circle','WhatsApp','wa')}${bs('em',r.email,'mail','Email','em')}<button class="mini gy" data-pv="${r.key}"><i data-lucide="eye" class="ico"></i>Preview</button></div></div>`}).join('');
  if(st.tpl!=='cred'&&bulk.length>1)h+=`<div class="cm-r"><div><b>One email to all</b><br><small>${bulk.length} recipients in BCC · generic “All concerned” header</small></div><div class="qbt"><button class="mini em" data-bulk><i data-lucide="mails" class="ico"></i>Email all (BCC)</button><button class="mini gy" data-copy><i data-lucide="copy" class="ico"></i>Copy text</button></div></div>`}
 $('#cmSend').innerHTML=h+(R.length&&ok?ccRow():'');lucide.createIcons()}
function log(){const L=(S().get('settings').commsLog||[]).slice(0,25);
 $('#cmLog').innerHTML=L.length?`<div style="overflow:auto"><table class="ora cm-lg"><tr><th>When</th><th>To</th><th>Via</th><th>Subject</th></tr>${L.map(e=>`<tr><td>${new Date(e.ts).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</td><td>${esc(e.to)}</td><td>${e.ch}</td><td>${esc(e.subject.replace(/^Yemenia Flight Operations Training — /,''))}<br><small style="color:var(--mut)">${esc(e.user)}</small></td></tr>`).join('')}</table></div>`:'<small style="color:var(--mut)">Nothing sent yet. Confirmed messages appear here and in the Audit Log.</small>';lucide.createIcons()}
/* ---------- events ---------- */
function onInput(e){const t=e.target;
 if(t.id==='cmSubj'){st.subj=t.value;st.edited=true;send()}else if(t.id==='cmBody'){st.body=t.value;st.edited=true;send()}else if(t.id==='cmQ'){cq=t.value;rec()}else if(t.id==='cmCc'){st.cc=t.value;send()}}
function onChange(e){const t=e.target;
 if(t.id==='cmSid'){st.sid=t.value;st.edited=false;const s=S().find('sessions',t.value);if(s&&(s.traineeIds||[]).length)st.crew=new Set(s.traineeIds.filter(i=>active().some(c=>c.id===i)));st.sent={};auto();form();rec();send()}
 else if(t.id==='cmKind'){st.kind=t.value;st.edited=false;auto();form();send()}
 else if(t.dataset.crew){t.checked?st.crew.add(t.dataset.crew):st.crew.delete(t.dataset.crew);rec();send()}}
function onClick(e){const g=a=>e.target.closest('['+a+']');let x;
 if(x=g('data-tpl')){st.tpl=x.dataset.tpl;st.edited=false;st.sent={};auto();return form()||send()}
 if(g('data-new')){st=fresh();cq='';return mount()}
 if(g('data-all')){const q=cq.trim().toLowerCase();active().filter(c=>!q||(c.name+' '+c.staffId+' '+c.rank+' '+c.fleet).toLowerCase().includes(q)).forEach(c=>st.crew.add(c.id));rec();return send()}
 if(g('data-none')){st.crew.clear();rec();return send()}
 if(x=g('data-cont')){const k=x.dataset.cont;st.cont.has(k)?st.cont.delete(k):st.cont.add(k);rec();return send()}
 if(x=g('data-fss')){const k=x.dataset.fss;st.fss.has(k)?st.fss.delete(k):st.fss.add(k);rec();return send()}
 if(x=g('data-pv'))return preview(x.dataset.pv);
 if(x=g('data-snd'))return open(x.dataset.snd);
 if(x=g('data-ok'))return confirm(x.dataset.ok);
 if(g('data-bulk'))return bulkMail();
 if(x=g('data-ccwa')){const L=ccList().filter(z=>z.phone)[+x.dataset.ccwa];if(L){st.ref=st.ref||mkRef();const u='https://wa.me/'+L.phone+'?text='+encodeURIComponent(waMsg({name:L.label},1,[]).replace(/^Hello all,/,'Hello (CC),'));go(u,1);try{S().log('comms','WHATSAPP OPENED (CC)',st.subj,L.label)}catch(e){}}return}
 if(g('data-cccopy'))return copy(ccList().map(z=>z.label+(z.email?' <'+z.email+'>':'')+(z.phone?' +'+z.phone:'')).join('\n'));
 if(g('data-copy')){const m=msg(null,1);return copy(m.subject+'\n\n'+m.body)}}
function open(k){const [rk,ch]=k.split('|'),r=recips().find(z=>z.key===rk);if(!r||!ready2())return;
 st.ref=st.ref||mkRef();const m=msg(r),em=ch==='em',cm=ccMail(),url=em?'mailto:'+r.email+'?subject='+encodeURIComponent(m.subject)+(cm?'&cc='+encodeURIComponent(cm).replace(/%40/g,'@').replace(/%2C/g,','):'')+'&body='+encodeURIComponent(m.body.replace(/\r?\n/g,'\r\n')):'https://wa.me/'+digits(r.phone)+'?text='+encodeURIComponent(waMsg(r));
 if(url.length>3500){copy(em?m.subject+'\n\n'+m.body:waMsg(r));T('Message too long for a link — copied to the clipboard instead')}else go(url,!em);
 st.sent[k]='opened';try{S().log('comms',(em?'EMAIL':'WHATSAPP')+' OPENED',m.subject,r.name)}catch(x){}send()}
function confirm(k){const [rk,ch]=k.split('|'),r=recips().find(z=>z.key===rk);if(!r)return;const m=msg(r),L=S().get('settings');
 L.commsLog=L.commsLog||[];L.commsLog.unshift({ts:new Date().toISOString(),user:U().name,to:r.name,ch:ch==='em'?'Email':'WhatsApp',subject:m.subject,ref:st.ref});L.commsLog=L.commsLog.slice(0,200);
 st.sent[k]='sent';S().log('comms','SENT',m.subject+' → '+r.name,'Sent · '+(ch==='em'?'Email':'WhatsApp')+' · '+st.ref);   /* Store.log persists the settings change too */
 T('Recorded as sent');try{if(window.YTasks){YTasks.outbound({to:r.name,rk:r.key,ch:ch==='em'?'Email':'WhatsApp',subject:m.subject,ref:st.ref});if(st.taskId&&recips().every(z=>['wa','em'].some(c=>st.sent[z.key+'|'+c]==='sent')))YTasks.complete(st.taskId,'All messages recorded as sent');if(window.YUX)YUX.sentDone(st,recips())}}catch(x){console.error(x)}send();log();document.dispatchEvent(new CustomEvent('yptrms:tab',{detail:'dashboard'}))}
function bulkMail(){if(!ready2())return;st.ref=st.ref||mkRef();const to=recips().filter(r=>r.email).map(r=>r.email),m=msg(null,1),url='mailto:?bcc='+encodeURIComponent(to.join(',')).replace(/%40/g,'@').replace(/%2C/g,',')+(ccMail()?'&cc='+encodeURIComponent(ccMail()).replace(/%40/g,'@').replace(/%2C/g,','):'')+'&subject='+encodeURIComponent(m.subject)+'&body='+encodeURIComponent(m.body.replace(/\r?\n/g,'\r\n'));
 if(url.length>3500){copy(m.subject+'\n\n'+m.body);T('Too long for a link — message copied; paste into your mail app')}else go(url);
 S().log('comms','EMAIL OPENED (BCC)',m.subject,to.length+' recipient(s)')}
function preview(rk){const r=recips().find(z=>z.key===rk);if(!r)return;st.ref=st.ref||mkRef();const m=msg(r),d=document.createElement('div');d.className='mo';
 d.innerHTML=`<div class="md"><div class="hd"><h3 class="grow">Preview — ${esc(r.name)}</h3><button class="ic" data-x><i data-lucide="x" class="ico"></i></button></div><div class="bd"><b>${esc(m.subject)}</b><div class="cm-pv" style="margin-top:10px;max-height:40vh">${esc(m.body)}</div><div style="margin-top:10px"><b>WhatsApp (short)</b></div><div class="cm-pv" style="margin-top:6px;max-height:25vh">${esc(waMsg(r))}</div></div><div class="ft"><button class="btn btn-tonal" data-x>Close</button></div></div>`;
 d.firstElementChild.classList.add('sm');d.addEventListener('click',e=>{if(e.target===d||e.target.closest('[data-x]'))d.remove()});$('#modal-root').appendChild(d);lucide.createIcons()}
document.addEventListener('yptrms:login',mount);
document.addEventListener('yptrms:tab',e=>{if(e.detail==='comms')mount()});
function prefill(p){if(!ready)mount();st=fresh();cq='';st.tpl=p.tpl||'session';st.kind=p.kind||'Reminder';st.sid=p.sid||'';st.crew=new Set((p.crew||[]).filter(i=>active().some(c=>c.id===i)));st.cont=new Set(p.cont||[]);st.fss=new Set(p.fss||[]);st.cc=p.cc||'';st.taskId=p.taskId||'';
 if(p.subj||p.body){st.subj=p.subj||'';st.body=p.body||'';st.edited=true}else auto();
 const b=document.querySelector('#tabs [data-tab="comms"]');if(b)b.click();mount();if(window.YCommsX)YCommsX.show('compose')}
function draft(o){if(!ready)mount();st.tpl='general';st.sid='';st.edited=true;st.sent={};st.ref='';st.subj=o.subject||'';st.body=o.body||'';st.cc=o.cc||'';st.taskId='';
 st.crew=new Set((o.crew||[]).filter(i=>active().some(c=>c.id===i)));st.cont=new Set(o.cont||[]);st.fss=new Set(o.fss||[]);form();rec();send()}
window.YComms={refresh:mount,prefill,draft};
})();
</script>

<script id="step-a-forms">
/* YPTRMS Step A — Reference paper forms library (Settings). Metadata lives in Store collection "forms" (audited via Store.add/update/remove);
   file payloads (data-URLs) live under their own localStorage key so the main YPTRMS_V1 record stays small. All writes are verified and rolled back on quota errors. */
(()=>{
if(window.__stepAForms)return;window.__stepAForms=1;
const $=s=>document.querySelector(s),S=()=>window.Store,PK='YPTRMS_FORMFILES',LIMIT=5242880,CAP=.95,WARN=.85,FILE_MAX=900*1024;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T=m=>{try{window.YPTRMS.toast(m)}catch(e){console.log(m)}},ico=()=>{try{lucide.createIcons()}catch(e){}};
const CATS=['Attendance Sheet','Simulator Check Form','Training Record','Assessment / Checklist','Other'];
const kb=n=>n>=1048576?(n/1048576).toFixed(2)+' MB':Math.max(1,Math.round(n/1024))+' KB';
const forms=()=>{try{return S().get('forms')||[]}catch(e){return[]}};
const readP=()=>{try{const o=JSON.parse(localStorage.getItem(PK));return o&&typeof o==='object'?o:{}}catch(e){return{}}};
const writeP=o=>{try{const s=JSON.stringify(o);localStorage.setItem(PK,s);return localStorage.getItem(PK)===s}catch(e){return false}};
function used(){let b=0;try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);b+=(k.length+(localStorage.getItem(k)||'').length)*2}}catch(e){}return b}
const payB=()=>{const p=readP();return Object.keys(p).reduce((n,k)=>n+(k.length+String(p[k]).length)*2,0)};
const col=p=>p>85?'#D71920':p>60?'#F59E0B':'#16A34A';
function prune(){const ids=new Set(forms().map(f=>f.id)),p=readP();let ch=0;Object.keys(p).forEach(k=>{if(!ids.has(k)){delete p[k];ch=1}});if(ch)writeP(p)}

/* ---- file preparation: PDFs stored as-is, images downsized ---- */
const dataUrl=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(new Error('Could not read the file'));r.readAsDataURL(f)});
const shrink=(f,mx,q)=>new Promise((ok,no)=>{const u=URL.createObjectURL(f),im=new Image();
 im.onerror=()=>{URL.revokeObjectURL(u);no(new Error('Could not read this image'))};
 im.onload=()=>{URL.revokeObjectURL(u);const s=Math.min(1,mx/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*s));c.height=Math.max(1,Math.round(im.naturalHeight*s));
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',q))};im.src=u});
const rawSize=d=>Math.round((d.length-d.indexOf(',')-1)*3/4);
async function prep(f){
 if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){if(f.size>FILE_MAX)throw new Error('PDF is '+kb(f.size)+' — limit is '+kb(FILE_MAX)+'. Compress it or upload a scanned image instead');
  const d=await dataUrl(f);return{data:d.replace(/^data:[^;,]*/,'data:application/pdf'),mime:'application/pdf',size:f.size}}
 if(/^image\/(png|jpe?g|webp|gif)$/.test(f.type)){let d=await shrink(f,1600,.8);if(rawSize(d)>FILE_MAX)d=await shrink(f,1200,.65);if(rawSize(d)>FILE_MAX)throw new Error('Image is still too large after compression — use a smaller scan');return{data:d,mime:'image/jpeg',size:rawSize(d)}}
 throw new Error('Only PDF or image files (PNG, JPG, WebP) can be stored')}

/* ---- storage-aware save of a payload ---- */
function putPayload(id,data){const p=readP(),had=Object.prototype.hasOwnProperty.call(p,id),old=p[id],cost=(id.length+data.length)*2-(had?(id.length+String(old).length)*2:0);
 const proj=(used()+cost+(Object.keys(p).length?0:(PK.length+4)*2))/LIMIT;
 if(proj>CAP)return{ok:false,msg:'Not enough browser storage: saving this would use '+Math.round(proj*100)+'% of ~5 MB. Remove old scans/forms or hero photos first'};
 p[id]=data;if(!writeP(p)){if(had)p[id]=old;else delete p[id];writeP(p);return{ok:false,msg:'Browser storage is full or blocked — form NOT saved'}}
 return{ok:true,warn:proj>WARN?' — storage now '+Math.round(proj*100)+'% full':''}}

/* ---- modal helpers ---- */
function modal(html,cls){const m=document.createElement('div');m.className='mo';m.innerHTML=`<div class="md ${cls||'sm'}" style="max-width:${cls==='lg'?'900px':'560px'}">${html}</div>`;
 m.addEventListener('click',e=>{if(e.target===m||e.target.closest('[data-x]'))close(m)});$('#modal-root').appendChild(m);ico();return m}
const close=m=>{if(m._url){try{URL.revokeObjectURL(m._url)}catch(e){}}m.remove()};

function formDlg(id){const o=id?S().find('forms',id):null;
 const m=modal(`<div class="hd"><h3>${o?'Edit / replace reference form':'Upload reference form'}</h3></div><div class="bd g2">
 <label class="lb">Form name<input class="in" id="fmName" value="${esc(o?o.name:'')}" placeholder="e.g. Simulator Session Check Form"></label>
 <label class="lb">Category<select class="in" id="fmCat">${CATS.map(c=>`<option${o&&o.category===c?' selected':''}>${c}</option>`).join('')}</select></label>
 <label class="lb">Paper form version / reference<input class="in" id="fmVer" value="${esc(o?o.version||'':'')}" placeholder="e.g. Rev 3 — Jan 2026"></label>
 <label class="lb">Notes<input class="in" id="fmNote" value="${esc(o?o.note||'':'')}" placeholder="Optional"></label>
 <label class="lb" style="grid-column:1/-1">${o?'Replace file (optional — leave empty to keep the current file)':'File (PDF or image)'}<input class="in" id="fmFile" type="file" accept="application/pdf,.pdf,image/png,image/jpeg,image/webp"></label>
 <p class="rp" style="grid-column:1/-1;margin:0">Max ${kb(FILE_MAX)} per file. Images are compressed automatically. Files are stored in this browser only.</p></div>
 <div class="ft"><button class="btn btn-tonal" data-x>Cancel</button><button class="btn btn-primary" id="fmOk">${o?'Save':'Upload'}</button></div>`);
 const g=s=>m.querySelector(s);g('#fmName').focus();
 g('#fmOk').onclick=async()=>{const name=g('#fmName').value.trim(),f=g('#fmFile').files[0];
  if(!name)return T('Required: Form name');
  if(!o&&!f)return T('Choose a file to upload');
  if(forms().some(x=>x.name.toLowerCase()===name.toLowerCase()&&(!o||x.id!==o.id)))return T('A form with this name already exists — use Replace on it instead');
  const btn=g('#fmOk');btn.disabled=true;
  try{const meta={name,category:g('#fmCat').value,version:g('#fmVer').value.trim(),note:g('#fmNote').value.trim()};let warn='';
   if(f){const p=await prep(f),stamp={fileName:f.name,mime:p.mime,size:p.size,uploaded:new Date().toISOString()};
    if(o){const r=putPayload(o.id,p.data);if(!r.ok){btn.disabled=false;return T(r.msg)}warn=r.warn||'';S().update('forms',o.id,{...meta,...stamp,rev:(o.rev||1)+1})}
    else{const rec=S().add('forms',{...meta,...stamp,rev:1}),r=putPayload(rec.id,p.data);if(!r.ok){S().remove('forms',rec.id);btn.disabled=false;return T(r.msg)}warn=r.warn||''}}
   else if(o)S().update('forms',o.id,meta);

<script id="step-b-course-expiry">
/* YPTRMS Step B — (1) Course expiry tracking + reminders + suggested classes, (2) suitable-instructor dropdown for the planner.

   Thresholds match the existing credential alerts: Due Soon = within 60 days, Expired = past, safety notices from 30 days. */
(()=>{
if(window.__stepBCourse)return;window.__stepBCourse=1;
const $=s=>document.querySelector(s),S=()=>window.Store,D=()=>window.YDate;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T=m=>{try{window.YPTRMS.toast(m)}catch(e){console.log(m)}},ico=()=>{try{lucide.createIcons()}catch(e){}};
const SOON=60,NOTICE=30,SPREAD=30,HORIZON=90,MAXCLS=16;
const safe=(f,d)=>{try{return f()}catch(e){return d}};
const crew=()=>safe(()=>S().get('crew'),[])||[],courses=()=>safe(()=>S().get('courses'),[])||[];
const mins=t=>+String(t).slice(0,2)*60+ +String(t).slice(3);

/* ---------- course rules ---------- */
const CM=[[/crm/i,/^crm$/i],[/dangerous|\bdg\b/i,/^dg$/i],[/\bsep\b/i,/^sep/i],[/sms/i,/^sms$/i],[/opc|fss|recurrent.*sim/i,/opc|pc check/i],[/line check/i,/^line check/i],[/etops|rvsm/i,/etops/i],[/cmc/i,/^cmc$/i],[/\bcbt\b/i,/^cbt$/i],[/c of t/i,/^c of t$/i]];
const SIM=/\b(opc|fss|simulator|line check|check ride|tri|tre|standardi[sz]ation)\b|tri\/tre/i;
const kindOf=n=>SIM.test(n||'')?'sim':'ground';
const hasAuth=(c,re)=>(c.creds||[]).some(x=>re.test(x.name)&&x.expiry&&D().daysTo(x.expiry)>=0);
function applies(course,c){const n=course.name||'';if(c.status!=='Active')return false;
 if(course.group||course.roles){const g=course.group==='Flight Crew'?'Flight':course.group==='Cabin Crew'?'Cabin':course.group==='Ground Staff'?'Ground':'';if(g&&c.group!==g)return false;const rl=String(course.roles||'').split(',').filter(Boolean);if(rl.length&&!rl.includes(window.YRank?YRank.norm(c.rank):c.rank))return false}
 else{if(/cabin|attestation/i.test(n)&&c.group!=='Cabin')return false;
 if(/\b(opc|line check|fss|simulator)\b/i.test(n)&&c.group!=='Flight')return false}
 if(/\ba320\b/i.test(n)&&c.fleet!=='A320')return false;if(/\ba330\b/i.test(n)&&c.fleet!=='A330')return false;
 if(/\btri\b|\btre\b/i.test(n)&&!hasAuth(c,/^TR[IE] Authorization/))return false;return true}
function expiryOf(c,course){let best=null;const up=d=>{if(d&&(!best||d>best))best=d};
 (c.courseRecs||[]).filter(r=>r.courseId===course.id).forEach(r=>up(r.expiry));
 CM.filter(([a])=>a.test(course.name||'')).forEach(([,b])=>(c.creds||[]).filter(x=>b.test(x.name)).forEach(x=>up(x.expiry)));return best}
const stOf=d=>d<0?'x':d<=SOON?'s':'v';
function rows(course){const out=[],none=[];crew().forEach(c=>{if(!applies(course,c))return;const e=expiryOf(c,course);if(!e){none.push(c);return}const d=D().daysTo(e);out.push({c,course,expiry:e,d,st:stOf(d)})});return{rows:out.sort((a,b)=>a.d-b.d),none}}
const bdg=r=>{const p=r.st!=='g'&&window.YUX&&YUX.plannedInfo?YUX.plannedInfo(r.c.id,r.course.name):null,t=r.st==='x'?'Expired '+(-r.d)+' d':r.d+' d';return p?`<span class="bdg pl" title="Renewal session scheduled">${t} · Planned for ${p.date}</span>`:`<span class="bdg ${r.st==='x'?'r':r.st==='s'?'a':'g'}">${t}</span>`};
const addMonths=(iso,n)=>{const d=new Date(iso+'T12:00:00'),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return D().iso(d)};
const validity=c=>+c.validity>0?+c.validity:12;

/* ---------- clustering: crew with matching / near expiry → suggested classes ---------- */
const plannedFor=(c,course)=>{const T0=D().today(),cn=String(course.name||'').toLowerCase();return(S().get('sessions')||[]).some(s=>s.date>=T0&&s.status!=='Cancelled'&&Array.isArray(s.traineeIds)&&s.traineeIds.includes(c.id)&&(()=>{const n=String(s.course||'').toLowerCase();return n&&(n===cn||n.includes(cn)||cn.includes(n))})())};
function clusters(o){const out=[];courses().filter(c=>!o.course||c.id===o.course).forEach(course=>{
 const items=rows(course).rows.filter(r=>r.d<=o.horizon&&!plannedFor(r.c,course)),groups={};
 items.forEach(r=>{const k=kindOf(course.name)==='sim'?r.c.fleet:'all';(groups[k]=groups[k]||[]).push(r)});
 Object.keys(groups).forEach(k=>{let cur=null;groups[k].sort((a,b)=>a.d-b.d).forEach(r=>{
  if(!cur||r.d-cur.first>o.spread||cur.m.length>=o.max){cur={course,fleet:k==='all'?'':k,first:r.d,m:[]};out.push(cur)}cur.m.push(r);cur.last=r.d})})});
 out.forEach(g=>{g.urgent=g.first<0;const t=g.urgent?3:Math.max(3,g.first-7);g.date=D().addDays(Math.min(t,Math.max(3,g.first)));g.safeBy=D().addDays(g.first)});
 return out.sort((a,b)=>a.first-b.first)}

function openLink(url,blank){const a=document.createElement('a');a.href=url;a.rel='noopener';if(blank)a.target='_blank';a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),600)}
function send(key,r,to,ch){const m=msg(r,to),cc=(S().get('contacts').find(z=>z.dept==='Crew Control')||{}),ph=to==='crew'?r.c.phone:cc.phone,em=to==='crew'?r.c.email:cc.email;
 if(ch==='wa'){const sh=to==='crew'?(r.c.rank+' '+r.c.name+': your '+r.course.name+' course '+(r.d<0?'EXPIRED on '+r.expiry:'expires on '+r.expiry+' ('+r.d+' d)')+'. Please contact Flight Ops Training, Aden HQ.'):('Crew Control: '+r.c.rank+' '+r.c.name+' — '+r.course.name+' '+(r.d<0?'EXPIRED '+r.expiry:'expires '+r.expiry)+'. '+(r.d<0?'Please confirm with FOT before rostering.':'Renewal planned.'));openLink('https://wa.me/'+String(ph||'').replace(/\D/g,'')+'?text='+encodeURIComponent(sh+' — Yemenia FOT'),true)}

 setTimeout(()=>{S().mark(key);S().log('dispatch','SENT','Course notice ('+(to==='crew'?'Crew':'Crew Control')+') '+r.c.name+' / '+r.course.name+': Pending','Sent Today · '+(ch==='wa'?'WhatsApp':'Email'));T('Marked "Sent Today"');refreshAll()},350)}

 const list=()=>{const c=course(),qq=q.trim().toLowerCase(),L=crew().filter(x=>applies(c,x)&&(!qq||(x.name+' '+x.staffId).toLowerCase().includes(qq))).sort((a,b)=>a.name<b.name?-1:1);
  g('#rcL').innerHTML=L.map(x=>{const e=expiryOf(x,c);return`<label class="pl-tri" style="display:flex;gap:8px;padding:4px 6px"><input type="checkbox" data-id="${x.id}"${sel.has(x.id)?' checked':''}><span>${esc(x.name)} <small style="color:var(--mut)">${esc(x.rank)} · ${esc(x.fleet)} · ${e?'expires '+esc(e):'no record'}</small></span></label>`}).join('')||'<small>No applicable active crew.</small>'};
 g('#rcC').onchange=()=>{sel.clear();calc();list()};g('#rcD').oninput=calc;g('#rcQ').oninput=e=>{q=e.target.value;list()};
 g('#rcL').onchange=e=>{const i=e.target.dataset.id;if(i)e.target.checked?sel.add(i):sel.delete(i)};
 g('#rcOk').onclick=()=>{const c=course(),done=g('#rcD').value,exp=g('#rcE').value;
  if(!sel.size)return T('Select at least one crew member');if(!done||!exp)return T('Enter the completion and expiry dates');if(exp<=done)return T('Expiry must be after the completion date');
  const names=[];crew().filter(x=>sel.has(x.id)&&applies(c,x)).forEach(x=>{x.courseRecs=(x.courseRecs||[]).filter(r=>r.courseId!==c.id).concat([{courseId:c.id,done,expiry:exp}]);names.push(x.name)});
  if(!names.length)return T('No applicable crew selected');
  S().log('crew','COURSE COMPLETION RECORDED',c.name+': previous expiry per crew',names.length+' crew ('+names.slice(0,4).join(', ')+(names.length>4?' +'+(names.length-4)+' more':'')+') — completed '+done+', expires '+exp);
  m.remove();refreshAll();try{window.YUX&&YUX.courseDone(c,crew().filter(x=>sel.has(x.id)))}catch(e){console.error(e)}T('Course completion recorded for '+names.length+' crew')};
 calc();list()}

/* ---------- instructors ---------- */
const AUTHS=[['TRE',/^TRE Authorization/],['TRI',/^TRI Authorization/],['Ground Instructor',/^Ground Instructor Authorization/]];
function authsOf(c){return(c.creds||[]).map(x=>{const a=AUTHS.find(([,re])=>re.test(x.name));return a&&x.expiry?{t:a[0],d:D().daysTo(x.expiry)}:null}).filter(Boolean)}
function instructors(course,ctx){ctx=ctx||{};const n=course||'',kind=ctx.kind==='Sim'?'sim':ctx.kind==='Class'?'ground':kindOf(n),fl=/\ba320\b/i.test(n)?'A320':/\ba330\b/i.test(n)?'A330':'',cab=/cabin|attestation/i.test(n);
 const need=kind==='sim'?['TRE','TRI']:cab?['Ground Instructor']:['Ground Instructor','TRI','TRE'],used=new Set(),rec=[],oth=[],exp=[],staff=[],prev=[];
 const busy=nm=>ctx.date&&ctx.start&&ctx.end&&mins(ctx.end)>mins(ctx.start)&&S().get('sessions').some(s=>s.id!==ctx.id&&String(s.instructor||'').trim().toLowerCase()===nm.toLowerCase()&&s.date===ctx.date&&mins(ctx.start)<mins(s.end)&&mins(s.start)<mins(ctx.end));
 const item=(nm,note)=>({v:nm,l:nm+(note?' · '+note:'')+(busy(nm)?' — busy at this time':'')});
 crew().filter(c=>c.status==='Active').forEach(c=>{const A=authsOf(c);if(!A.length)return;const ok=A.filter(a=>a.d>=0),full=/^(Capt\.|F\/O)/.test(c.name)?c.name:c.rank+' '+c.name;
  if(!ok.length){exp.push({v:full,l:full+' · '+A.map(a=>a.t).join('/')+' authorization expired'});return}
  const match=ok.some(a=>need.includes(a.t)),fleetOk=!fl||c.fleet===fl;
  const tag=ok.map(a=>a.t).join('/')+' · '+c.fleet;
  if(match&&fleetOk&&(!cab||c.group==='Cabin')){rec.push(item(full,tag));used.add(full)}});
 safe(()=>S().get('managers'),[]).forEach(m=>{if(used.has(m.name))return;staff.push(item(m.name,m.role));used.add(m.name)});
 S().get('sessions').map(s=>String(s.instructor||'').trim()).filter(Boolean).forEach(nm=>{if(used.has(nm)||prev.some(p=>p.v===nm))return;prev.push(item(nm,'used before'))});
 return{kind,fl,need,groups:[['Qualified instructors for '+(n||'this course')+' ('+need.join(' / ')+(fl?' · '+fl:'')+(cab?' · cabin':'')+')',rec],...(ctx.kind==='Sim'?[['External provider',[{v:'Provider instructor (TBC)',l:'Provider instructor (to be confirmed)'}]]]:[])],expired:exp}}
function optionsH(course,ctx){const r=instructors(course,ctx),cur=(ctx&&ctx.current)||'',all=r.groups.flatMap(g=>g[1].map(x=>x.v));
 let h=`<option value=""${cur&&all.includes(cur)?'':' selected'}>${cur&&!all.includes(cur)?'— Manual entry: '+esc(cur)+' —':r.groups[0][1].length?'— Select a suggested instructor —':'— No qualified instructor found in Crew Records —'}</option>`;
 r.groups.forEach(([t,L])=>{if(L.length)h+=`<optgroup label="${esc(t)}">${L.map(x=>`<option value="${esc(x.v)}"${x.v===cur?' selected':''}>${esc(x.l)}</option>`).join('')}</optgroup>`});
 return h}
window.YInstructors={options:optionsH,suggest:instructors};

 const b=t.closest('#dCourseExp [data-ce]');if(b){const r=rows(courses().find(c=>c.id===b.dataset.k)||{name:'',id:''}).rows.find(x=>x.c.id===b.dataset.c);if(r)send(b.dataset.key,r,b.dataset.to,b.dataset.ce);return}

 if(i==='ceC')ST.course=e.target.value;else{const v=Math.max(1,parseInt(e.target.value,10)||1);if(i==='ceS')ST.spread=v;if(i==='ceH')ST.horizon=v;if(i==='ceM')ST.max=v}injectPanel(true)});

<script id="step-2-hours">
/* YPTRMS Step 2 — Class & Sim Hours (tab inside personal records).
   Sources: (a) completed Planner sessions (instructor = name match, student = traineeIds), (b) optional manual entries crew.hoursLog [{id,date,course,cat:'Class'|'Sim',role:'Student'|'Instructor',hours,note}] for history that pre-dates the app.
   No double counting: per person + role + category + day, overlapping session times are merged (the overlap is counted once and attributed to the earliest session);
   a session is only ever counted once per person per role. Only sessions that have finished count; upcoming hours are shown separately.
   Category: session.kind ('Class'|'Sim') if present (used by the Step 3 booking flow), else Sim when the venue is an external simulator centre or the course is an OPC/FSS/simulator/line-check course, else Class. */
(()=>{
if(window.__step2Hours)return;window.__step2Hours=1;
const S=()=>window.Store,D=()=>window.YDate,$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T=m=>{try{window.YPTRMS.toast(m)}catch(e){console.log(m)}},ico=()=>{try{lucide.createIcons()}catch(e){}};
const mins=t=>+String(t).slice(0,2)*60+ +String(t).slice(3);
const nm=s=>String(s||'').toLowerCase().replace(/^(capt\.?|captain|f\/o|purs|f\/a)\s+/,'').replace(/\s+/g,' ').trim();
const SIMRE=/\b(opc|fss|simulator|sim|line check|check ride)\b/i;
const kindOf=s=>{if(s.kind==='Class'||s.kind==='Sim')return s.kind;const v=(S().get('venues')||[]).find(v=>v.name===s.room);if(v&&/simulator/i.test(v.type||''))return'Sim';return SIMRE.test(s.course||'')?'Sim':'Class'};
const fieldOf=c=>/a320/i.test(c)?'A320':/a330/i.test(c)?'A330':/cabin|attestation|\bsep\b/i.test(c)?'Cabin':'General';
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const done=s=>s.date<D().today()||(s.date===D().today()&&mins(s.end)<=nowMin());
const inPeriod=(date,per)=>{if(per==='all')return true;const t=D().today();if(per==='ytd')return date.slice(0,4)===t.slice(0,4);return date>=D().addDays(-365)&&date<=t};
const h2=n=>(Math.round(n*100)/100).toString();

/* ---- calculation ---- */
function calc(c,per){per=per||'all';const myNm=nm(c.name),items=[];
 (S().get('sessions')||[]).forEach(s=>{if(!s.date||!s.start||!s.end||mins(s.end)<=mins(s.start)||s.status==='Requested')return;
  const k=kindOf(s),A0=mins(s.start),B0=mins(s.end),base={sid:s.id,date:s.date,course:s.course||'—',field:fieldOf(s.course||''),up:!done(s)},tm=s.timing,segs=[];
  if(k==='Sim'&&tm&&+tm.flight>=0&&(+tm.brief||0)+(+tm.debrief||0)+(+tm.flight)===B0-A0){let t=A0;[['Class',+tm.brief||0],['Sim',+tm.flight],['Class',+tm.debrief||0]].forEach(([cat,m],i)=>{if(m>0)segs.push({a:t,b:t+m,cat,i,main:cat===k});t+=m})}else segs.push({a:A0,b:B0,cat:k,i:0,main:true});
  const push=role=>segs.forEach(sg=>items.push({...base,...sg,role}));
  if(Array.isArray(s.traineeIds)&&s.traineeIds.includes(c.id)&&!['att','sim'].some(k=>s.forms&&s.forms[k]&&(s.forms[k].absent||[]).includes(c.id)))push('Student');
  if(nm(s.instructor)&&nm(s.instructor)===myNm)push('Instructor')});
 const seen=new Set(),uniq=items.filter(i=>{const k=i.sid+'|'+i.role+'|'+i.i;if(seen.has(k))return false;seen.add(k);return true});
 const grp={};uniq.forEach(i=>{const k=[i.role,i.cat,i.date,i.up].join('|');(grp[k]=grp[k]||[]).push(i)});
 const rows={},up={Student:{Class:0,Sim:0},Instructor:{Class:0,Sim:0}},tot={Student:{Class:0,Sim:0},Instructor:{Class:0,Sim:0}};let overlap=0;
 Object.values(grp).forEach(g=>{g.sort((x,y)=>x.a-y.a||x.sid.localeCompare(y.sid));let cov=-1;g.forEach(i=>{const m=Math.max(0,i.b-Math.max(i.a,cov)),full=i.b-i.a;cov=Math.max(cov,i.b);overlap+=full-m;if(!m)return;
  if(!i.up&&!inPeriod(i.date,per))return;
  if(i.up){up[i.role][i.cat]+=m/60;return}
  const k=[i.role,i.cat,i.course,i.field].join('|'),r=rows[k]=rows[k]||{role:i.role,cat:i.cat,course:i.course,field:i.field,sessions:0,hours:0,manual:0};if(i.main)r.sessions++;r.hours+=m/60;tot[i.role][i.cat]+=m/60})});
 (c.hoursLog||[]).forEach(e=>{const h=+e.hours;if(!(h>0)||!inPeriod(e.date||'',per))return;const role=e.role==='Instructor'?'Instructor':'Student',cat=e.cat==='Sim'?'Sim':'Class',k=[role,cat,e.course||'Manual entry',fieldOf(e.course||'')].join('|'),r=rows[k]=rows[k]||{role,cat,course:e.course||'Manual entry',field:fieldOf(e.course||''),sessions:0,hours:0,manual:0};r.manual+=h;r.hours+=h;tot[role][cat]+=h});
 return{rows:Object.values(rows).sort((a,b)=>a.role===b.role?(a.cat===b.cat?(a.course<b.course?-1:1):(a.cat<b.cat?-1:1)):(a.role<b.role?1:-1)),tot,up,overlap:overlap/60}}

/* ---- tab UI ---- */
let PER='all';
function tabHtml(M){if(!M||!M.id)return'<p class="rp">Save this profile first — hours are linked to the saved crew record.</p>';
 const c=S().find('crew',M.id);if(!c)return'<p class="rp">Record not found.</p>';
 let R;try{R=calc(c,PER)}catch(e){console.error(e);return'<p class="rp">Hours could not be calculated.</p>'}
 const t=R.tot,hasI=R.rows.some(r=>r.role==='Instructor'),tile=(l,v,u)=>`<div class="kpi" style="min-height:0;padding:12px 14px"><div class="kl">${l}</div><div class="kv" style="font-size:26px">${h2(v)}<small style="font-size:12px"> h</small></div>${u?`<small>+${h2(u)} h scheduled</small>`:''}</div>`;
 const lines=role=>R.rows.filter(r=>r.role===role).map(r=>`<tr><td>${esc(r.course)}${r.manual?` <small style="color:var(--mut)">(incl. ${h2(r.manual)} h manual)</small>`:''}</td><td>${esc(r.field)}</td><td><span class="bdg ${r.cat==='Sim'?'a':''}">${r.cat}</span></td><td>${r.sessions}</td><td><b>${h2(r.hours)}</b></td></tr>`).join('');
 const tbl=(role)=>{const L=lines(role);return L?`<div class="sh">${role==='Student'?'As student / trainee':'As instructor'}</div><div style="overflow:auto"><table class="ora"><tr><th>Course</th><th>Field</th><th>Category</th><th>Sessions</th><th>Hours</th></tr>${L}</table></div>`:''};
 const log=(c.hoursLog||[]).slice().sort((a,b)=>(b.date||'')<(a.date||'')?-1:1);
 return`<div class="tb"><h3 style="margin:0;font-size:15px;color:var(--navy)">Class &amp; Simulator Hours</h3><div class="grow"></div><select class="in" id="hrPer" style="max-width:190px;height:34px"><option value="all"${PER==='all'?' selected':''}>All time</option><option value="ytd"${PER==='ytd'?' selected':''}>This calendar year</option><option value="12m"${PER==='12m'?' selected':''}>Last 12 months</option></select></div>
 <div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:12px 0">${tile('Student · Class hours',t.Student.Class,R.up.Student.Class)}${tile('Student · Sim hours',t.Student.Sim,R.up.Student.Sim)}${hasI||t.Instructor.Class+t.Instructor.Sim>0?tile('Instructor · Class hours',t.Instructor.Class,R.up.Instructor.Class)+tile('Instructor · Sim hours',t.Instructor.Sim,R.up.Instructor.Sim):''}</div>
 <p class="rp" style="margin:0 0 6px">Counts finished Planner sessions only (trainees selected by name; headcount-only sessions cannot be attributed). Overlapping sessions for the same person are counted once${R.overlap>0?` — <b>${h2(R.overlap)} h</b> of overlap excluded here`:''}.</p>
 ${tbl('Student')}${tbl('Instructor')}${R.rows.length?'':'<p class="rp">No hours recorded for this period yet.</p>'}
 <div class="tb" style="margin-top:16px"><div class="sh" style="margin:0">Manual entries (history before the app)</div><div class="grow"></div><button class="btn btn-primary sm" data-hr="add"><i data-lucide="plus" class="ico"></i>Add hours</button></div>
 <div style="overflow:auto"><table class="ora"><tr><th>Date</th><th>Role</th><th>Course</th><th>Category</th><th>Hours</th><th>Note</th><th></th></tr>${log.map(e=>`<tr><td>${esc(e.date||'—')}</td><td>${esc(e.role)}</td><td>${esc(e.course||'—')}</td><td>${esc(e.cat)}</td><td>${h2(+e.hours)}</td><td>${esc(e.note||'—')}</td><td><button class="ic" data-hr="del" data-id="${e.id}" title="Delete"><i data-lucide="trash-2" class="ico"></i></button></td></tr>`).join('')||'<tr><td colspan="7">None.</td></tr>'}</table></div>`}
const rerender=()=>{const b=$('#pt [data-t="4"]');if(b)b.click()};

/* ---- manual entries ---- */
function addDlg(cid){const c=S().find('crew',cid);if(!c)return;const m=document.createElement('div');m.className='mo';
 m.innerHTML=`<div class="md sm" style="max-width:560px"><div class="hd"><h3>Add hours — ${esc(c.name)}</h3></div><div class="bd g2">
 <label class="lb">Role<select class="in" id="hrR"><option>Student</option><option>Instructor</option></select></label>
 <label class="lb">Category<select class="in" id="hrC"><option>Class</option><option>Sim</option></select></label>
 <label class="lb">Course / subject<input class="in" id="hrS" list="hrCs" placeholder="e.g. A320 Recurrent Ground"><datalist id="hrCs">${(S().get('courses')||[]).map(x=>`<option value="${esc(x.name)}">`).join('')}</datalist></label>
 <label class="lb">Hours<input class="in" type="number" id="hrH" min="0.25" max="500" step="0.25" placeholder="e.g. 4"></label>
 <label class="lb">Date<input class="in" type="date" id="hrD" value="${D().today()}"></label>
 <label class="lb">Note<input class="in" id="hrN" placeholder="Optional (e.g. paper record ref)"></label>
 <p class="rp" style="grid-column:1/-1;margin:0">Use this only for training that is <b>not</b> already a Planner session, otherwise the hours would be counted twice.</p></div>
 <div class="ft"><button class="btn btn-tonal" data-x>Cancel</button><button class="btn btn-primary" id="hrOk">Save</button></div></div>`;
 m.addEventListener('click',e=>{if(e.target===m||e.target.closest('[data-x]'))m.remove()});$('#modal-root').appendChild(m);
 m.querySelector('#hrOk').onclick=()=>{const g=s=>m.querySelector(s).value.trim(),h=parseFloat(g('#hrH')),date=g('#hrD');
  if(!g('#hrS'))return T('Required: Course / subject');if(!(h>=0.25&&h<=500))return T('Hours must be between 0.25 and 500');if(!date)return T('Required: Date');if(date>D().today())return T('Date cannot be in the future — use the Planner for upcoming sessions');
  const e={id:Math.random().toString(36).slice(2,9),date,course:g('#hrS'),cat:g('#hrC'),role:g('#hrR'),hours:h,note:g('#hrN')};
  c.hoursLog=(c.hoursLog||[]).concat([e]);
  S().log('crew','HOURS ADDED '+c.name,'—',e.role+' '+e.cat+' '+h2(h)+' h · '+e.course+' ('+e.date+')'+(e.note?' · '+e.note:''));
  m.remove();rerender();T('Hours added')}}
function delEntry(cid,id){const c=S().find('crew',cid),e=c&&(c.hoursLog||[]).find(x=>x.id===id);if(!e)return;
 const m=document.createElement('div');m.className='mo';m.innerHTML=`<div class="md sm" style="max-width:480px"><div class="hd"><h3>Confirm delete</h3></div><div class="bd">Delete the manual entry <b>${esc(e.role)} ${esc(e.cat)} ${h2(+e.hours)} h · ${esc(e.course)}</b>?</div><div class="ft"><button class="btn btn-tonal" data-x>Cancel</button><button class="btn btn-primary" id="hrYes">Delete</button></div></div>`;
 m.addEventListener('click',ev=>{if(ev.target===m||ev.target.closest('[data-x]'))m.remove()});$('#modal-root').appendChild(m);
 m.querySelector('#hrYes').onclick=()=>{c.hoursLog=c.hoursLog.filter(x=>x.id!==id);S().log('crew','HOURS DELETED '+c.name,e.role+' '+e.cat+' '+h2(+e.hours)+' h · '+e.course+' ('+e.date+')','—');m.remove();rerender();T('Entry deleted')}}

document.addEventListener('click',e=>{const b=e.target.closest('#pb [data-hr]');if(!b)return;const M=(window.YCrewCurrent&&window.YCrewCurrent())||null,id=M&&M.id;if(!id)return;
 if(b.dataset.hr==='add')addDlg(id);else if(b.dataset.hr==='del')delEntry(id,b.dataset.id)});
document.addEventListener('change',e=>{if(e.target.id==='hrPer'){PER=e.target.value;rerender()}});
window.YHours={calc,tabHtml,kindOf,fieldOf};
})();
</script>

<script id="step-3-suggest">
/* YPTRMS Step 3 — Planner suggestions (classes / FSS simulator sessions / future-training forecast) and Monthly Crew Release Advisory.
   Suggestions are produced by a deterministic rule engine on the Step B expiry data + the FSS lead-time window (Settings → fssLead, per-provider leadDays override);
   an optional Gemini narrative can be requested (anonymised counts/dates only — no names — sent to Google with the key saved in Settings).
   FSS rule: desired sim date = expiry − 14 d; earliest feasible = today + provider lead; sim date = later of the two (flag if it falls after expiry); request-by = sim date − lead.
   Weekend = Fri/Sat. Class slots 09:00–13:00 / 13:30–17:30 in the first Aden room (smallest that fits) that has no room, instructor or trainee clash.
   Advisory log: Store 'settings'.advisoryLog [{month,ts,channel,to}] + audit entries (area "comms"). */
(()=>{
if(window.__step3)return;window.__step3=1;
const $=s=>document.querySelector(s),S=()=>window.Store,D=()=>window.YDate;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T=m=>{try{window.YPTRMS.toast(m)}catch(e){console.log(m)}},ico=()=>{try{lucide.createIcons()}catch(e){}};
const safe=(f,d)=>{try{return f()}catch(e){console.error(e);return d}};
const crew=()=>S().get('crew')||[],ids=s=>Array.isArray(s.traineeIds)?s.traineeIds:[];
const iso0=(d,n)=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return D().iso(x)};
const wk=d=>new Date(d+'T12:00:00').getDay(),weekend=d=>wk(d)===5||wk(d)===6;
const fD=d=>new Date(d+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short'});
const fDY=d=>new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
const lead=()=>+(S().get('settings')||{}).fssLead||75,seats=()=>+(S().get('settings')||{}).simSeats||4;
const simVenues=()=>(S().get('venues')||[]).filter(v=>/simulator/i.test(v.type||''));
const leadOf=v=>{const f=(S().get('fss')||[]).find(x=>x.name===v.name);return(f&&+f.leadDays)||lead()};
const SIMC=/\b(opc|fss|simulator|line check|check ride)\b/i;
const who=c=>/^(capt\.?|f\/o|purs|f\/a)\s/i.test(c.name)?c.name:c.rank+' '+c.name;

/* ---------- 1. upcoming classes ---------- */

function findSlot(course,date,idList){const P=window.YPlannerApi;if(!P)return null;
 const R=P.rooms().filter(r=>!r.external&&r.override!=='Maintenance').sort((a,b)=>a.capacity-b.capacity),n=idList.length,fit=R.filter(r=>r.capacity>=n),pool=fit.length?fit:R.slice(-1);
 const from=date<=D().today()?iso0(D().today(),1):date;
 for(let k=0;k<21;k++){const d=iso0(from,k);if(weekend(d))continue;
  for(const [a,b] of [['09:00','13:00'],['13:30','17:30']]){const inst=pickInstructor(course,d,a,b)||'Instructor TBC';
   for(const r of pool){const res=P.check({course,date:d,start:a,end:b,room:r.name,instructor:inst,trainees:n,traineeIds:idList,kind:'Class'},null);
    if(!res.E.length)return{date:d,start:a,end:b,room:r.name,instructor:inst==='Instructor TBC'?'':inst,over:r.capacity<n,warn:res.W}}}}
 return null}

  const idl=m.map(r=>r.c.id),slot=findSlot(g.course.name,g.date,idl);return{g,m,idl,slot}}).filter(Boolean)}

/* ---------- 2. FSS simulator sessions ---------- */
function simSuggest(){const T0=D().today(),L0=lead(),V=simVenues().sort((a,b)=>leadOf(a)-leadOf(b)),ss=S().get('sessions')||[],rq=S().get('fssReqs')||[];
 if(!V.length)return{V,blocks:[]};const P=V[0],LP=leadOf(P),rows=[];
 crew().filter(c=>c.status==='Active'&&c.group==='Flight').forEach(c=>{
  const cr=(c.creds||[]).filter(x=>/opc|pc check/i.test(x.name)&&x.expiry).sort((a,b)=>a.expiry<b.expiry?-1:1)[0];if(!cr)return;
  const d=D().daysTo(cr.expiry);if(d>L0+90)return;
  if(ss.some(s=>s.kind==='Sim'&&s.date>=T0&&ids(s).includes(c.id))||rq.some(r=>r.crewId===c.id&&r.need>=T0))return;
  const want=iso0(cr.expiry,-14),early=iso0(T0,LP),sd=want>early?want:early;rows.push({c,expiry:cr.expiry,d,sd,lapse:sd>cr.expiry})});
 const by={};rows.forEach(r=>(by[r.c.fleet]=by[r.c.fleet]||[]).push(r));const blocks=[],max=seats();
 Object.keys(by).forEach(fl=>{let cur=null;by[fl].sort((a,b)=>a.sd<b.sd?-1:1).forEach(r=>{
  if(!cur||D().daysTo(r.sd)-D().daysTo(cur.date)>14||cur.m.length>=max){cur={fleet:fl,date:r.sd,m:[]};blocks.push(cur)}cur.m.push(r)})});
 blocks.forEach(b=>{b.venue=P;b.lead=LP;b.reqBy=iso0(b.date,-LP)<T0?T0:iso0(b.date,-LP);b.now=D().daysTo(b.reqBy)<=7;b.lapse=b.m.some(r=>r.lapse);b.first=Math.min(...b.m.map(r=>r.d))});

<script id="step-4-tasks">

const S=()=>window.Store,D=window.YDate,$=s=>document.querySelector(s),T=m=>window.YPTRMS.toast(m);

<script id="step-7-storage">
(function(){
