<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YPTRMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--navy:#0A1E46;--red:#D71920;--bg:#F8FAFC;--card:#fff;--line:#E2E8F0;--txt:#0F172A;--mut:#64748B;--ok:#16A34A;--tbh:72px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
.hidden{display:none!important}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.ico{width:18px;height:18px;vertical-align:middle}
/* Material 3 controls */
.field{position:relative;margin-bottom:16px}
.field input{width:100%;height:52px;border:1px solid #94A3B8;border-radius:12px;padding:18px 14px 6px 44px;font:inherit;background:#fff;outline:none;transition:.15s}
.field input:focus{border:2px solid var(--navy);padding:17px 13px 5px 43px}
.field label{position:absolute;left:44px;top:16px;color:var(--mut);pointer-events:none;transition:.15s}
.field input:focus+label,.field input:not(:placeholder-shown)+label{top:5px;font-size:11px;color:var(--navy);font-weight:600}
.field>i,.field>svg{position:absolute;left:14px;top:16px;color:var(--mut);width:20px;height:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 22px;border:0;border-radius:22px;font:600 14px Inter;cursor:pointer;transition:.15s}
.btn-primary{background:var(--red);color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}.btn-primary:hover{background:#B9141A;box-shadow:0 3px 8px rgba(215,25,32,.35)}
.btn-tonal{background:#E0E7F5;color:var(--navy)}.btn-tonal:hover{background:#CDD8EE}
.btn-ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);height:36px;padding:0 14px;font-size:13px}.btn-ghost:hover{background:rgba(255,255,255,.12)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);cursor:pointer}.chk input{accent-color:var(--navy);width:18px;height:18px}
/* Login */
#loginGate{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0A1E46 0%,#13306E 60%,#0A1E46 100%);padding:20px}
.login-box{width:100%;max-width:420px;padding:32px}
.login-head{text-align:center;margin-bottom:24px}
.login-head h1{color:var(--navy);font-size:28px;font-weight:800;letter-spacing:2px}
.login-head p{color:var(--mut);font-size:11px;letter-spacing:1px;margin-top:4px;text-transform:uppercase}
.emblem{min-width:136px;max-width:240px;height:68px;padding:0!important;border-radius:14px;background:#fff!important;display:inline-flex;align-items:center;justify-content:center;margin:0 auto 12px;color:#fff;border:2px solid var(--red)}
.err{color:var(--red);font-size:13px;min-height:18px;margin-bottom:8px}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.stack{display:flex;flex-direction:column;gap:10px}
/* Shell */
.topbar{background:var(--navy);color:#fff;display:flex;align-items:center;gap:20px;padding:0 24px;height:72px;position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:center;gap:14px}
#emblemSlot{min-width:88px;max-width:140px;height:48px;padding:0!important;border-radius:10px;border:2px dashed rgba(255,255,255,.45);display:inline-flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;flex:none;background:#fff!important}
#emblemSlot img{width:100%!important;height:100%!important;max-width:100%!important;max-height:100%!important;object-fit:fill!important;display:block}
#loginEmblem img{width:100%!important;height:100%!important;max-width:100%!important;max-height:100%!important;object-fit:fill!important;display:block}
.brand h1{font-size:28px;font-weight:800;text-transform:uppercase;letter-spacing:2px;line-height:1}
.brand small{display:block;font-size:10px;letter-spacing:1.2px;opacity:.75;margin-top:4px}
.search{flex:1;max-width:360px;margin-left:auto;position:relative}
.search input{width:100%;height:40px;border-radius:20px;border:0;padding:0 16px 0 40px;background:rgba(255,255,255,.12);color:#fff;font:inherit;outline:none}
.search input::placeholder{color:rgba(255,255,255,.6)}.search input:focus{background:rgba(255,255,255,.2)}
.search svg,.search i{position:absolute;left:13px;top:11px;width:18px;height:18px;color:rgba(255,255,255,.7)}
.clock{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;line-height:1.2}.clock small{display:block;font-size:10px;opacity:.7;font-weight:400}
.net{padding:5px 12px;border-radius:14px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
.net.on{background:rgba(22,163,74,.2);color:#4ADE80}.net.off{background:rgba(215,25,32,.25);color:#FCA5A5}
.net:before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.userbadge{display:flex;align-items:center;gap:10px;font-size:13px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--red);display:grid;place-items:center;font-weight:700}
.tabs{background:#fff;border-bottom:1px solid var(--line);display:flex;gap:4px;padding:0 24px;overflow-x:auto;position:sticky;top:var(--tbh,72px);z-index:40}
.tabs button{display:flex;align-items:center;gap:8px;padding:16px 18px;border:0;background:none;font:600 14px Inter;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--navy);background:#F1F5F9}.tabs button.active{color:var(--navy);border-bottom-color:var(--red)}
main{max-width:1400px;margin:0 auto;padding:24px}
.hero{background:linear-gradient(120deg,#0A1E46 0%,#14346F 100%);border-radius:16px;color:#fff;display:grid;grid-template-columns:1.1fr 1fr;min-height:220px;overflow:hidden;margin-bottom:24px;position:relative}
.hero-txt{padding:32px;z-index:2;display:flex;flex-direction:column;justify-content:center;gap:10px}
.hero-txt h2{font-size:30px;font-weight:800}.hero-txt p{opacity:.8;max-width:460px;line-height:1.5}
.hero-txt .tag{display:inline-block;background:var(--red);padding:4px 12px;border-radius:12px;font-size:11px;font-weight:700;letter-spacing:1px;width:max-content}
#heroSlideshow{position:relative;min-height:220px;overflow:hidden;clip-path:polygon(12% 0,100% 0,100% 100%,0 100%);
 background:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 2px,transparent 2px 28px),linear-gradient(135deg,#1B3F85,#0A1E46)}
#heroSlideshow .geo{position:absolute;inset:0;display:grid;place-items:center;opacity:.25}
#heroSlideshow .geo:before{content:"";width:180px;height:180px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 30px rgba(255,255,255,.08),0 0 0 60px rgba(215,25,32,.12)}
#heroSlideshow img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.5s ease}
#heroSlideshow img.show{opacity:1}
.hero-actions{position:absolute;bottom:12px;right:14px;z-index:3}
.tab-pane{display:none}.tab-pane.active{display:block}
/* Oracle-style tables & audit */
table.ora{width:100%;border-collapse:collapse;font-size:13px}
table.ora th{background:#EEF2F7;color:var(--navy);text-align:left;padding:9px 12px;border:1px solid var(--line);font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.5px}
table.ora td{padding:8px 12px;border:1px solid var(--line)}table.ora tr:nth-child(even) td{background:#F8FAFC}table.ora tr:hover td{background:#EAF0FA}
.audit{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#0F172A;color:#CBD5E1;border-radius:12px;padding:14px;max-height:260px;overflow:auto}
.audit .t{color:#64748B}.audit .u{color:#7DD3FC}.audit .a{color:#FCA5A5}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1E293B;color:#fff;padding:12px 22px;border-radius:12px;z-index:999;opacity:0;pointer-events:none;transition:.25s}
#toast.show{opacity:1}
@media(max-width:800px){
 .hero{grid-template-columns:1fr}#heroSlideshow{clip-path:none;min-height:140px}.brand h1{font-size:22px}
 /* clean multi-row mobile header with guaranteed visible logout button */
 .topbar{height:auto;min-height:60px;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 12px}
 .brand{flex:1 1 auto;min-width:0;gap:10px}
 .brand h1{font-size:20px;letter-spacing:1.5px}
 .brand small{display:block!important;font-size:8.5px;letter-spacing:.6px;line-height:1.25;white-space:normal;margin-top:3px}
 .userbadge{order:0;display:flex!important;align-items:center;gap:6px;flex-shrink:0;margin-left:auto}
 .userbadge span{display:none!important}
 #btnLogout{display:inline-flex!important;align-items:center;justify-content:center;flex-shrink:0;width:36px;height:36px;min-width:36px;padding:0;border-radius:10px;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.14);color:#fff!important;font-size:0;gap:0}
 #btnLogout .ico,#btnLogout svg{display:block!important;width:18px;height:18px;color:#fff!important;stroke:#fff!important;opacity:1!important;visibility:visible!important}
 .clock{display:block!important;order:1;flex:1 1 auto;text-align:left;font-size:13px}
 .clock small{font-size:9px}
 .net{order:2;flex-shrink:0;padding:4px 9px;font-size:11px}
 .search{order:3;flex:1 1 100%;max-width:none;margin:0}
 .tabs{padding:0 8px}
 .in,select.in,textarea.in,.field input{font-size:16px} /* stops iOS zoom-on-focus */
}
@media(max-width:380px){.brand h1{font-size:18px}.userbadge span{max-width:84px}}
</style>
<style id="dash-css">
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;position:relative;transition:.15s;display:flex;flex-direction:column;gap:6px}
.kpi:hover{box-shadow:0 6px 18px rgba(10,30,70,.12);transform:translateY(-2px)}
.kl{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}.kv{font-size:38px;font-weight:800;color:var(--navy);line-height:1}
.kpi small{color:var(--mut)}.kpi>.bdg{position:absolute;top:16px;right:16px}
.don{position:relative;width:84px;height:84px}.don b{position:absolute;inset:0;display:grid;place-items:center;font-size:18px;color:var(--navy)}
.dgrid{display:grid;grid-template-columns:1.6fr 1fr;gap:20px}.dcol{display:flex;flex-direction:column;gap:20px;min-width:0}
.card h3{font-size:15px;color:var(--navy);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.qh{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--mut);margin:14px 0 4px;letter-spacing:.5px}.qh:first-child{margin-top:0}
.qrow,.rm{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.qrow:last-child,.rm:last-child{border:0}
.qbt{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.qbt small,.qrow small,.rm small{color:var(--mut);font-size:11px}
.mini{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 11px;border-radius:14px;font:600 12px Inter;text-decoration:none;color:#fff;cursor:pointer}
.mini .ico{width:14px;height:14px}.mini.wa{background:#16A34A}.mini.em{background:var(--navy)}.mini.call{background:#475569}.mini.sentb{background:#DCFCE7;color:#166534;cursor:default}
.bdg{display:inline-block;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:700;background:#E2E8F0;color:#334155}
.bdg.r{background:#FEE2E2;color:#B91C1C}.bdg.a{background:#FEF3C7;color:#B45309}.bdg.g{background:#DCFCE7;color:#166534}
.rb{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12px}.rb>span{width:130px}.rb b{width:38px;text-align:right}
.bar{flex:1;height:8px;background:#E2E8F0;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%}
.live{font-size:12px;color:var(--mut);margin-bottom:8px;display:flex;align-items:center;gap:8px}.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pl 1.5s infinite}
@keyframes pl{50%{opacity:.3}}.audit div{padding:3px 0;border-bottom:1px solid #1E293B}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;text-align:center}.wb{height:70px;background:#EEF2F7;border-radius:6px;display:flex;align-items:flex-end;margin-bottom:4px}.wb i{display:block;width:100%;background:var(--navy);border-radius:6px}
.wk small{display:block;color:var(--mut);font-size:11px}.wt{display:flex;justify-content:space-around;margin-top:14px;font-size:12px;color:var(--mut)}.wt b{color:var(--navy);font-size:18px}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.dgrid{grid-template-columns:1fr}}
</style>
<style id="crew-css">
.tb{display:flex;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.grow{flex:1;min-width:0}
.ch{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{height:32px;padding:0 14px;border:1px solid #94A3B8;border-radius:8px;background:#fff;font:600 13px Inter;color:var(--txt);cursor:pointer}.chip:hover{background:#F1F5F9}.chip.on{background:#E0E7F5;border-color:var(--navy);color:var(--navy)}
.in{width:100%;height:44px;border:1px solid #94A3B8;border-radius:12px;padding:0 12px;font:inherit;background:#fff;outline:none}.in:focus{border:2px solid var(--navy);padding:0 11px}
textarea.in{height:80px;padding:10px 12px;resize:vertical}.lb{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--mut)}
th.s{cursor:pointer;user-select:none}tr.cr{cursor:pointer}.btn.sm{height:32px;padding:0 14px;font-size:12px}button.mini{border:0}
.mini.nv{background:var(--navy)}.mini.gy{background:#475569}.mini.rd{background:var(--red)}
.sw{width:40px;height:22px;border-radius:11px;border:0;background:#CBD5E1;position:relative;cursor:pointer}.sw:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}.sw.on{background:var(--ok)}.sw.on:after{left:21px}
.ic{width:34px;height:34px;border:0;border-radius:50%;background:transparent;cursor:pointer;color:var(--mut);display:inline-grid;place-items:center}.ic:hover{background:#EEF2F7}
.mo{position:fixed;inset:0;background:rgba(10,30,70,.55);display:grid;place-items:center;z-index:200;padding:16px;overflow:auto;-webkit-overflow-scrolling:touch}
.md{background:#fff;border-radius:16px;width:100%;max-width:880px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.3)}.md.sm{max-width:480px}.md.lg{max-width:920px}
.hd{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}.hd h3{color:var(--navy);font-size:17px}
.bd{padding:20px;overflow:auto;flex:1}.ft{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line)}
.mt{display:flex;border-bottom:1px solid var(--line);padding:0 12px;overflow-x:auto;flex-shrink:0;min-height:44px}.mt button{display:flex;gap:6px;align-items:center;padding:11px 14px;border:0;background:none;font:600 13px Inter;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;flex-shrink:0}.mt button.on{color:var(--navy);border-bottom-color:var(--red)}
@media(max-width:700px){.md:not(.sm){max-height:95vh;width:100%}.md:not(.sm) .hd{padding:10px 14px;gap:8px}.md:not(.sm) .hd h3{font-size:15px}.md:not(.sm) .hd .av{width:36px;height:36px;font-size:13px}.md:not(.sm) .bd{padding:14px}.md:not(.sm) .ft{padding:10px 14px}.mt{padding:0 6px}.mt button{padding:10px 10px;font-size:12px;gap:4px}}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.sh{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);font-weight:700;margin:18px 0 6px}
.av{width:44px;height:44px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;overflow:hidden;flex:none}.av img{width:100%;height:100%;object-fit:cover}.av.big{width:96px;height:96px;font-size:28px}
.rw{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.rw>b{width:150px;color:var(--navy);align-self:center}.rw .in{width:150px}
.fb{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.fn{font-size:12px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--navy)}
.pv{padding:12px;overflow:auto;text-align:center}.pv img{max-width:100%}.pv iframe{width:100%;height:70vh;border:0}
@media(max-width:700px){.g2{grid-template-columns:1fr}.rw>b{width:100%}}
</style>
<style id="pdf-css">
.stk{display:flex;flex-direction:column;gap:20px}.rp{color:var(--mut);font-size:12px;line-height:1.5;margin-bottom:14px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.th{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#F8FAFC}
.th img{width:100%;height:90px;object-fit:cover;display:block}.th .fb{justify-content:center;padding:4px}.ic:disabled{opacity:.3;cursor:default}
</style>
<style id="imp-css">.btn:disabled{opacity:.4;cursor:default}.kp{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}.kp>div{flex:1;min-width:110px;border:1px solid var(--line);border-radius:12px;padding:10px 14px}.kp b{display:block;font-size:26px;color:var(--navy)}.wn{font-size:12px;color:#B45309;background:#FEF3C7;border-radius:10px;padding:8px 12px;margin:10px 0;max-height:130px;overflow:auto;line-height:1.6}</style>
<style id="step2-css">
#yscn{position:fixed;inset:0;z-index:400;background:#000;color:#fff;display:flex;flex-direction:column;touch-action:none;user-select:none;-webkit-user-select:none}
#yscn .yt{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#0A1E46;border-bottom:3px solid #D71920}
#yscn .yt b{flex:1;font-size:16px}
#yscn .ys{flex:1;min-height:0;position:relative;overflow:hidden}
#yscn video,#yscn svg,#yscn .yimg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#yscn svg{touch-action:none}
#yscn .yq{fill:rgba(215,25,32,.14);stroke:#D71920;stroke-width:4;vector-effect:non-scaling-stroke;stroke-linejoin:round}
#yscn .yq.ok{stroke:#16A34A;fill:rgba(22,163,74,.2)}
#yscn circle{fill:#fff;stroke:#D71920;stroke-width:4;vector-effect:non-scaling-stroke;cursor:grab}
#yscn .ysh{fill:rgba(0,0,0,.55)}
#yscn .yhint{position:absolute;left:12px;right:12px;bottom:12px;text-align:center;background:rgba(10,30,70,.88);padding:8px 12px;border-radius:12px;font-size:13px}
#yscn .yb{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;padding:12px;background:#0A1E46}
#yscn .yshut{width:68px;height:68px;border-radius:50%;border:5px solid #fff;background:#D71920;box-shadow:0 0 0 3px #D71920;cursor:pointer}
#yscn .ych,#yscn .ypg{display:flex;gap:8px;width:100%;justify-content:center;flex-wrap:wrap}
#yscn .ych .chip{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
#yscn .ych .chip.on{background:#fff;color:#0A1E46}
#yscn .ypg img{height:56px;border:2px solid transparent;border-radius:6px;background:#fff}
#yscn .ypg img.on{border-color:#D71920}
</style>
<style id="step3-css">
#dspSheet{position:fixed;left:12px;right:12px;bottom:12px;z-index:380;max-width:560px;margin:auto;background:#fff;border:1px solid var(--line);border-top:4px solid var(--red);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.3);padding:14px 16px}
#ocrPill{position:fixed;left:12px;bottom:12px;z-index:380;background:#0A1E46;color:#fff;border-radius:18px;padding:8px 14px;font-size:12px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.3)}
</style>

<body>

<!-- LOGIN GATE -->
<div id="loginGate">
 <div class="card login-box">
  <div class="login-head">
   <div class="emblem" id="loginEmblem" style="overflow:hidden"><i data-lucide="plane"></i></div>
   <h1>YPTRMS</h1><p>Yemenia Pilot Training &amp; Records Management</p>
  </div>
  <form id="loginForm" autocomplete="on">
   <div class="field"><i data-lucide="user"></i><input id="lgId" placeholder=" " autocomplete="username" required><label>Email or Staff ID</label></div>
   <div class="field"><i data-lucide="lock"></i><input id="lgPw" type="password" placeholder=" " autocomplete="current-password" required><label>Password</label></div>
   <div class="row"><label class="chk"><input type="checkbox" id="lgRemember"> Remember Me</label></div>
   <div class="err" id="lgErr"></div>

<script>
/* YPTRMS Step 1A-1 — trial default password for all 5 manager slots: Yemenia@2026 (change in Settings module) */
const KEY='YPTRMS_V1';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const sha=async t=>{
 if(window.crypto&&crypto.subtle&&window.isSecureContext){
  return[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,'0')).join('');
 }
 let h=2166136261;
 for(let i=0;i<t.length;i++)h=Math.imul(h^t.charCodeAt(i),16777619);
 return(h>>>0).toString(16).padStart(8,'0');
};
const STATE={session:null,audit:[],users:[
 {slot:1,id:'82900',name:'Mohammed Khaled Hageb',email:'mohammed.hageb@yemenia.com',role:'System Admin'},
 {slot:2,id:'1002',name:'Capt. Amr',email:'amr@yemenia.com',role:'Training Manager'},
 {slot:3,id:'C001',name:'Coordinator 1',email:'coord1@yemenia.com',role:'Coordinator'},
 {slot:4,id:'C002',name:'Coordinator 2',email:'coord2@yemenia.com',role:'Coordinator'},
 {slot:5,id:'C003',name:'Coordinator 3',email:'coord3@yemenia.com',role:'Coordinator'}]};
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}};
const save=o=>{try{localStorage.setItem(KEY,JSON.stringify({...load(),...o}))}catch(e){toast('Storage full or blocked')}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800)}
function logAudit(action){STATE.audit.unshift({ts:new Date().toISOString(),user:STATE.session?STATE.session.id:'-',action});STATE.audit=STATE.audit.slice(0,200);save({audit:STATE.audit})}
async function initUsers(){const h=await sha('Yemenia@2026');STATE.users.forEach(u=>u.hash=h)}
async function authenticate(idv,pw){
 const q=idv.trim().toLowerCase(),u=STATE.users.find(x=>x.id.toLowerCase()===q||x.email===q);
 return u&&u.hash===await sha(pw)?u:null}
function enter(u,remember){
 window.YPTRMS=window.YPTRMS||{STATE,load,save,toast,logAudit,$,$$};
 STATE.session=u;STATE.audit=load().audit||[];
 if(remember!==undefined)save({remember:remember?u.id:null});
 save({lastUser:u.id});logAudit('LOGIN');
 $('#loginGate').classList.add('hidden');$('#appShell').classList.remove('hidden');
 $('#uName').textContent=u.name;$('#uAvatar').textContent=u.name.replace('Capt. ','')[0];
 $('#heroGreet').textContent='Welcome, '+u.name;
 document.dispatchEvent(new CustomEvent('yptrms:login',{detail:u}));try{lucide.createIcons();}catch(e){}}
$('#loginForm').addEventListener('submit',async e=>{
 e.preventDefault();$('#lgErr').textContent='';
 const u=await authenticate($('#lgId').value,$('#lgPw').value);
 if(!u){$('#lgErr').textContent='Invalid credentials. Please try again.';return}
 enter(u,$('#lgRemember').checked)});
$('#btnBio').onclick=async()=>{
 const st=load(),m=(window.Store&&window.Store.get('managers')||[]).find(x=>x.staffId===(st.lastUser||st.remember));
 if(m&&m.bio==='No'){toast('Biometric sign-in is disabled for this account');return}
 const supported=window.PublicKeyCredential&&navigator.credentials&&window.isSecureContext;
 if(!supported){toast('Biometrics unavailable here — use password or Quick Enter');return}
 try{
  const rnd=crypto.getRandomValues(new Uint8Array(32));
  const lastId=st.lastUser||st.remember;
  const user=STATE.users.find(x=>x.id===lastId);
  if(!user){toast('Sign in once with password first to enable biometrics');return}
  if(st.credId){
   const raw=Uint8Array.from(atob(st.credId),c=>c.charCodeAt(0));
   await navigator.credentials.get({publicKey:{challenge:rnd,allowCredentials:[{id:raw,type:'public-key'}],userVerification:'required',timeout:60000}});
  }else{
   const c=await navigator.credentials.create({publicKey:{challenge:rnd,rp:{name:'YPTRMS'},user:{id:new TextEncoder().encode(user.id),name:user.email,displayName:user.name},
    pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});
   save({credId:btoa(String.fromCharCode(...new Uint8Array(c.rawId)))});toast('Biometric enrolled for '+user.name)}
  enter(user,undefined)
 }catch(err){toast('Biometric cancelled or unsupported — use password')}};
(function ensureLogoutIcon(){const b=$('#btnLogout');if(!b)return;if(!b.querySelector('svg')){const sp=b.querySelector('.lo-txt');if(sp)sp.textContent='Logout';const ic=b.querySelector('i');if(ic&&!ic.textContent)ic.textContent='⎋'}})();
$('#btnLogout').onclick=()=>{logAudit('LOGOUT');STATE.session=null;$('#appShell').classList.add('hidden');$('#loginGate').classList.remove('hidden');$('#lgPw').value='';$('#lgErr').textContent=''};

$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 $$('#tabs button').forEach(x=>x.classList.toggle('active',x===b));
 $$('.tab-pane').forEach(p=>p.classList.toggle('active',p.id==='tab-'+b.dataset.tab));
 document.dispatchEvent(new CustomEvent('yptrms:tab',{detail:b.dataset.tab}))});
/* Clock + online badge */
function tick(){const d=new Date();$('#clockTime').textContent=d.toLocaleTimeString('en-GB');$('#clockDate').textContent=d.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'})+' · AST'}
function net(){const on=navigator.onLine,b=$('#netBadge');b.className='net '+(on?'on':'off');b.textContent=on?'Online':'Offline'}
setInterval(tick,1000);tick();net();addEventListener('online',net);addEventListener('offline',net);
/* Hero slideshow (fallback = geometric background) */
let slideTimer=null,slideIdx=0;
function renderSlides(){
 const box=$('#heroSlideshow'),imgs=load().heroImgs||[];
 box.querySelectorAll('img').forEach(i=>i.remove());clearInterval(slideTimer);
 imgs.forEach((src,i)=>{const im=new Image();im.src=src;im.alt='Aircraft';if(!i)im.className='show';box.appendChild(im)});
 const els=box.querySelectorAll('img');slideIdx=0;
 if(els.length>1)slideTimer=setInterval(()=>{els[slideIdx].classList.remove('show');slideIdx=(slideIdx+1)%els.length;els[slideIdx].classList.add('show')},5000)}
const readFile=f=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});
$('#heroFiles').onchange=async e=>{const arr=[];for(const f of [...e.target.files].slice(0,8))arr.push(await readFile(f));
 save({heroImgs:[...(load().heroImgs||[]),...arr].slice(-8)});renderSlides();toast(arr.length+' photo(s) added');e.target.value=''};
$('#emblemSlot').onclick=()=>$('#emblemFile').click();
$('#emblemFile').onchange=async e=>{if(e.target.files[0]){save({emblem:await readFile(e.target.files[0])});renderEmblem()}e.target.value=''};
function getLogoSrc(){const st=load();return st.emblem||(st.db&&st.db.settings&&st.db.settings.emblem)||''}
function renderEmblem(){const s=$('#emblemSlot'),le=$('#loginEmblem'),em=getLogoSrc();if(em){if(s){s.style.border='2px solid rgba(255,255,255,.65)';s.innerHTML='<img src="'+em+'" alt="Logo">'}if(le){le.style.background='#fff';le.style.borderColor='#CBD5E1';le.innerHTML='<img src="'+em+'" alt="Logo">'}}else{if(s){s.style.border='';s.style.background='';s.style.padding='';s.innerHTML='<i data-lucide="award"></i>'}if(le){le.style.background='#fff';le.style.borderColor='var(--red)';le.innerHTML='<i data-lucide="plane"></i>'}}try{lucide.createIcons()}catch(e){}}
window.addEventListener('storage',renderEmblem);
document.addEventListener('yptrms:login',renderEmblem);
/* Boot */
window.lucide=window.lucide||{createIcons(){}};
window.YPTRMS={STATE,load,save,toast,logAudit,$,$$};
(async()=>{
 try{await initUsers();}catch(e){console.warn('initUsers fallback:',e);}
 const st=load();
 if(st.remember){$('#lgId').value=st.remember;$('#lgRemember').checked=true}
 renderSlides();renderEmblem();
 try{lucide.createIcons();}catch(e){}
})();
</script>
<script id="core-db">
/* YPTRMS core-db: Store over YPTRMS_V1 (key "db"). Seed data is TRIAL sample data; every record supports Store.add/update/remove with audit. */
(()=>{
const Y=()=>window.YPTRMS,p2=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const D={iso,today:()=>iso(new Date()),addDays:n=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return iso(d)},
 daysTo:s=>Math.round((new Date(s+'T12:00:00')-new Date(iso(new Date())+'T12:00:00'))/864e5)};
const uid=()=>Math.random().toString(36).slice(2,9);

const persist=()=>Y().save({db:DB});

 const FC=['Class 1 Medical','Licence Validity','OPC / Recurrent'],CC=['Cabin Attestation','Medical','SEP / Recurrent'];
 const rows=[['Capt. Faisal Al-Hakimi','10110','CAPT','A320','Active','',[210,95,40]],['Capt. Saleh Bamatraf','10122','CAPT','A330','Active','',[150,300,52]],

 ['F/O Hani Mutahar','20152','F/O','A330','Active','',[330,260,28]],['F/O Rami Al-Sayed','20163','F/O','A320','Active','',[5,200,90]],
 ['Capt. Adel Shamsan','10171','CAPT','A330','Active','',[400,150,-3]],['F/O Tariq Bin Shaikh','20184','F/O','A330','Active','',[120,88,160]],

 ['Huda Al-Attas','30201','PURS','A320','Active','',[140,30,200]],['Amal Basurra','30212','PURS','A330','Active','',[-8,200,100]],
 ['Samar Al-Yafai','40221','F/A','A320','Active','',[55,170,220]],['Nadia Bajamal','40232','F/A','A330','Active','',[260,310,-20]],
 ['Rasha Al-Amoudi','40243','F/A','A320','Active','',[200,66,150]],['Layla Saeed','40254','F/A','A330','Active','',[18,120,300]],

 const fss=['JATS Amman','EgyptAir Training Academy Cairo'].map(name=>({id:uid(),name,poc:'POC — to be set',whatsapp:'',email:'',leadDays:null}));
 const S=[[0,'08:00','13:00','Aden Classroom 1','A320 Recurrent Ground','Capt. Amr',12],[0,'14:00','16:00','VACBI Room','CRM Module (VACBI)','Coordinator 1',6],
 [1,'09:00','12:00','Aden Classroom 2','SEP Cabin Recurrent','Coordinator 2',14],[2,'10:00','15:00','Aden Classroom 1','A330 Recurrent Ground','Capt. Amr',10],
 [3,'09:00','11:00','VACBI Room','Dangerous Goods','Coordinator 3',8],[5,'09:00','13:00','Aden Classroom 2','TRI Standardisation','Capt. Amr',5],
 [6,'13:00','16:00','Aden Classroom 1','Cabin Attestation Briefing','Coordinator 1',9]];
 return{v:1,managers:Y().STATE.users.map(u=>({id:uid(),slot:u.slot,staffId:u.id,name:u.name,email:u.email,role:u.role,phone:'',bio:'Yes'})),crew,
 rooms:[['Aden Classroom 1',20],['Aden Classroom 2',16],['VACBI Room',8]].map(([name,capacity])=>({id:uid(),name,capacity,override:'',note:''})),
 fss,fssReqs:[[0,3,'A320 OPC simulator slot',60],[0,5,'A320 recurrent FSS block',70],[1,4,'A330 recurrent FSS block',130]].map(([f,c,desc,n])=>({id:uid(),providerId:fss[f].id,crewId:crew[c].id,desc,need:D.addDays(n),sentOn:null})),

const db=()=>{if(!DB){DB=Y().load().db;if(!DB||!DB.v){DB=seed();persist()}else{let ch=0;if(!Array.isArray(DB.docTypes)){DB.docTypes=['Training Certificate','Attendance Record','Licence Copy','Medical Report','Correspondence','Other'].map(name=>({id:uid(),name}));ch=1}(DB.courses||[]).forEach(c=>{if(c.validity===undefined){c.validity=/dangerous/i.test(c.name)?'24':/tri|tre/i.test(c.name)?'36':'12';ch=1}});if(ch)persist()}}return DB};

<script id="core-dashboard">

 const info=act.map(c=>{const cr=c.creds.map(x=>({...x,d:D.daysTo(x.expiry)})).sort((a,b)=>a.d-b.d);return{c,cr,min:cr.length?cr[0].d:9999}});
 return{act,info,exp:info.filter(i=>i.min<0),soon:info.filter(i=>i.min>=0&&i.min<=60)}}

 return`<div class="kpi" data-kpi="active"><div class="kl">Active Crew</div><div class="kv">${a.act.length}</div><small>CAPT/FO ${fl} · PURS/F/A ${a.act.length-fl}</small><span class="bdg g" data-kpi="inactive">${inact} Inactive</span></div>

<div class="kpi" data-kpi="due"><div class="kl">Due Soon (Within 60 Days)</div><div class="kv" style="color:#F59E0B">${a.soon.length}</div><small>Active crew, nothing expired yet</small></div>

 h+=`<div class="qh">Safety notices — Crew + Crew Control (${notes.length})</div>`;

  const k1=`n:${T}:${c.id}:crew`,k2=`n:${T}:${c.id}:cc`,at=(k,l)=>`data-act="1" data-key="${k}" data-lbl="${esc(l)}"`;

 const lead=S.get('settings').fssLead,fr=S.get('fssReqs').map(r=>({r,p:S.get('fss').find(f=>f.id===r.providerId)||{},d:D.daysTo(r.need)})).filter(o=>o.d<=(o.p.leadDays||lead)&&(!o.r.sentOn||o.r.sentOn===T));
 h+=`<div class="qh">FSS requests inside lead time (${fr.length}) · default ${lead} days</div>`;
 fr.forEach(({r,p,d})=>{const cn=(S.find('crew',r.crewId)||{}).name||'—',m=`Dear ${p.poc||'Team'}, FSS request: ${r.desc} for ${cn}, required by ${r.need}. Please confirm availability.`;
  h+=`<div class="qrow"><div><b>${esc(p.name)}</b><br><small>${esc(r.desc)} · ${esc(cn)} · needed in ${d} d</small></div><div class="qbt">${send(`data-act="1" data-col="fssReqs" data-id="${r.id}"`,p.whatsapp,p.email,'FSS request: '+r.desc,m,r.sentOn===T)}</div></div>`});

  h+=`<div class="qrow"><div><b>${esc(r.title)}</b><br><small>${esc(r.date)} · ${esc(r.room)}</small></div><div class="qbt">${send(`data-act="1" data-col="rosters" data-id="${r.id}"`,'','','Roster: '+r.title,m,r.sentOn===T)}</div></div>`});
 if(!ro.length)h+='<small>All rosters dispatched.</small>';

function expiring(a){const rows=[];a.info.forEach(i=>i.cr.forEach(x=>{if(x.d<=60)rows.push({c:i.c,x})}));rows.sort((p,q)=>p.x.d-q.x.d);
 const bars=[['Flight','A320'],['Flight','A330'],['Cabin','A320'],['Cabin','A330']].map(([g,f])=>{const l=a.info.filter(i=>i.c.group===g&&i.c.fleet===f),v=pctOk(l);
  return`<div class="rb"><span>${g} · ${f} <small>(${l.length})</small></span><div class="bar"><i style="width:${v}%;background:${col(v)}"></i></div><b>${v}%</b></div>`}).join('');
 return bars+'<table class="ora" style="margin-top:12px"><tr><th>Name</th><th>Rank</th><th>Fleet</th><th>Expiring Credential</th><th>Days Left</th></tr>'+
 rows.slice(0,10).map(({c,x})=>`<tr><td>${esc(c.name)}</td><td>${esc(c.rank)}</td><td>${esc(c.fleet)}</td><td>${esc(x.name)}</td><td><span class="bdg ${x.d<=14?'r':'a'}">${x.d<0?'Expired '+(-x.d)+' d':x.d+' d'}</span></td></tr>`).join('')+
 (rows.length?'':'<tr><td colspan="5">No credentials expiring within 60 days.</td></tr>')+'</table>'+(rows.length>10?`<small style="color:var(--mut)">Showing 10 of ${rows.length}</small>`:'')}

 A.slice(0,12).map(e=>`<div><span class="t">${new Date(e.ts).toLocaleString('en-GB')}</span> <span class="u">${esc(e.user)} (${esc(e.staffId)})</span> ${esc(e.action)} [${esc(e.col)}] <span class="a">${esc(e.before)}</span> → ${esc(e.after)}</div>`).join('')+'</div>'}
function rooms(){const T=D.today(),n=nowMin(),ss=S.get('sessions').filter(s=>s.date===T);
 return S.get('rooms').map(r=>{const rs=ss.filter(s=>s.room===r.name).sort((a,b)=>a.start<b.start?-1:1),cu=rs.find(s=>mins(s.start)<=n&&n<mins(s.end)),nx=rs.find(s=>mins(s.start)>n);
  let st='Available',cl='g',nt=nx?`Next ${nx.start} · ${nx.course}`:'No more sessions today';
  if(r.override==='Maintenance'){st='Maintenance';cl='a';nt=r.note||'Out of service'}else if(cu){st='In Use';cl='r';nt=`${cu.course} until ${cu.end}`}
  return`<div class="rm"><div><b>${esc(r.name)}</b><br><small>${esc(nt)} · cap ${r.capacity}</small></div><span class="bdg ${cl}">${st}</span></div>`}).join('')}
function week(){const ss=S.get('sessions');let tot=0,tr=0,hr=0;
 const days=[...Array(7)].map((_,i)=>{const d=D.addDays(i),l=ss.filter(s=>s.date===d);l.forEach(s=>{tot++;tr+=s.trainees;hr+=(mins(s.end)-mins(s.start))/60});
  return{l:new Date(d+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short'}),n:l.length}}),mx=Math.max(1,...days.map(d=>d.n));
 return`<div class="wk">${days.map(d=>`<div><div class="wb"><i style="height:${d.n/mx*100}%"></i></div><small>${d.l}</small><b>${d.n}</b></div>`).join('')}</div><div class="wt"><span><b>${tot}</b> sessions</span><span><b>${tr}</b> trainees</span><span><b>${hr}</b> hrs</span></div>`}
function quick(){return S.get('contacts').map(c=>`<div class="rm"><div><b>${esc(c.dept)}</b><br><small>${esc(c.name)}</small></div><div class="qbt">

function render(){const root=$('#tab-dashboard');if(!root||!window.YPTRMS||!window.YPTRMS.STATE.session)return;

 const a=analyse(),set=(id,h)=>{const el=root.querySelector(id);if(el)el.innerHTML=h};
 set('#dKpis',kpis(a));set('#dQueue',queue(a));set('#dExpiring',expiring(a));set('#dAudit',auditH());set('#dRooms',rooms());set('#dWeek',week());set('#dQuick',quick());
 lucide.createIcons()}
document.addEventListener('click',e=>{
 const a=e.target.closest('#tab-dashboard a[data-act]');
 if(a){const ds={...a.dataset};setTimeout(()=>{if(ds.col)S.update(ds.col,ds.id,{sentOn:D.today()});else{S.mark(ds.key);S.log('dispatch','SENT',ds.lbl+': Pending','Sent Today')}render();window.YPTRMS.toast('Marked "Sent Today"')},350);return}

 if(k){window.YPTRMS.crewFilter=k.dataset.kpi;document.dispatchEvent(new CustomEvent('yptrms:crew-filter',{detail:k.dataset.kpi}));
  document.querySelector('#tabs [data-tab="crew"]').click();window.YPTRMS.toast('Crew Records filter: '+k.dataset.kpi)}});

const AUTH=[['TRE','TRE Authorization',1],['TRI','TRI Authorization',1],['Ground Instructor','Ground Instructor Authorization',0]];
const TRN={Flight:[['PC Check','OPC / Recurrent'],['Line Check','Line Check'],['SEP','SEP'],['CRM','CRM'],['DG','DG'],['SMS','SMS'],['C of T','C of T'],['ETOPS / RVSM','ETOPS / RVSM'],['CMC','CMC'],['CBT','CBT']],
 Cabin:[['SEP / Recurrent','SEP / Recurrent'],['CRM','CRM'],['DG','DG'],['SMS','SMS'],['C of T','C of T'],['CMC','CMC'],['CBT','CBT']]};

let F={st:'active',grp:'',fleet:'',val:''},Q='',SK='name',SD=1,M=null,PM=null,TAB=0,DD=null,tgt=null;

/* ---------- modal helpers ---------- */

/* ---------- file upload / scan ---------- */
function prep(f,mx){return new Promise((ok,no)=>{if(f.size>4e6)return no(new Error('File too large (max 4 MB)'));const r=new FileReader();r.onerror=()=>no(new Error('Could not read file'));

   if(!name)return skip('Missing name');if(!e1&&!sid)return skip('Missing Staff ID');
   const key=(sid||name).toLowerCase();if(seenK.has(key))return skip('Duplicate row in file');seenK.add(key);
   const rk=RK(g('rank'))||(e1?e1.rank:'');if(!rk)return skip(g('rank')?'Unknown rank "'+g('rank')+'"':'Missing rank');
   const fl=FL(rk),P={},B=[],A=[],notes=[];
   const set=(k,v)=>{if(v===''||v==null)return;const o=e1?e1[k]:undefined;if(!e1||o!==v){P[k]=v;B.push(k+': '+(o||'—'));A.push(k+': '+v)}};
   set('name',name);set('staffId',e1?'':sid);set('rank',rk);if(P.rank)P.group=fl?'Flight':'Cabin';
   const fv=/330/.test(g('fleet'))?'A330':/320/.test(g('fleet'))?'A320':'';if(!e1&&!fv)notes.push('fleet defaulted to A320');set('fleet',fv||(e1?'':'A320'));
   const bs=/SAN/i.test(g('base'))?"Sana'a":/ADEN|ADN/i.test(g('base'))?'Aden':'';set('base',bs||(e1?'':'Aden'));
   ['phone','phone2'].forEach(f=>{const raw=hm.fx[f]==null?'':r[hm.fx[f]];if(String(raw).trim()==='')return;const p=fmtPhone(raw);p===null?notes.push(f+' "'+raw+'" not recognised'):set(f,p)});
   const em=g('email').toLowerCase();if(/^\S+@\S+\.\S+$/.test(em))set('email',em);else if(em)notes.push('invalid email');
   if(/^(IN.?ACTIVE|RETIRED)/i.test(g('status'))){set('status','Inactive');if(!e1||e1.status==='Active')set('reason','Imported from spreadsheet')}
   const cm=new Map();
   hm.cr.forEach(({i,id,ty})=>{const nm=CN(id,fl);if(!nm)return;const d=pdate(r[i]);
    if(d.st==='ph')out.ph++;else if(d.st==='bad')out.bad.push('Row '+ln+' '+nm+' '+ty+' "'+r[i]+'"');

   const cur=e1?JSON.parse(JSON.stringify(e1.creds||[])):[],cb=[],ca=[];
   cm.forEach((o,nm)=>{if(!o.expiry)return;const c=cur.find(x=>x.name===nm);

   else if(cb.length)P.creds=cur;

   out.rows.push({...base,a,rk,id:e1&&e1.id,P,B:B.concat(cb),A:A.concat(ca),nc:cur.length,note:a==='Skip'?'No changes':notes.join('; ')})})});

/* ---------- preview + apply ---------- */
function showPreview(res,fname){
 const R=res.rows,c=a=>R.filter(r=>r.a===a).length,nN=c('New'),nU=c('Update'),nS=c('Skip')+res.blank;
 const kp=(l,v,col)=>`<div><span class="kl">${l}</span><b${col?` style="color:${col}"`:''}>${v}</b></div>`;
 const det=r=>String(r.a==='Update'?r.A.join('; '):r.a==='New'?r.nc+' credential(s)'+(r.note?' · '+r.note:''):r.note||'').slice(0,150);
 const W=[...res.warn];
 if(res.fix.length)W.push('<b>'+res.fix.length+' malformed date(s) repaired — please verify:</b> '+esc(res.fix.slice(0,6).join(' | '))+(res.fix.length>6?' …':''));
 if(res.bad.length)W.push('<b>'+res.bad.length+' unreadable date(s) ignored:</b> '+esc(res.bad.slice(0,6).join(' | '))+(res.bad.length>6?' …':''));
 if(res.ph)W.push(res.ph+' placeholder / NaN date(s) ignored (existing values are never overwritten by blanks).');
 W.push('Ambiguous dates are read day-first (dd/mm/yyyy). Blank rows are skipped. Nothing is saved until you press Apply.');
 const m=document.createElement('div');m.className='mo';
 m.innerHTML=`<div class="md lg"><div class="hd"><i data-lucide="file-spreadsheet" class="ico"></i><h3 class="grow">Import Preview — ${esc(fname)}</h3><button class="ic" data-x><i data-lucide="x" class="ico"></i></button></div><div class="bd">
 <div class="kp">${kp('New',nN,'#166534')}${kp('Updated',nU,'#B45309')}${kp('Skipped',nS)}${kp('Dates repaired',res.fix.length)}${kp('Placeholders ignored',res.ph)}</div>
 <div class="wn">${W.join('<br>')}</div>
 <div style="overflow:auto;max-height:300px"><table class="ora"><tr><th>Row</th><th>Action</th><th>Name</th><th>Staff ID</th><th>Rank</th><th>Details</th></tr>${R.slice(0,80).map(r=>`<tr><td>${r.ln}</td><td><span class="bdg ${r.a==='New'?'g':r.a==='Update'?'a':''}">${r.a==='Skip'&&r.note==='No changes'?'Unchanged':r.a}</span></td><td>${esc(r.name)}</td><td>${esc(r.sid||'—')}</td><td>${esc(r.rk||'')}</td><td>${esc(det(r))}</td></tr>`).join('')||'<tr><td colspan="6">No data rows.</td></tr>'}</table></div>${R.length>80?`<small style="color:var(--mut)">Showing 80 of ${R.length} rows</small>`:''}
 </div><div class="ft"><button class="btn btn-tonal" data-x>Cancel</button><button class="btn btn-primary" id="impOk" ${nN+nU?'':'disabled'}><i data-lucide="check" class="ico"></i>Apply Import (${nN} new, ${nU} updated)</button></div></div>`;
 m.addEventListener('click',e=>{if(e.target===m||e.target.closest('[data-x]'))m.remove()});
 m.querySelector('#impOk').onclick=()=>{m.remove();apply(res,fname)};
 $('#modal-root').appendChild(m);lucide.createIcons()}
function apply(res,fname){
 const A0=S.get('audit').slice(),before=S.get('crew').length,db=[],da=[],nn=[];let n=0,u=0;
 try{res.rows.forEach(r=>{
  if(r.a==='New'){S.add('crew',r.P);n++;nn.push(r.name+' ('+r.sid+')')}
  else if(r.a==='Update'){S.update('crew',r.id,r.P);u++;db.push(r.name+' ['+r.B.join('; ')+']');da.push(r.name+' ['+r.A.join('; ')+']')}})}
 catch(e){console.error(e);Y.toast('Import interrupted: '+e.message)}
 const A=S.get('audit');A.length=0;A.push(...A0);
 const sk=res.rows.filter(r=>r.a==='Skip').length+res.blank;
 if(u)S.log('crew','IMPORT DETAIL (updates)',cap(db.join(' | ')),cap(da.join(' | ')));
 if(n)S.log('crew','IMPORT DETAIL (new records)','—',cap(nn.join(' | ')));
 S.log('crew','IMPORT '+fname,'Crew records: '+before,'Crew records: '+S.get('crew').length+' (+'+n+' new, '+u+' updated, '+sk+' skipped; '+res.fix.length+' dates repaired, '+res.ph+' placeholders ignored)');
 ['crew','dashboard','reports'].forEach(t=>document.dispatchEvent(new CustomEvent('yptrms:tab',{detail:t})));
 Y.toast('Import complete: '+n+' new, '+u+' updated, '+sk+' skipped')}
async function onFile(e){const f=e.target.files[0];e.target.value='';if(!f)return;
 if(f.size>8e6)return Y.toast('File too large (max 8 MB)');
 try{Y.toast('Reading '+f.name+'…');await needXl();
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array',...(/\.csv$/i.test(f.name)?{raw:true}:{})}),res=analyse(wb);
  if(!res.sheets)return Y.toast(res.warn[0]||'No usable sheet found');
  showPreview(res,f.name)}catch(x){console.error(x);Y.toast('Import failed: '+x.message)}}

<script id="step3-ocr">

 const ex=L.filter(x=>E.test(x.c.slice(-35))).map(x=>x.d).sort(),is=L.filter(x=>!E.test(x.c.slice(-35))&&I.test(x.c.slice(-35))).map(x=>x.d).sort(),all=[...new Set(L.map(x=>x.d))].sort();
 const expiry=ex.length?ex[ex.length-1]:(all.length?all[all.length-1]:null),issue=is.length?is[0]:(all.length>1?all[0]:null);return{expiry,issue:issue&&issue!==expiry?issue:null}}

  const m=/^P[A-Z<]([A-Z<]{3})([A-Z<]+?)<<([A-Z<]+)/.exec(s);if(m&&!r.holder)r.holder=(m[3].replace(/</g,' ')+' '+m[2].replace(/</g,' ')).replace(/\s+/g,' ').trim()}

async function gem(d,key){const parts=[{text:prompt(d.key)}];
 for(const c of d.pages){const s=Math.min(1,1400/Math.max(c.width,c.height)),o=document.createElement('canvas');o.width=c.width*s;o.height=c.height*s;o.getContext('2d').drawImage(c,0,0,o.width,o.height);parts.push({inline_data:{mime_type:'image/jpeg',data:o.toDataURL('image/jpeg',.82).split(',')[1]}})}

/* ---------- engine 2: Tesseract.js (offline once warmed) ---------- */

const SEL=(k,f)=>k==='@pass'?{number:'#pb [data-f="passport.no"]',expiry:'#pb [data-f="passport.expiry"]'}[f]:k==='@doc'?{title:'[data-d="title"]',issue:'[data-d="date"]'}[f]:'#pb [data-c="'+k.replace(/"/g,'\\"')+'"][data-p="'+f+'"]';

<script id="step3-dispatch">
(()=>{

const $=s=>document.querySelector(s),T=m=>{try{toast(m)}catch(e){console.log(m)}},S=()=>window.Store,DT=()=>window.YDate;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P2=n=>String(n).padStart(2,'0'),U=()=>((window.YPTRMS||{}).STATE||{}).session||{name:'Flight Operations Training',id:'-'};

 const m=/^n:[^:]+:([^:]+):(crew|cc)$/.exec(ds.key||'');
 if(m){const c=S().find('crew',m[1]);if(c){const x=(c.creds||[]).filter(z=>z.expiry).map(z=>({...z,d:DT().daysTo(z.expiry)})).sort((p,q)=>p.d-q.d)[0];

/* ---------- safe opening (no page navigation, so iOS never unloads the app) ---------- */
const addr=a=>{const m=/^mailto:([^?]*)/i.exec(a.getAttribute('href')||'');try{return m?decodeURIComponent(m[1]):''}catch(e){return m?m[1]:''}};

/* ---------- "Sent Today" confirmation sheet ---------- */
let pend=null;const hide=()=>{pend=null;const s=$('#dspSheet');if(s)s.classList.add('hidden')};
function mark(p){const ds=p.ds,t0=DT().today();
 if(ds.col){const r=S().find(ds.col,ds.id);if(r&&r.sentOn!==t0)S().update(ds.col,ds.id,{sentOn:t0})}else if(ds.key&&!S().sentToday(ds.key))S().mark(ds.key);
 S().log('dispatch','SENT',p.lbl+': Pending','Sent Today · '+p.ch);T('Marked "Sent Today"');
 document.dispatchEvent(new CustomEvent('yptrms:tab',{detail:'dashboard'}))}
function sheet(p){pend=p;let s=$('#dspSheet');
 if(!s){s=document.createElement('div');s.id='dspSheet';document.body.appendChild(s);
  s.addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b||!pend)return;const a=b.dataset.s;if(a==='ok'){mark(pend);hide()}else if(a==='copy')copy(pend.text);else if(a==='again')go(pend.url,pend.blank);else hide()})}
 s.innerHTML='<b>'+esc(p.lbl)+'</b><p class="rp" style="margin:6px 0 10px">'+esc(p.ch)+' opened. Once the message has actually been sent, confirm below so it is recorded as <b>Sent Today</b>. If it did not open, use Copy text or Open again.</p><div class="fb"><button class="btn btn-primary sm" data-s="ok">Mark Sent Today</button><button class="btn btn-tonal sm" data-s="copy">Copy text</button><button class="btn btn-tonal sm" data-s="again">Open again</button><button class="btn btn-tonal sm" data-s="x">Dismiss</button></div>';
 s.classList.remove('hidden')}

/* ---------- capture-phase handler: runs before (and replaces) the old 350 ms auto-mark ---------- */
document.addEventListener('click',e=>{const a=e.target.closest('#tab-dashboard a.mini.em,#tab-dashboard a.mini.wa');if(!a)return;
 let c;try{c=compose(a)}catch(x){console.error(x)}if(!c)return;
 e.preventDefault();e.stopImmediatePropagation();
 const em=a.classList.contains('em'),to=em?addr(a):phone(a),text=c.subject+'\n\n'+c.body,url=em?mailUrl(to,c.subject,c.body):waUrl(to,text),track=a.hasAttribute('data-act');
 if(!to)T(em?'No email address on file — enter the recipient in Mail':'No WhatsApp number on file — choose the contact in WhatsApp');
 if(url.length>3500){copy(text);T('Message too long for a link — copied to the clipboard')}else go(url,!em);
 try{S().log('dispatch',(em?'EMAIL':'WHATSAPP')+' OPENED',c.subject,to||'(no address)')}catch(x){}
 if(track)sheet({ds:{...a.dataset},lbl:c.subject,ch:em?'Email':'WhatsApp',text,url,blank:!em})},true);
window.YDispatch={compose,formal};
})();
</script>
