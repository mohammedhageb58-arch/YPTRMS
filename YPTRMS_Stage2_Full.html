<script id="module-planner">
/* YPTRMS Stage 2A — Training Planner. Data: Store 'sessions' {date,start,end,room,course,instructor,trainees(count, kept numeric for Dashboard),traineeIds[],title}.
   Legacy/seed sessions (count only, no names) keep working; assigning names makes `trainees` = names assigned. */
(()=>{
if(window.YPlanner)return;
const S=()=>window.Store,D=window.YDate,$=s=>document.querySelector(s),T=m=>window.YPTRMS.toast(m);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mins=t=>+t.slice(0,2)*60+ +t.slice(3),PAL=['#1B3F85','#7C3AED','#0E9F6E','#B45309','#0891B2','#475569'];
const dt=s=>new Date(s+'T12:00:00'),addD=(s,n)=>{const d=dt(s);d.setDate(d.getDate()+n);return D.iso(d)};
const wkStart=s=>addD(s,-dt(s).getDay());                      /* weeks run Sunday–Saturday */
const fD=(s,o)=>dt(s).toLocaleDateString('en-GB',o||{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
const ovl=(a,b)=>a.date===b.date&&mins(a.start)<mins(b.end)&&mins(b.start)<mins(a.end);
const same=(a,b)=>String(a||'').trim().toLowerCase()===String(b||'').trim().toLowerCase();
const title=s=>`${s.course} · ${s.date} ${s.start}–${s.end} · ${s.room}`;
const sess=()=>S().get('sessions'),rooms=()=>S().get('rooms'),roomOf=n=>rooms().find(r=>r.name===n);
const active=()=>S().get('crew').filter(c=>c.status==='Active');
const cname=id=>(S().find('crew',id)||{}).name||'(removed)';
const ids=s=>Array.isArray(s.traineeIds)?s.traineeIds:[];
const rcol=n=>PAL[Math.max(0,rooms().findIndex(r=>r.name===n))%PAL.length];
let view='week',ws=wkStart(D.today()),Q='',fRoom='',rng='upcoming',ready=0;
const root=()=>$('#tab-planner');

/* ---------- conflict engine (also used for flags on existing sessions) ---------- */
function check(d,selfId){const E=[],W=[],others=sess().filter(s=>s.id!==selfId),r=roomOf(d.room),n=d.traineeIds.length||+d.trainees||0;
 if(!d.course||!d.date||!d.start||!d.end||!d.room||!String(d.instructor||'').trim())return{E:['Fill in course, date, start, end, room and instructor.'],W};
 if(mins(d.end)<=mins(d.start))E.push('End time must be after the start time.');
 if(!r)E.push(`Room "${esc(d.room)}" no longer exists in Facilities — pick another room.`);
 else{if(r.override==='Maintenance')E.push(`<b>${esc(r.name)}</b> is under <b>Maintenance</b>${r.note?' ('+esc(r.note)+')':''} — choose another room or clear the override in Settings.`);
  if(n>r.capacity)W.push(`${n} trainees exceed ${esc(r.name)} capacity (${r.capacity}).`)}
 if(mins(d.end)>mins(d.start)){
  others.filter(o=>o.room===d.room&&ovl(d,o)).forEach(o=>E.push(`<b>Room clash</b>: ${esc(d.room)} is booked ${o.start}–${o.end} for “${esc(o.course)}”.`));
  others.filter(o=>same(o.instructor,d.instructor)&&ovl(d,o)).forEach(o=>E.push(`<b>Instructor clash</b>: ${esc(d.instructor)} teaches “${esc(o.course)}” ${o.start}–${o.end} (${esc(o.room)}).`));
  const hit={};others.filter(o=>ovl(d,o)).forEach(o=>ids(o).filter(i=>d.traineeIds.includes(i)).forEach(i=>(hit[i]=hit[i]||[]).push(o.course)));
  const hk=Object.keys(hit);if(hk.length)E.push(`<b>Trainee clash</b>: ${hk.slice(0,4).map(i=>esc(cname(i))+' ('+esc(hit[i][0])+')').join(', ')}${hk.length>4?' +'+(hk.length-4)+' more':''} already in an overlapping session.`)}
 if(d.date<D.today())W.push('This session is in the past.');
 return{E,W}}
const flags=s=>{const c=check({...s,traineeIds:ids(s)},s.id).E,r=roomOf(s.room),f=[];
 if(r&&r.override==='Maintenance')f.push('Room in maintenance');if(c.some(x=>x.includes('Room clash')))f.push('Room clash');if(c.some(x=>x.includes('Instructor clash')))f.push('Instructor clash');return f};

/* ---------- main view ---------- */
function mount(){const r=root();if(!r||!window.YPTRMS||!window.YPTRMS.STATE.session)return;
 if(!ready){r.innerHTML='<div class="card"><div id="plBar"></div><div id="plBody"></div></div>';ready=1;
  r.addEventListener('click',onClick);r.addEventListener('input',e=>{if(e.target.id==='plQ'){Q=e.target.value;body()}});r.addEventListener('change',e=>{if(e.target.id==='plRoom'){fRoom=e.target.value;body()}})}
 bar();body()}
function bar(){const rl=rooms(),we=addD(ws,6);
 $('#plBar').innerHTML=`<div class="pl-tb"><h3><i data-lucide="calendar-days" class="ico"></i>Training Planner</h3><div class="grow"></div>
  <button class="chip ${view==='week'?'on':''}" data-v="week">Week</button><button class="chip ${view==='list'?'on':''}" data-v="list">List</button>
  <button class="btn btn-primary" data-add="${view==='week'&&D.today()>=ws&&D.today()<=we?D.today():view==='week'?ws:D.today()}"><i data-lucide="plus" class="ico"></i>Add Session</button></div>
 <div class="pl-tb">${view==='week'?`<div class="pl-nav"><button class="ic" data-wk="-1" title="Previous week"><i data-lucide="chevron-left" class="ico"></i></button><b>${fD(ws,{day:'2-digit',month:'short'})} – ${fD(we,{day:'2-digit',month:'short',year:'numeric'})}</b><button class="ic" data-wk="1" title="Next week"><i data-lucide="chevron-right" class="ico"></i></button><button class="chip" data-wk="0">Today</button></div>`
  :['upcoming','past','all'].map(k=>`<button class="chip ${rng===k?'on':''}" data-rng="${k}">${{upcoming:'Upcoming',past:'Past',all:'All'}[k]}</button>`).join('')}
  <div class="grow"></div><select class="in" id="plRoom"><option value="">All rooms</option>${rl.map(r=>`<option ${fRoom===r.name?'selected':''}>${esc(r.name)}</option>`).join('')}</select>
  <input class="in" id="plQ" placeholder="Search course, instructor, trainee…" value="${esc(Q)}"></div>`;lucide.createIcons()}
function visible(){const q=Q.trim().toLowerCase();return sess().filter(s=>(!fRoom||s.room===fRoom)&&(!q||[s.course,s.instructor,s.room,...ids(s).map(cname)].join(' ').toLowerCase().includes(q)))
 .sort((a,b)=>(a.date+a.start<b.date+b.start?-1:1))}
function evH(s){const f=flags(s),n=ids(s).length||s.trainees||0,r=roomOf(s.room);
 return`<div class="pl-ev ${f.length?'bad':''}" style="--c:${rcol(s.room)}" data-edit="${s.id}"><b>${esc(s.start)}–${esc(s.end)} · ${esc(s.course)}</b><small>${esc(s.room)} · ${esc(s.instructor)}</small><small>${n} trainee${n===1?'':'s'}${r?' / cap '+r.capacity:''}${ids(s).length?'':' (names not assigned)'}</small>${f.map(x=>`<span class="bdg r">${x}</span> `).join('')}</div>`}
function body(){const list=visible(),T0=D.today();let h='';
 if(view==='week'){const wk=[...Array(7)].map((_,i)=>addD(ws,i));
  h=`<div class="pl-wk">${wk.map(d=>{const l=list.filter(s=>s.date===d);return`<div class="pl-day ${d===T0?'today':''}"><div class="pl-dh"><span>${fD(d,{weekday:'short',day:'2-digit',month:'short'})}</span><button data-add="${d}" title="Add session on this day">+</button></div><div class="pl-ds">${l.map(evH).join('')||'<div class="pl-none">No sessions</div>'}</div></div>`}).join('')}</div>
  <div class="pl-leg">${rooms().map(r=>`<span><i style="background:${rcol(r.name)}"></i>${esc(r.name)}${r.override==='Maintenance'?' (maintenance)':''}</span>`).join('')}<span><i style="background:#D71920;opacity:.35"></i>Red card = clash / maintenance</span></div>`}
 else{const l=list.filter(s=>rng==='all'||(rng==='upcoming'?s.date>=T0:s.date<T0));if(rng==='past')l.reverse();
  h=`<div style="overflow:auto"><table class="ora pl-list"><tr><th>Date</th><th>Time</th><th>Course</th><th>Room</th><th>Instructor</th><th>Trainees</th><th>Status</th><th></th></tr>`+
  l.map(s=>{const f=flags(s),n=ids(s).length||s.trainees||0;return`<tr data-edit="${s.id}"><td>${fD(s.date)}</td><td>${esc(s.start)}–${esc(s.end)}</td><td><b>${esc(s.course)}</b></td><td>${esc(s.room)}</td><td>${esc(s.instructor)}</td>
   <td>${n}${ids(s).length?'':' <small>(count only)</small>'}</td><td>${f.length?f.map(x=>`<span class="bdg r">${x}</span>`).join(' '):'<span class="bdg g">OK</span>'}</td>
   <td class="pl-act"><button class="mini nv" data-edit="${s.id}"><i data-lucide="pencil" class="ico"></i>Edit</button> <button class="mini rd" data-del="${s.id}"><i data-lucide="trash-2" class="ico"></i></button></td></tr>`}).join('')+(l.length?'':'<tr><td colspan="8">No sessions in this view.</td></tr>')+'</table></div>'}
 $('#plBody').innerHTML=h;lucide.createIcons()}
function onClick(e){const t=e.target,g=a=>t.closest('['+a+']');let x;
 if(x=g('data-del')){e.stopPropagation();return del(x.dataset.del)}
 if(x=g('data-edit'))return form(x.dataset.edit);
 if(x=g('data-add'))return form(null,x.dataset.add);
 if(x=g('data-v')){view=x.dataset.v;return mount()}
 if(x=g('data-rng')){rng=x.dataset.rng;return mount()}
 if(x=g('data-wk')){const n=+x.dataset.wk;ws=n===0?wkStart(D.today()):addD(ws,7*n);return mount()}}

/* ---------- add / edit form ---------- */
function modal(h){const m=document.createElement('div');m.className='mo';m.innerHTML=`<div class="md">${h}</div>`;$('#modal-root').appendChild(m);
 m.addEventListener('click',e=>{if(e.target===m||e.target.closest('[data-x]'))m.remove()});lucide.createIcons();return m}
function form(id,date){const old=id?S().find('sessions',id):null;if(id&&!old)return;
 const act=active(),actIds=new Set(act.map(c=>c.id)),dropped=old?ids(old).filter(i=>!actIds.has(i)):[];
 const d=old?{...old,traineeIds:ids(old).filter(i=>actIds.has(i)),headcount:ids(old).length?'':old.trainees}:{date:date||D.today(),start:'09:00',end:'12:00',course:'',room:(rooms().find(r=>r.override!=='Maintenance')||{}).name||'',instructor:'',traineeIds:[],headcount:''};
 const sel=new Set(d.traineeIds);let tq='',tf='';
 const courses=S().get('courses').map(c=>c.name),instr=[...new Set(sess().map(s=>s.instructor).filter(Boolean))];
 const m=modal(`<div class="hd"><i data-lucide="calendar-plus" class="ico"></i><h3 class="grow">${old?'Edit':'Add'} Training Session</h3><button class="ic" data-x><i data-lucide="x" class="ico"></i></button></div>
 <div class="bd"><div class="pl-f">
  <label class="lb span2">Course<input class="in" id="fC" list="plCourses" value="${esc(d.course)}" placeholder="Select or type a course"><datalist id="plCourses">${courses.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></label>
  <label class="lb">Date<input type="date" class="in" id="fD" value="${d.date}"></label>
  <label class="lb">Start<input type="time" class="in" id="fS" value="${d.start}"></label>
  <label class="lb">End<input type="time" class="in" id="fE" value="${d.end}"></label>
  <label class="lb">Room<select class="in" id="fR">${rooms().map(r=>`<option value="${esc(r.name)}" ${r.name===d.room?'selected':''}>${esc(r.name)} (cap ${r.capacity})${r.override==='Maintenance'?' — MAINTENANCE':''}</option>`).join('')}${!roomOf(d.room)&&d.room?`<option selected>${esc(d.room)}</option>`:''}</select></label>
  <label class="lb span2">Instructor<input class="in" id="fI" list="plInstr" value="${esc(d.instructor)}" placeholder="Instructor / coordinator"><datalist id="plInstr">${instr.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></label>
  <label class="lb">Headcount<input type="number" min="0" class="in" id="fH" value="${d.headcount}" placeholder="if no names yet"></label></div>
  <div class="sh">Trainees — active crew only <span id="fCnt" class="bdg"></span></div>
  <div class="pl-tr"><div class="pl-trh"><input class="in" id="tQ" placeholder="Search name or Staff ID"><select class="in" id="tF" style="max-width:150px;height:36px"><option value="">All crew</option><option value="Flight">Flight crew</option><option value="Cabin">Cabin crew</option><option>A320</option><option>A330</option></select>
   <button class="btn btn-tonal sm" id="tAll">Select shown</button><button class="btn btn-tonal sm" id="tNone">Clear</button></div><div class="pl-trl" id="tL"></div></div>
  <div class="pl-conf" id="fConf"></div></div>
 <div class="ft">${old?'<button class="btn btn-tonal" id="fDel" style="margin-right:auto">Delete</button>':''}<button class="btn btn-tonal" data-x>Cancel</button><button class="btn btn-primary" id="fSave">${old?'Save changes':'Add session'}</button></div>`);
 const g=i=>m.querySelector(i),cur=()=>({id:id||undefined,course:g('#fC').value.trim(),date:g('#fD').value,start:g('#fS').value,end:g('#fE').value,room:g('#fR').value,instructor:g('#fI').value.trim(),trainees:+g('#fH').value||0,traineeIds:[...sel]});
 const busy=()=>{const c=cur(),b={};if(c.date&&c.start&&c.end&&mins(c.end)>mins(c.start))sess().filter(o=>o.id!==id&&ovl(c,o)).forEach(o=>ids(o).forEach(i=>b[i]=o.course));return b};
 function people(){const b=busy(),q=tq.trim().toLowerCase();
  const l=act.filter(c=>(!q||(c.name+' '+c.staffId+' '+c.rank).toLowerCase().includes(q))&&(!tf||[c.group,c.fleet].includes(tf))).sort((a,b)=>a.name<b.name?-1:1);
  g('#tL').innerHTML=l.map(c=>{const bz=b[c.id]&&!sel.has(c.id);return`<label class="pl-tri ${bz?'dis':''}"><input type="checkbox" data-c="${c.id}" ${sel.has(c.id)?'checked':''} ${bz?'disabled':''}><span><b>${esc(c.name)}</b> <small>${esc(c.rank)} · ${esc(c.fleet)} · ${esc(c.staffId)}</small></span>${b[c.id]?`<span class="bdg a">Busy: ${esc(b[c.id])}</span>`:''}</label>`}).join('')||'<div class="pl-tri">No active crew match.</div>';
  g('#tL')._shown=l.filter(c=>!b[c.id]).map(c=>c.id)}
 function upd(){const c=cur(),r=check(c,id),n=c.traineeIds.length,rm=roomOf(c.room);
  g('#fCnt').textContent=n?`${n} selected${rm?' / cap '+rm.capacity:''}`:'none selected';g('#fH').disabled=n>0;
  g('#fConf').innerHTML=r.E.map(x=>`<div class="e">⛔ ${x}</div>`).join('')+r.W.map(x=>`<div class="w">⚠ ${x}</div>`).join('')+(dropped.length&&old?`<div class="w">⚠ ${dropped.length} previously assigned crew member(s) are no longer Active and will be removed on save.</div>`:'')+(!r.E.length?'<div class="k">✓ No room, instructor or trainee conflicts.</div>':'');
  g('#fSave').disabled=r.E.length>0;return r}
 m.addEventListener('input',e=>{if(e.target.id==='tQ'){tq=e.target.value;people()}else{if(['fD','fS','fE'].includes(e.target.id))people();upd()}});
 m.addEventListener('change',e=>{if(e.target.id==='tF'){tf=e.target.value;people()}if(e.target.id==='fR'||e.target.id==='fD'||e.target.id==='fS'||e.target.id==='fE')people();
  if(e.target.dataset.c){e.target.checked?sel.add(e.target.dataset.c):sel.delete(e.target.dataset.c)}upd()});
 g('#tAll').onclick=()=>{(g('#tL')._shown||[]).forEach(i=>sel.add(i));people();upd()};g('#tNone').onclick=()=>{sel.clear();people();upd()};
 if(old)g('#fDel').onclick=()=>{m.remove();del(id)};
 g('#fSave').onclick=()=>{const c=cur(),r=upd();if(r.E.length)return T('Resolve the conflicts first');save(old,c);m.remove()};
 people();upd()}
function save(old,c){const n=c.traineeIds.length||c.trainees,rec={date:c.date,start:c.start,end:c.end,room:c.room,course:c.course,instructor:c.instructor,trainees:n,traineeIds:c.traineeIds};rec.title=title(rec);
 if(!old){S().add('sessions',rec);T('Session added')}
 else{const live=S().find('sessions',old.id),b=[],a=[];
  ['date','start','end','room','course','instructor'].forEach(k=>{if(live[k]!==rec[k]){b.push(k+': '+live[k]);a.push(k+': '+rec[k])}});
  const o=new Set(ids(live)),nw=new Set(rec.traineeIds),add=[...nw].filter(i=>!o.has(i)).map(cname),rm=[...o].filter(i=>!nw.has(i)).map(cname);
  if(add.length||rm.length||live.trainees!==rec.trainees){b.push('trainees: '+(live.trainees||0));a.push('trainees: '+rec.trainees+(add.length?' (+'+add.join(', ')+')':'')+(rm.length?' (−'+rm.join(', ')+')':''))}
  const was=live.title||title(live);Object.assign(live,rec);                         /* single audit entry; Store.log persists */
  if(b.length){S().log('sessions','UPDATE '+rec.title,b.join('; '),a.join('; '));T('Session updated')}else{S().log('sessions','UPDATE '+rec.title,'no field changes','saved');T('No changes')}}
 refresh()}
function del(id){const s=S().find('sessions',id);if(!s)return;
 const m=modal(`<div class="hd"><h3>Delete session</h3></div><div class="bd">Delete <b>${esc(s.course)}</b> on ${fD(s.date)}, ${esc(s.start)}–${esc(s.end)} (${esc(s.room)})? This is written to the Audit Log.</div><div class="ft"><button class="btn btn-tonal" data-x>Cancel</button><button class="btn btn-primary" id="dY">Delete</button></div>`);
 m.firstElementChild.classList.add('sm');m.querySelector('#dY').onclick=()=>{S().remove('sessions',id);m.remove();T('Session deleted');refresh()}}
/* repaint planner + push to Dashboard (7-Day Summary, Live Room Status, Audit Log re-render from Store) */
function refresh(){mount();document.dispatchEvent(new CustomEvent('yptrms:tab',{detail:'dashboard'}))}
/* give legacy/seed sessions a readable audit label (in memory; persisted with the next Store write) */
function prep(){try{sess().forEach(s=>{if(!s.title)s.title=title(s);if(!Array.isArray(s.traineeIds))s.traineeIds=[]})}catch(e){}}
document.addEventListener('yptrms:login',()=>{prep();mount()});
document.addEventListener('yptrms:tab',e=>{if(e.detail==='planner'){prep();mount()}});
window.YPlanner={refresh:mount};
})();
</script>

<!-- ===== YPTRMS Stage 2B — Comms Center: paste both blocks right before </body> (after the Planner blocks) ===== -->
<style id="comms-css">
.cm-g{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;align-items:start}.cm-c{display:flex;flex-direction:column;gap:20px;min-width:0}
.cm-f{display:grid;grid-template-columns:1fr 1fr;gap:12px}.cm-f .sp{grid-column:span 2}
.cm-seg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.cm-box{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:6px}.cm-bh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px;background:#F8FAFC;border-bottom:1px solid var(--line)}.cm-bh .in{height:36px;max-width:220px;border-radius:10px}
.cm-l{max-height:210px;overflow:auto}.cm-i{display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}.cm-i:last-child{border:0}.cm-i:hover{background:#EAF0FA}.cm-i input{accent-color:var(--navy);width:17px;height:17px}.cm-i small{color:var(--mut)}
.cm-r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.cm-r:last-child{border:0}.cm-r small{color:var(--mut);font-size:11px}
.cm-pv{white-space:pre-wrap;font-size:12px;background:#F8FAFC;border:1px solid var(--line);border-radius:10px;padding:10px 12px;max-height:200px;overflow:auto;line-height:1.5}
.cm-lg td{font-size:12px}.mini.dis{background:#CBD5E1;color:#64748B;cursor:not-allowed;pointer-events:none}
@media(max-width:1000px){.cm-g{grid-template-columns:1fr}}@media(max-width:600px){.cm-f{grid-template-columns:1fr}.cm-f .sp{grid-column:span 1}}
</style>

<script id="module-comms">
/* YPTRMS Stage 2B — Comms Center. Formal messages (same tone/signature as Dashboard dispatch) to crew, Crew Control / Flight Scheduling, FSS providers.
   Recipients: ACTIVE crew only. Sent history is kept in Store.get('settings').commsLog (persisted by Store.log) and mirrored to the Audit Log. */
(()=>{
if(window.YComms)return;
const S=()=>window.Store,D=window.YDate,$=s=>document.querySelector(s),T=m=>window.YPTRMS.toast(m);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const U=()=>((window.YPTRMS||{}).STATE||{}).session||{name:'Flight Operations Training',id:'-'};
const fm=t=>window.YDispatch&&window.YDispatch.formal?window.YDispatch.formal(t):t,P2=n=>String(n).padStart(2,'0');
const mkRef=()=>{const n=new Date();return'YPTRMS/COM/'+n.getFullYear()+P2(n.getMonth()+1)+P2(n.getDate())+'-'+P2(n.getHours())+P2(n.getMinutes())};
const sig=()=>{const u=U();return'Respectfully,\n'+u.name+' (Staff ID '+u.id+')\nFlight Operations Training Department\nYemenia Airways — Aden HQ'};
const fD=s=>new Date(s+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
const active=()=>S().get('crew').filter(c=>c.status==='Active'),sess=()=>S().get('sessions');
const slabel=s=>`${s.date} ${s.start} · ${s.course} · ${s.room}`;
const KINDS={Reminder:['Training session reminder','This is a reminder of the following training session.'],Change:['CHANGE to training session','Please note the following CHANGE to the scheduled training session. Updated details are shown below.'],Cancellation:['CANCELLATION of training session','The following training session is CANCELLED. A new date, if applicable, will be communicated separately.'],Roster:['Training roster and attendance','You are assigned to the following training session.']};
let st=null,ready=0,cq='';
const fresh=()=>({tpl:'session',kind:'Reminder',sid:'',crew:new Set(),cont:new Set(),fss:new Set(),subj:'',body:'',edited:false,sent:{},ref:''});
const root=()=>$('#tab-comms');
function details(s){return['Course: '+s.course,'Date: '+fD(s.date),'Time: '+s.start+' – '+s.end,'Venue: '+s.room,'Instructor: '+s.instructor].join('\n')}
function auto(){if(st.edited)return;
 if(st.tpl==='session'){const s=S().find('sessions',st.sid);
  if(!s){st.subj='';st.body='';return}
  const k=KINDS[st.kind];st.subj=k[0]+' — '+s.course+', '+s.date;
  st.body=k[1]+'\n\n'+details(s)+(st.kind==='Cancellation'?'':'\n\nAttendance is recorded by scanning the QR code displayed at the room entrance on arrival. Participants are requested to be present before the scheduled start time.')}
 else if(st.tpl==='cred'){st.subj='Notice of qualification status';st.body=''}
 else{st.subj='';st.body=''}}
/* ---------- recipients & message assembly ---------- */
function recips(){const R=[];
 active().filter(c=>st.crew.has(c.id)).forEach(c=>R.push({key:'c'+c.id,name:c.rank+' '+c.name,phone:c.phone,email:c.email,crew:c}));
 S().get('contacts').filter(c=>st.cont.has(c.id)).forEach(c=>R.push({key:'d'+c.id,name:c.dept+' — '+c.name,phone:c.phone,email:c.email}));
 S().get('fss').filter(f=>st.fss.has(f.id)).forEach(f=>R.push({key:'f'+f.id,name:(f.poc&&!/to be set/i.test(f.poc)?f.poc+', ':'')+f.name,phone:f.whatsapp,email:f.email}));
 return R}
function credLines(c){const l=(c.creds||[]).filter(z=>z.expiry).map(z=>({...z,d:D.daysTo(z.expiry)})).filter(z=>z.d<=90).sort((a,b)=>a.d-b.d);
 return l.length?l.map(z=>'- '+z.name+': '+(z.d<0?'EXPIRED on '+z.expiry+' ('+(-z.d)+' day(s) ago)':'expires on '+z.expiry+' (in '+z.d+' day(s))')).join('\n'):'- All qualifications are valid for more than 90 days.'}
function paras(r){const p=[];
 if(st.tpl==='cred'){
  if(r.crew)p.push('This is to notify you of the current status of your qualifications:\n'+credLines(r.crew)+'\n\nPlease contact the Flight Operations Training Department, Aden HQ, to arrange revalidation where required.');
  else p.push('Qualification status of the following crew members:\n'+active().filter(c=>st.crew.has(c.id)).map(c=>c.rank+' '+c.name+' (Staff ID '+c.staffId+', '+c.fleet+')\n'+credLines(c)).join('\n\n')+'\n\nPlease roster accordingly. Crew with an expired qualification must not be rostered until revalidation is completed and recorded.')}
 if(st.body.trim())p.push(st.body.trim());return p}
const msg=(r,bulk)=>({subject:'Yemenia Flight Operations Training — '+st.subj.trim(),
 body:fm('Attention: '+(bulk?'All concerned':r.name)+'\nReference: '+st.ref+'\nSubject: '+st.subj.trim()+'\n\n'+(bulk?[st.body.trim()]:paras(r)).join('\n\n')+'\n\n'+sig())});
const digits=p=>String(p||'').replace(/\D/g,'');
function go(url,blank){const a=document.createElement('a');a.href=url;a.rel='noopener';if(blank)a.target='_blank';a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),600)}
function copy(t){try{navigator.clipboard.writeText(t).then(()=>T('Message copied'),()=>T('Copy failed'))}catch(e){const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy');T('Message copied')}catch(z){T('Copy failed')}x.remove()}}
const ready2=()=>st.subj.trim()&&(st.body.trim()||st.tpl==='cred');
/* ---------- layout ---------- */
function mount(){const r=root();if(!r||!window.YPTRMS||!window.YPTRMS.STATE.session)return;
 if(!ready){st=fresh();r.innerHTML=`<div class="cm-g"><div class="cm-c"><div class="card"><div id="cmForm"></div></div><div class="card"><h3><i data-lucide="users" class="ico"></i>Recipients</h3><div id="cmRec"></div></div><div class="card"><h3><i data-lucide="send" class="ico"></i>Send</h3><div id="cmSend"></div></div></div>
  <div class="cm-c"><div class="card"><h3><i data-lucide="history" class="ico"></i>Sent Log</h3><div id="cmLog"></div></div></div></div>`;ready=1;
  r.addEventListener('click',onClick);r.addEventListener('input',onInput);r.addEventListener('change',onChange)}
 form();rec();send();log()}
function form(){const list=sess().filter(s=>s.date>=D.addDays(-1)).sort((a,b)=>a.date+a.start<b.date+b.start?-1:1);
 $('#cmForm').innerHTML=`<h3><i data-lucide="mail" class="ico"></i>Compose Formal Message</h3>
 <div class="cm-seg">${[['session','Training session'],['cred','Qualification status'],['general','General notice']].map(([k,l])=>`<button class="chip ${st.tpl===k?'on':''}" data-tpl="${k}">${l}</button>`).join('')}<div class="grow"></div><button class="btn btn-tonal sm" data-new><i data-lucide="file-plus" class="ico"></i>New message</button></div>
 <div class="cm-f">${st.tpl==='session'?`<label class="lb sp">Session (from Training Planner)<select class="in" id="cmSid"><option value="">— select a session —</option>${list.map(s=>`<option value="${s.id}" ${s.id===st.sid?'selected':''}>${esc(slabel(s))}</option>`).join('')}</select></label>
  <label class="lb sp">Message type<select class="in" id="cmKind">${Object.keys(KINDS).map(k=>`<option ${k===st.kind?'selected':''}>${k}</option>`).join('')}</select></label>`:''}
  <label class="lb sp">Subject<input class="in" id="cmSubj" value="${esc(st.subj)}" placeholder="Subject"></label>
  <label class="lb sp">${st.tpl==='cred'?'Additional note (optional — each crew member\'s own qualification list is added automatically)':'Message'}<textarea class="in" id="cmBody" style="height:150px" placeholder="Message text">${esc(st.body)}</textarea></label></div>
 <p class="rp" style="font-size:12px;color:var(--mut);margin-top:8px">Greetings are removed and the formal header, reference number and signature are added automatically. Editing the text stops auto-fill until you choose a different type or session.</p>`;lucide.createIcons()}
function rec(){const q=cq.trim().toLowerCase(),cl=active().filter(c=>!q||(c.name+' '+c.staffId+' '+c.rank+' '+c.fleet).toLowerCase().includes(q)).sort((a,b)=>a.name<b.name?-1:1);
 $('#cmRec').innerHTML=`<div class="qh">Active crew <span class="bdg">${st.crew.size} selected</span></div><div class="cm-box"><div class="cm-bh"><input class="in" id="cmQ" placeholder="Search name or Staff ID" value="${esc(cq)}"><button class="btn btn-tonal sm" data-all>Select shown</button><button class="btn btn-tonal sm" data-none>Clear</button></div>
  <div class="cm-l">${cl.map(c=>`<label class="cm-i"><input type="checkbox" data-crew="${c.id}" ${st.crew.has(c.id)?'checked':''}><span><b>${esc(c.name)}</b> <small>${esc(c.rank)} · ${esc(c.fleet)} · ${esc(c.staffId)}</small></span>${c.phone||c.email?'':'<span class="bdg a" style="margin-left:auto">No contact</span>'}</label>`).join('')||'<div class="cm-i">No active crew match.</div>'}</div></div>
  <div class="qh">Crew Control / Flight Scheduling</div><div class="ch">${S().get('contacts').map(c=>`<button class="chip ${st.cont.has(c.id)?'on':''}" data-cont="${c.id}">${esc(c.dept)}</button>`).join('')||'<small>None set up in Facilities.</small>'}</div>
  <div class="qh">External FSS providers</div><div class="ch">${S().get('fss').map(f=>`<button class="chip ${st.fss.has(f.id)?'on':''}" data-fss="${f.id}">${esc(f.name)}</button>`).join('')||'<small>None set up in Facilities.</small>'}</div>`}
function send(){const R=recips(),ok=ready2(),bulk=R.filter(r=>r.email);let h='';
 if(!R.length)h='<small style="color:var(--mut)">Select at least one recipient.</small>';
 else if(!ok)h='<small style="color:var(--mut)">Add a subject and a message to enable sending.</small>';
 else{h=R.map(r=>{const bs=(ch,has,ic,l,cls)=>{const k=r.key+'|'+ch,s=st.sent[k];return s==='sent'?`<span class="mini sentb"><i data-lucide="check" class="ico"></i>${l} sent</span>`:s==='opened'?`<button class="mini nv" data-ok="${k}">Confirm ${l} sent</button>`:`<button class="mini ${cls} ${has?'':'dis'}" data-snd="${k}"><i data-lucide="${ic}" class="ico"></i>${l}</button>`};
   return`<div class="cm-r"><div><b>${esc(r.name)}</b><br><small>${esc(r.phone||'no WhatsApp number')} · ${esc(r.email||'no email')}</small></div><div class="qbt">${bs('wa',digits(r.phone),'message-circle','WhatsApp','wa')}${bs('em',r.email,'mail','Email','em')}<button class="mini gy" data-pv="${r.key}"><i data-lucide="eye" class="ico"></i>Preview</button></div></div>`}).join('');
  if(st.tpl!=='cred'&&bulk.length>1)h+=`<div class="cm-r"><div><b>One email to all</b><br><small>${bulk.length} recipients in BCC · generic “All concerned” header</small></div><div class="qbt"><button class="mini em" data-bulk><i data-lucide="mails" class="ico"></i>Email all (BCC)</button><button class="mini gy" data-copy><i data-lucide="copy" class="ico"></i>Copy text</button></div></div>`}
 $('#cmSend').innerHTML=h;lucide.createIcons()}
function log(){const L=(S().get('settings').commsLog||[]).slice(0,25);
 $('#cmLog').innerHTML=L.length?`<div style="overflow:auto"><table class="ora cm-lg"><tr><th>When</th><th>To</th><th>Via</th><th>Subject</th></tr>${L.map(e=>`<tr><td>${new Date(e.ts).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</td><td>${esc(e.to)}</td><td>${e.ch}</td><td>${esc(e.subject.replace(/^Yemenia Flight Operations Training — /,''))}<br><small style="color:var(--mut)">${esc(e.user)}</small></td></tr>`).join('')}</table></div>`:'<small style="color:var(--mut)">Nothing sent yet. Confirmed messages appear here and in the Audit Log.</small>';lucide.createIcons()}
/* ---------- events ---------- */
function onInput(e){const t=e.target;
 if(t.id==='cmSubj'){st.subj=t.value;st.edited=true;send()}else if(t.id==='cmBody'){st.body=t.value;st.edited=true;send()}else if(t.id==='cmQ'){cq=t.value;rec()}}
function onChange(e){const t=e.target;
 if(t.id==='cmSid'){st.sid=t.value;st.edited=false;const s=S().find('sessions',t.value);if(s&&(s.traineeIds||[]).length)st.crew=new Set(s.traineeIds.filter(i=>active().some(c=>c.id===i)));st.sent={};auto();form();rec();send()}
 else if(t.id==='cmKind'){st.kind=t.value;st.edited=false;auto();form();send()}
 else if(t.dataset.crew){t.checked?st.crew.add(t.dataset.crew):st.crew.delete(t.dataset.crew);rec();send()}}
function onClick(e){const g=a=>e.target.closest('['+a+']');let x;
 if(x=g('data-tpl')){st.tpl=x.dataset.tpl;st.edited=false;st.sent={};auto();return form()||send()}
 if(g('data-new')){st=fresh();cq='';return mount()}
 if(g('data-all')){const q=cq.trim().toLowerCase();active().filter(c=>!q||(c.name+' '+c.staffId+' '+c.rank+' '+c.fleet).toLowerCase().includes(q)).forEach(c=>st.crew.add(c.id));rec();return send()}
 if(g('data-none')){st.crew.clear();rec();return send()}
 if(x=g('data-cont')){const k=x.dataset.cont;st.cont.has(k)?st.cont.delete(k):st.cont.add(k);rec();return send()}
 if(x=g('data-fss')){const k=x.dataset.fss;st.fss.has(k)?st.fss.delete(k):st.fss.add(k);rec();return send()}
 if(x=g('data-pv'))return preview(x.dataset.pv);
 if(x=g('data-snd'))return open(x.dataset.snd);
 if(x=g('data-ok'))return confirm(x.dataset.ok);
 if(g('data-bulk'))return bulkMail();
 if(g('data-copy')){const m=msg(null,1);return copy(m.subject+'\n\n'+m.body)}}
function open(k){const [rk,ch]=k.split('|'),r=recips().find(z=>z.key===rk);if(!r||!ready2())return;
 st.ref=st.ref||mkRef();const m=msg(r),em=ch==='em',url=em?'mailto:'+r.email+'?subject='+encodeURIComponent(m.subject)+'&body='+encodeURIComponent(m.body.replace(/\r?\n/g,'\r\n')):'https://wa.me/'+digits(r.phone)+'?text='+encodeURIComponent(m.subject+'\n\n'+m.body);
 if(url.length>3500){copy(m.subject+'\n\n'+m.body);T('Message too long for a link — copied to the clipboard instead')}else go(url,!em);
 st.sent[k]='opened';try{S().log('comms',(em?'EMAIL':'WHATSAPP')+' OPENED',m.subject,r.name)}catch(x){}send()}
function confirm(k){const [rk,ch]=k.split('|'),r=recips().find(z=>z.key===rk);if(!r)return;const m=msg(r),L=S().get('settings');
 L.commsLog=L.commsLog||[];L.commsLog.unshift({ts:new Date().toISOString(),user:U().name,to:r.name,ch:ch==='em'?'Email':'WhatsApp',subject:m.subject,ref:st.ref});L.commsLog=L.commsLog.slice(0,200);
 st.sent[k]='sent';S().log('comms','SENT',m.subject+' → '+r.name,'Sent · '+(ch==='em'?'Email':'WhatsApp')+' · '+st.ref);   /* Store.log persists the settings change too */
 T('Recorded as sent');send();log();document.dispatchEvent(new CustomEvent('yptrms:tab',{detail:'dashboard'}))}
function bulkMail(){if(!ready2())return;st.ref=st.ref||mkRef();const to=recips().filter(r=>r.email).map(r=>r.email),m=msg(null,1),url='mailto:?bcc='+encodeURIComponent(to.join(',')).replace(/%40/g,'@').replace(/%2C/g,',')+'&subject='+encodeURIComponent(m.subject)+'&body='+encodeURIComponent(m.body.replace(/\r?\n/g,'\r\n'));
 if(url.length>3500){copy(m.subject+'\n\n'+m.body);T('Too long for a link — message copied; paste into your mail app')}else go(url);
 S().log('comms','EMAIL OPENED (BCC)',m.subject,to.length+' recipient(s)')}
function preview(rk){const r=recips().find(z=>z.key===rk);if(!r)return;st.ref=st.ref||mkRef();const m=msg(r),d=document.createElement('div');d.className='mo';
 d.innerHTML=`<div class="md"><div class="hd"><h3 class="grow">Preview — ${esc(r.name)}</h3><button class="ic" data-x><i data-lucide="x" class="ico"></i></button></div><div class="bd"><b>${esc(m.subject)}</b><div class="cm-pv" style="margin-top:10px;max-height:60vh">${esc(m.body)}</div></div><div class="ft"><button class="btn btn-tonal" data-x>Close</button></div></div>`;
 d.firstElementChild.classList.add('sm');d.addEventListener('click',e=>{if(e.target===d||e.target.closest('[data-x]'))d.remove()});$('#modal-root').appendChild(d);lucide.createIcons()}
document.addEventListener('yptrms:login',mount);
document.addEventListener('yptrms:tab',e=>{if(e.detail==='comms')mount()});
window.YComms={refresh:mount};
})();
</script>
